#Ore Excavation's /undo_excavation. An undo is refused when the vein mine broke a block in
##creativecompat:vein_undo_denied (ores, storage blocks, budding blocks, spawners, ancient
#debris; filled by KubeJS). Server side.
[vein_undo]
	#Seconds a player waits after a successful undo before the next one. 0 = none.
	#Range: 0 ~ 3600
	cooldownSeconds = 5
	#Also refuse when the vein mine broke a block with a block entity (chests, furnaces...).
	#A restored chest keeps its unrolled loot table, so mine-and-undo would reroll structure loot.
	denyBlockEntities = true

#JEI recipe screen tweaks (client side).
[jei]
	#When the recipe screen is opened over a screen that can take recipe transfers (crafting table,
	#inventory, modded crafting GUIs), list the recipes whose + button is enabled first. The rest follow,
	#most-complete first (the share of inputs you already have). Other screens keep JEI's own order.
	#Takes effect the next time a recipe lookup opens.
	craftableFirst = true
	#Order JEI's ingredient list by the pack's definition (kubejs/startup_scripts/jei/order.js) and its
	#creativecompat:jei/... tags: by type (items, multiblocks, fluids, effects), then category, then
	#each category's own order. Ingredients with no place keep JEI's own order ([sorting] in
	#config/jei/jei-client.ini) after the placed ones of their type. Off: JEI's own order only.
	#Takes effect the next time JEI starts (rejoin or /reload). Default off (JEI's order); the pack sets true.
	packOrder = true
	#Write kubejs/exported/jei_order.json at every JEI start: every item, fluid, effect and multiblock with
	#its place in the pack order and whether JEI shows it (shown / hidden by the pack / hidden by a mod /
	#hidden in JEI's edit mode / never in JEI), plus problems in the definition. Render it with
	#python3 tools/jei_order_report.py. Off by default: it takes a moment and a few MB.
	orderReport = false
	#Grouped recipe pages to leave off. A mod that gathers a kind of recipe on a page of its own
	#(seasoning crafts, can crafts, potion buckets, tipped arrows) gives the page an id and asks this list
	#first; a page listed here is not added and its recipes stay on the pages their mods put them on.
	#Ids in this pack: seasoning, cans, potion_buckets, tipped_arrows. Empty: every page is shown.
	#Takes effect the next time JEI starts (rejoin or /reload).
	pagesOff = []
	#How full a fluid looks in JEI tanks (every mod's recipe pages and the pack's own) for its amount.
	#LOG: small amounts stay visible and 250, 1000 and 8000 mB look different. SQRT: a milder curve.
	#LINEAR: JEI's own (fill = amount / tank size, so small amounts are a sliver).
	#Takes effect at once.
	#Allowed Values: LOG, SQRT, LINEAR
	fluidAmountScale = "LOG"

#Container title plaques from GUI resource packs (client side).
[gui_title]
	#When a container title is wider than the plaque the resource pack painted behind it, stretch the
	#plaque to fit. Titles wider than the whole GUI are cut short with "...". Only screens that draw
	#their title the vanilla way (chests, barrels, shulker boxes, hoppers, horses, dispensers, furnaces).
	stretchPlaque = true
	#Record every title that needed a stretch in kubejs/exported/gui_title_overflow.json
	#(screen class, texture, title and widths; kept across sessions). A developer report: off by default.
	logOverflow = true

#Pop-up toasts in the top-right corner (client side).
[toasts]
	#Show tutorial toasts: vanilla's (move, find a tree, punch, craft planks, open inventory,
	#social interactions, bundles), Exposure's camera/lightroom hints and Fairy Lights' Clippy
	#balloons. Takes effect for the next toast. Default on (vanilla); the pack sets false.
	tutorial = false
	#Show advancement toasts (vanilla's "Advancement Made!" and Patchouli's book-unlocked toast).
	#Only matters while [advancements] enabled is on. Default on (vanilla); the pack sets false.
	advancement = false

#Item tooltips (client side).
[tooltips]
	#A tooltip taller than the screen starts at the top and runs off the bottom (vanilla keeps the
	#bottom on screen and cuts off the name). Takes effect on the next frame.
	keepTopOnScreen = true

#Brewin' and Chewin' coasters (client side).
[coaster]
	#WTHIT lines on a coaster: 'Coaster: 3 / 4' ('(put away)' once the coaster itself was taken
	#back) and one line per item on it, in the order they went on.
	wthit = true

#WTHIT look-at overlay lines (client side). See feature_writeup/wthit_lines.md.
[wthit]
	#Block model icons: a block with no item (or whose item draws as the purple/black missing model)
	#shows its own block model in WTHIT's icon slot. Off = WTHIT's empty icon, Display Delight included.
	iconBlockModel = true
	#Block model icons: before drawing the model, ask Forge's hit-aware pick block (what middle-click
	#gives), so a block holding several things shows the part looked at (Supplementaries' skull pile).
	iconForgePick = true
	#Block model icons: use the iconItems list below.
	iconSubstitutes = true
	#Block model icons: when the looked-at block has no item, or its item draws as the purple/black
	#missing model, WTHIT's icon slot shows the block's own model instead. Blocks listed here keep
	#WTHIT's normal icon. Entries: a namespace ('create') or a block id ('create:belt').
	#/cdevdumpicons + tools/wthit_icon_audit.py list every block the icon applies to.
	iconExclude = []
	#Block model icons: an item to show for a block that has none and draws no model of its own
	#(block-entity rendered). Entries 'block=item'. D&D's powered flywheel is Create's flywheel.
	iconItems = ["create_dd:powered_flywheel=create:flywheel"]
	#Supplementaries jars, goblets and cages: 'Contents: Honey (6 / 12)' (fluid in bottles, with the
	#jar's capacity; a goblet just 'Water'), 'Contents: Cookie (5 / 12)', or the mob inside.
	holderContents = true
	#Under a potion in a jar or goblet, one line per effect with its strength and length, as the
	#potion's own tooltip shows them ('Instant Health II', 'Regeneration (0:45)').
	holderPotionEffects = true
	#A one-bottle holder (goblet) shows just the fluid ('Contents: Water'). Off = 'Water (1 / 1)'.
	holderSingleName = true
	#Beehives and bee nests: 'Bees: 2 / 3'. The count comes from the server (WTHIT and the pack's
	#mod on both sides); without it the line is left out.
	hiveBees = true
	#The Bees line takes the place of WTHIT's occupant-names line ('2 Bee') and sits above Honey Level.
	#Off = WTHIT's names line stays and Bees goes at the end.
	hiveBeesOnTop = true
	#Beehives and bee nests: WTHIT's 'Honey Level: 3' becomes 'Honey Level: 3 / 5'. Still follows
	#WTHIT's own 'Show Beehive Honey Level' option.
	hiveHoneyMax = true
	#Numbers kept in block state: 'Servings: 3 / 4' (feasts), 'Slices: 5 / 7' (cakes, pies), 'Eggs' and
	#'Hatching' (nests, turtle eggs), 'Level' (cauldrons WTHIT has no fluid bar for), anchor charges,
	#sea pickles. Rules in assets/creativecompat/state_lines.json (override from kubejs/assets).
	stateLines = true
	#Lit campfires: Unlit Campfire's burn line ('Burns forever' / 'Burn time: 42s'). Server data.
	campfireBurn = true
	#Lit plain campfires: the pack's rain rule ('Rain: Puts it out', 'Going out in 6s', 'Safe (fuel
	#block below)'). Server data.
	campfireRain = true
	#IE sheetmetal tanks: the tank's fluid bar on every part, not only the two fluid ports. Server side.
	sheetmetalTank = true
	#Applied Cooking's ME Kitchen Station: online / offline and the security terminal it is tied to.
	kitchenStation = true
	#FD cooking pot, Farmer's Respite kettle and oven: 'Holding: 3 Glass Bottle, 1 Bucket' for the two
	#leftover slots, and 'Waiting: leftover slots full' while a craft waits for room ([cooking] stallWhenFull).
	remainderBuffer = true
	#Grass-like blocks cut with shears (fertile=false: grass, mycelium, lush grass, grass slabs):
	#'Sheared, prevents spreading and converting to dirt'. Sheared vines ([vine_shearing]) and Vinery's
	#sterilized jungle grape vine: 'Sheared, stops growing'. Weeping, twisting and cave vine and kelp
	#tips and Immersive Weathering ivy at their last age: 'Stopped growing'.
	sheared = true
	#'Silk Touch Required' line: True (green) when nothing drops without Silk Touch, Drops Differently
	#(yellow) when something else drops (block tags creativecommon:wthit/needs_silk_touch and
	#wthit/silk_touch_differs, from tools/gen_silk_touch_blocks.py). Hidden while the main-hand tool has Silk Touch.
	silkTouch = true
	#WTHIT's blacklist hides barriers, structure voids and light blocks from everyone. With this on, players
	#with operatorBlockLevel see the blocks in operatorBlockList; everyone else still sees through them.
	operatorBlocks = true
	#Blocks shown to operators only (block ids).
	operatorBlockList = ["minecraft:barrier", "minecraft:structure_void", "minecraft:light"]
	#Permission level that sees them: 2 = operators who can use /give and command blocks (also single
	#player with cheats on), 4 = server owners only, 0 = every player.
	#Range: 0 ~ 4
	operatorBlockLevel = 2
	#Also show 'Silk Touch Required: False' (red) on every other block. Off by default.
	silkTouchShowFalse = false
	#Flower pots, flower boxes and planter boxes: 'Contains: Poppy' (every plant inside, a box's plants
	#in slot order, '2 Poppy' for a double); a Twigs silt pot 'Rooted Dirt: Yes / No'. A Beautify hanging
	#pot standing on the ground is named 'Rich Pot'.
	potContents = true

	#One switch per state line (a label added by an overriding state_lines.json is always on).
	[wthit.state_lines]
		#'Servings: 3 / 4' (feasts, Rustic Delight pancakes)
		servings = true
		#'Slices: 5 / 7' (cakes, pies, Brewin' cheese wheels and pizza)
		slices = true
		#'Eggs: 3 / 6' (nests, turtle eggs)
		eggs = true
		#'Hatching: 1 / 2' (turtle, crocodile, terrapin eggs)
		hatch = true
		#'Level: 2 / 3' (cauldrons)
		level = true
		#'Charges: 2 / 4' (respawn anchor)
		charges = true
		#'Pickles: 3 / 4' (sea pickles)
		pickles = true

#Immersive Portals rendering (client side).
[immersive_portals]
	#Mirrors farther than this many blocks from the camera are not rendered through and show their
	#glass. 0 = no limit.
	#Range: 0 ~ 512
	mirrorRenderDistance = 12
	#Reflections drawn inside reflections when every portal in the chain is a mirror. Immersive
	#Portals' own maxPortalLayer still caps every portal (and stays the cap for gun portals).
	#Range: 1 ~ 16
	mirrorMaxBounces = 4
	#Blocks of world drawn inside a mirror, rounded up to whole chunks (a hard cut; the mirror fog
	#below fades it instead). 0 = the normal render distance.
	#Range: 0 ~ 512
	mirrorViewDistance = 32
	#Blocks of world drawn through a Portal Gun portal, rounded up to whole chunks (a hard cut; the
	#portalGun fog below fades it). 0 = the normal render distance.
	#Range: 0 ~ 512
	portalGunViewDistance = 32
	#Blocks of world drawn through a Nether portal, rounded up to whole chunks (a hard cut; the nether
	#fog below fades it). Immersive Portals loads the far side to its indirectLoadingRadiusCap (2 chunks
	#in this pack). 0 = the normal render distance.
	#Range: 0 ~ 512
	netherViewDistance = 32

	#Fog drawn while looking through a portal, per portal type. Distances are blocks past the portal
	#plane: clear up to start, full fog at end. enabled = false keeps the normal fog. Keep nether.end at
	#netherViewDistance, portalGun.end at portalGunViewDistance and mirror.end at mirrorViewDistance,
	#where the world seen through stops.
	[immersive_portals.fog]

		#Nether portals.
		[immersive_portals.fog.nether]
			enabled = true
			#Blocks past the portal plane where the fog starts.
			#Range: 0 ~ 1024
			start = 8
			#Blocks past the portal plane where the fog is full (kept above start).
			#Range: 1 ~ 1024
			end = 32

		#Portal Gun portals.
		[immersive_portals.fog.portalGun]
			enabled = true
			#Blocks past the portal plane where the fog starts.
			#Range: 0 ~ 1024
			start = 16
			#Blocks past the portal plane where the fog is full (kept above start).
			#Range: 1 ~ 1024
			end = 32

		#Mirrors.
		[immersive_portals.fog.mirror]
			enabled = true
			#Blocks past the portal plane where the fog starts.
			#Range: 0 ~ 1024
			start = 16
			#Blocks past the portal plane where the fog is full (kept above start).
			#Range: 1 ~ 1024
			end = 32

#Portal Gun portals.
[portalgun]
	#Client side. Gun portals are not rendered through: each shows a flat disc in its color. Walking
	#through still works.
	opaquePortals = false
	#Server side. A gun portal dissolves when its owner is farther than this many blocks from it
	#(checked every heartbeat). Portals also dissolve when the owner logs out or changes dimension.
	#0 = no distance limit.
	#Range: 0 ~ 100000
	despawnDistance = 128
	#Server side. Seconds between a gun portal's distance checks.
	#Range: 1 ~ 600
	heartbeatSeconds = 10

#Developer switches (all off by default).
[debug]

	#Pass-through blocks ([surface.passthrough], plan_passthrough.md 7.3).
	[debug.passthrough]
		#true: time the pass-through hook and log one '[passthrough-timing]' line every 200 ticks, for
		#the server and the client separately: hook calls, total and longest time, entity-ticks inside a
		#pass-through block, neighbor counts, and the tick time they share. Read them with
		#python3 tools/perf/passthrough_timing.py logs/latest.log. Read every tick, so it applies as soon
		#as the file is reloaded (an editor that saves by replacing the file is missed by Forge's watcher:
		#run /cdevreload compat or restart).
		timing = false

#Iron golem farm cooldown (server side). A village is its meeting point (bell) within 64 blocks.
[golems]
	#When a village loses villager-summoned iron golems this fast, its villagers stop summoning for a while.
	#Player-built golems neither count nor are affected.
	enabled = true
	#Golem deaths in one village that start the cooldown.
	#Range: 1 ~ 1000
	deaths = 5
	#Those deaths must fall within this many ticks (12000 = 10 minutes).
	#Range: 1 ~ 10000000
	window = 12000
	#Ticks the village summons no golems (24000 = 1 in-game day).
	#Range: 1 ~ 10000000
	cooldown = 24000

#Block friction for boats only (both sides: the rider's client moves the boat). Players, mobs and items keep
#the block's own slipperiness.
[boat_friction]
	#Use the list below for boats.
	enabled = true
	#"block id=friction" rows. Higher is slipperier; vanilla ice and packed ice 0.98, blue ice 0.989,
	#other blocks 0.6.
	blocks = ["minecraft:blue_ice=0.98", "minecraft:packed_ice=0.96", "minecraft:ice=0.94"]

#Corpse mod decay on world time (server side). Times are in ticks (20 = 1 second, 24000 = 1 in-game day)
#and count while the corpse's chunk is unloaded too (caught up when it loads).
[corpses]
	#Use these rules instead of the Corpse mod's own skeleton_time and despawn time.
	enabled = true
	#A corpse that still holds items turns into a skeleton this long after death (168000 = 7 days).
	#Range: > 0
	skeletonTime = 168000
	#An emptied corpse turns into a skeleton this long after it became empty (600 = 30 s).
	#Range: > 0
	emptySkeletonTime = 600
	#An emptied corpse is removed this long after it became empty, in every dimension (6000 = 5 min).
	#Putting items back in resets it.
	#Range: > 0
	emptyDespawnTime = 6000
	#Nether: a corpse that still holds items turns into a skeleton this long after death (24000 = 1 day).
	#Range: > 0
	netherSkeletonTime = 24000
	#Nether: it turns into a wither skeleton this long after it became a skeleton (24000 = 1 day).
	#It never despawns while it holds items.
	#Range: > 0
	netherWitherTime = 24000
	#Nether: an emptied corpse turns into a skeleton this long after it became empty (300 = 15 s).
	#Range: > 0
	netherEmptySkeletonTime = 300
	#Nether: an emptied skeleton withers this long after it became a skeleton (600 = 30 s).
	#Range: > 0
	netherEmptyWitherTime = 600
	#Dimensions that use the Nether rules.
	netherDimensions = ["minecraft:the_nether"]
	#Dimensions where corpses never turn into skeletons (they keep the player model until removed).
	noDecayDimensions = ["minecraft:the_end"]
	#The corpse and its skeleton show only the armor and held items still inside it.
	followContents = true
	#Skeleton corpses (player, ancient and remains) sink in water and lava instead of floating up.
	#Corpses that still show the player model keep the Corpse mod's floating.
	skeletonsSink = true
	#Top sinking speed of a skeleton corpse in water or lava, in blocks per tick (0.1 = 2 blocks a second).
	#Range: 0.01 ~ 2.0
	sinkSpeed = 0.1
	#The corpse screen shows cosmetic armor in 4 slots on its top row and curios in a panel left of the
	#window, each item where it was worn, instead of on the Additional Items pages.
	sectionedScreen = true
	#Curio slots on the corpse screen (columns of 12). Curios past this count stay on the Additional Items pages.
	#Synced to clients through the corpse, so only the server's value counts.
	#Range: 0 ~ 48
	curioCap = 24

#Screen look (client side).
[screens]
	#On: vanilla's dark overlay over the world behind the inventory and other container screens.
	#Off: the world stays undimmed. Menus outside a world (title screen) are unchanged.
	#Takes effect the next time a screen draws.
	dimWorldBehindScreens = true

#Changes to vanilla that need no other mod, one switch each (all on by default).
#Read at game start: restart the game after changing one.
[mixins]
	#Iron golem farm cooldown ([golems]).
	villagerGolemCooldown = true
	#Boat-only block friction ([boat_friction]).
	boatIceFriction = true
	#Sweet berries and glow berries listed in the creative tabs and JEI again.
	blockItemOwnStackFill = true
	#Botanist workbenches placed by structures start with a flower (Beautify).
	structureTemplateBotanistPot = true
	#Sheared vines stop growing ([vine_shearing]).
	vineBlockShear = true
	#Pass-through blocks: each entity's pass-through state and the movement hook ([surface.passthrough]). Off: entities walk through as vanilla.
	insideBlocks = true
	#Pass-through blocks: the tier cached on each block state (off: looked up each time).
	blockStatePass = true
	#Snow layers can be walked through.
	snowLayerPass = true
	#Snow and salt layers fall like sand.
	snowLayerFall = true
	#A placed block replaces snow layers up to [surface] replaceMaxLayers deep.
	snowLayerReplace = true
	#Mobs do not path through deep leaf piles.
	leafPilePath = true
	#Weaker jumps inside deep snow and leaf layers.
	layerJump = true
	#Mobs sunk in snow layers climb out when they walk into a block.
	snowMob = true
	#Path searches of mobs sunk in snow layers start from the layer.
	snowPath = true
	#Pass-through neighbor counts stored in chunks (off: counted each time).
	levelChunkPass = true
	#Pass-through blocks set their own slowdown instead of the cobweb one.
	makeStuckInBlock = true
	#Pass-through state saved with entities; items stuck in webs picked up on touch.
	entityPass = true
	#Climbing and hanging in surrounded webs.
	livingClimb = true
	#Arrows hang in pass-through webs and despawn on their own timer.
	arrowPass = true
	#Fireworks slowed in webs.
	fireworkPass = true
	#Projectiles in surrounded webs hit the web block.
	projectilePass = true
	#Falling blocks splash when they enter water (client).
	fallingBlockWaterSplash = true
	#Entities standing on sinking blocks drawn lower (client).
	entitySinkRender = true
	#The camera lowered on sinking blocks (client).
	cameraSink = true
	#A tooltip taller than the screen keeps its top on screen (client).
	screenTooltipTop = true
	#GUI resource pack title plaques stretched to long titles ([gui_title], client).
	containerTitlePlaque = true
	#Tutorial and advancement toasts filtered ([toasts], client).
	toastFilter = true
	#[screens] dimWorldBehindScreens (client).
	screenBackgroundDim = true
	#Finds a container screen's background for the title plaques (client).
	renderSystemShaderTexture = true
	#HUD effect icons for effects listed in Creative Common's [effects] forceHudIcon (client).
	guiEffectIcon = true
	#Sign text not drawn far from the camera (client).
	signTextDistance = true
	#Field of view ignores block walking speeds (client).
	passFov = true

[melting]
	#Master switch for salt, fire and lava melting. The Salt item click is The Salt's own and not covered.
	enabled = true
	#Salt: reach for every target (meltable and meltable_slow). 1 = touching. Above 1 every
	#target scans a sphere on each roll (salt gives no light to gate it), so keep it at 1 on big glaciers.
	#Range: 0 ~ 4
	saltRange = 1
	#Fire, torches, lanterns, glowstone, magma: reach for meltable targets.
	#Range: 0 ~ 8
	fireRange = 3
	#Lava: reach for meltable targets.
	#Range: 0 ~ 8
	lavaRange = 4
	#Lava: reach for meltable_slow targets (packed ice, cryosol). Blue ice and permafrost
	#(creativecommon:melting/lava_only) melt only touching lava, whatever this says. Other fire never melts them.
	#Range: 0 ~ 8
	slowLavaRange = 2
	#Magma (creativecommon:melting/magma): reach for meltable_slow targets that are not lava_only.
	#Range: 0 ~ 8
	slowMagmaRange = 2
	#Chance per tick (its random tick and each melt tick) that a meltable target with a source in reach
	#melts. Snow layers use snowLayerMeltChance.
	#Range: 0.0 ~ 1.0
	meltChance = 0.4
	#The same for meltable_slow targets, one tier per success.
	#Range: 0.0 ~ 1.0
	slowMeltChance = 0.05
	#Melted ice (#minecraft:ice) leaves a water source; false leaves air. Ultra-warm dimensions
	#(the Nether) always leave air.
	placeWater = true
	#Vanilla melts ice above block light 11 and snow layers above 11, from any light (sea lanterns,
	#shroomlights, redstone lamps). false: only the sources above melt anything (torches, lanterns and
	#glowstone through the fire rule). true: vanilla's light melting runs as well. Serene Seasons' seasonal
	#melt and Immersive Weathering's ice melt are their own and not touched by this.
	vanillaLightMelting = false
	#Blocks in creativecommon:melting/ultrawarm_instant (snow layers, snow blocks, powder snow) become air the
	#moment they are placed in an ultra-warm dimension (the Nether): by hand, dispenser, /setblock or a mod.
	ultraWarmInstantMelt = true
	#"from=to" block ids: what a meltable_slow target becomes when it melts. A meltable_slow block with no
	#row here melts fully, like a meltable one.
	slowSteps = ["minecraft:blue_ice=minecraft:packed_ice", "minecraft:packed_ice=minecraft:ice", "immersive_weathering:permafrost=immersive_weathering:cryosol", "immersive_weathering:cryosol=minecraft:dirt", "architects_palette:polished_packed_ice=minecraft:ice", "architects_palette:chiseled_packed_ice=minecraft:ice", "architects_palette:packed_ice_pillar=minecraft:ice"]
	#Blocks that get random ticks so they can find a fire or lava by themselves (vanilla gives none to these).
	#Ice, frosted ice, snow layers and Immersive Weathering's snowy and frosty blocks tick already. A target left
	#out (packed and blue ice, cryosol, permafrost) is found only by a source's own tick (magma, lava, salt
	#blocks). Sources listed here (Molten Nether Bricks) scan from their own tick like magma. Read once at
	#startup: a change needs a restart.
	extraRandomTickBlocks = ["minecraft:snow_block", "minecraft:powder_snow", "immersive_weathering:thin_ice", "immersive_weathering:snow_bricks", "immersive_weathering:snow_brick_slab", "immersive_weathering:snow_brick_stairs", "immersive_weathering:snow_brick_wall", "immersive_weathering:snow_brick_vertical_slab", "architects_palette:coarse_snow", "architects_palette:molten_nether_bricks"]
	#Chance per tick that a snow layer with a source in reach loses one layer.
	#Range: 0.0 ~ 1.0
	snowLayerMeltChance = 0.8
	#Ticks between melt ticks of a target with a source in reach (75 to 125 percent of this, vanilla scheduled
	#ticks saved with the chunk). 100 = 5 s. 0 = off: targets melt only on random ticks, as before 2026-11-17.
	#Range: 0 ~ 12000
	meltTickInterval = 100
	#Snow (layers, blocks, powder snow) within this reach of a block in creativecommon:melting/magma melts at
	#once: when placed, on magma's own tick, or on its melt tick. 0 = off.
	#Range: 0 ~ 4
	magmaInstantRange = 2
	#No snow forms from snowfall and no water freezes into ice within fireRange of a creativecommon:melting/magma
	#block (the weather's snow and ice placement, server only; world generation is not checked).
	magmaStopsFreezing = true
	#Snow layers one Salt Melt use or one salt dispense removes; a Snow Block counts as 8 layers. A salt block
	#melting by its tick removes one.
	#Range: 1 ~ 8
	saltMeltSnowLayers = 3
	#"from=to" block ids: what a saltable block becomes when salt melts it (shared properties copied). Not
	#listed: ice (#minecraft:ice) becomes water as placeWater says, anything else air. Snow loses layers instead.
	saltProducts = ["minecraft:packed_ice=minecraft:ice", "immersive_weathering:cryosol=minecraft:dirt"]
	#"from=to" block ids: what a meltable target becomes when heat melts it (and salt, when saltProducts has
	#no row), every property the two share copied by name (facing, half, slab type, wall sides, waterlogged).
	#minecraft:water becomes air in ultra-warm dimensions or with placeWater off. Not listed: water for
	##minecraft:ice, else air. A row whose product is missing (mod not loaded) is skipped.
	meltProducts = ["immersive_weathering:snowy_stone=minecraft:stone", "immersive_weathering:snowy_stone_slab=minecraft:stone_slab", "immersive_weathering:snowy_stone_stairs=minecraft:stone_stairs", "immersive_weathering:snowy_stone_wall=immersive_weathering:stone_wall", "immersive_weathering:snowy_stone_vertical_slab=quark:stone_vertical_slab", "immersive_weathering:snowy_cobblestone=minecraft:cobblestone", "immersive_weathering:snowy_cobblestone_slab=minecraft:cobblestone_slab", "immersive_weathering:snowy_cobblestone_stairs=minecraft:cobblestone_stairs", "immersive_weathering:snowy_cobblestone_wall=minecraft:cobblestone_wall", "immersive_weathering:snowy_cobblestone_vertical_slab=quark:cobblestone_vertical_slab", "immersive_weathering:snowy_stone_bricks=minecraft:stone_bricks", "immersive_weathering:snowy_stone_brick_slab=minecraft:stone_brick_slab", "immersive_weathering:snowy_stone_brick_stairs=minecraft:stone_brick_stairs", "immersive_weathering:snowy_stone_brick_wall=minecraft:stone_brick_wall", "immersive_weathering:snowy_stone_brick_vertical_slab=quark:stone_brick_vertical_slab", "immersive_weathering:snowy_chiseled_stone_bricks=minecraft:chiseled_stone_bricks", "immersive_weathering:frosty_glass=minecraft:glass", "immersive_weathering:frosty_glass_pane=minecraft:glass_pane", "immersive_weathering:frosty_grass=minecraft:grass", "immersive_weathering:frosty_fern=minecraft:fern", "immersive_weathering:thin_ice=minecraft:water", "architects_palette:coarse_snow=minecraft:gravel"]
	#Chance multiplier for creativecommon:melting/sluggish targets (snow bricks).
	#Range: 0.0 ~ 1.0
	sluggishMeltFactor = 0.25
	#Hot places: in an ultra-warm dimension (the Nether) every target but the lava_only ones (blue ice,
	#permafrost), and in a creativecommon:melting/hot biome (arid, dry and tropical) ice, snow and frozen decor, take a
	#melt tick this often with no source needed, rolling meltChance each time (the slow tier too). 0 = off.
	#Range: 0 ~ 12000
	hotMeltTickInterval = 20
	#The End: every source (salt, fire, magma, lava) melts only the blocks touching it; no reach, no magma
	#instant zone past the touching blocks.
	endContactOnly = true
	#No minecraft:fire in the End: any placement of it is refused (flint and steel, fire charges, lava, End
	#crystals, commands) and fire already there goes out on its next tick. Soul fire is not affected.
	endNoFire = true

#Item tooltips (client side).
