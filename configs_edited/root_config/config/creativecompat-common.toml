
#Moss block and moss carpet color (client only; the server ignores this section).
[moss]
	#On: moss block and moss carpet take the biome's grass color, like grass blocks.
	#Off: vanilla's fixed green moss. Read when models load: press F3+T or restart after changing it.
	biomeTint = true
	#How far moss follows the grass color. 1.0 = shifts as much as grass does from Lush Caves
	#grass (where moss keeps its vanilla green); 0.0 = vanilla green everywhere. Chunks pick up
	#a change when they re-render (F3+A).
	#Range: 0.0 ~ 1.0
	tintStrength = 1.0

#Shears on a modded vine (Floral Enchantment's flower vines, Botania's solid vine) stop it growing,
#as Quark's Shear Vines does for the vanilla vine. Shears on the tip of a weeping, twisting or cave
#vine or kelp stop it growing longer (1.20's behavior).
[vine_shearing]
	#Shears stop vines growing. Off: shears do nothing to vines (vines already sheared stay so).
	enabled = true
	#Shearing a modded vine also removes the same vine hanging below it, as Quark does.
	cutBelow = true
	#Client: a sheared modded vine is drawn with its bottom trimmed, like Quark's cut vine. Read when
	#models load: press F3+T or restart after changing it.
	trimmedLook = true

#Quark monster boxes (server side).
[monster_box]
	#true: a box stays after it spawns its wave, ejects one reward when the wave is gone, then waits
	#cooldownTicks before it can trigger again; it only breaks while sneaking, and Create drills skip it.
	#false: Quark's own box (breaks itself after spawning).
	vaultMode = true
	#Game ticks between the reward and the box re-arming (72000 = 1 hour).
	#Range: > 20
	cooldownTicks = 72000
	#Loot table rolled once for the reward; one stack of the result is ejected.
	rewardTable = "creativecompat:misc/monster_box_reward"
	#true: the ejected stack is cut to 1 item; false: the stack as the table rolled it.
	rewardSingleCount = false
	#A wave mob farther than this many blocks from its box counts as gone.
	#Range: 4 ~ 256
	leashRange = 24
	#Ticks between checks of an active box's wave.
	#Range: 1 ~ 200
	checkIntervalTicks = 20

#TrashSlot defaults (client side). Screens are full Java class names; F3 can't show them,
#but TrashSlotSaveState.json in the game folder lists every screen opened so far.
[trash_slot]
	#Screens that show the trash slot by default. Each one is switched on once per client, the
	#first time it opens after being added here; pressing the toggle key afterwards still sticks.
	enabledScreens = ["net.minecraft.client.gui.screens.inventory.InventoryScreen", "net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen", "net.minecraft.client.gui.screens.inventory.ContainerScreen", "net.minecraft.client.gui.screens.inventory.CraftingScreen", "net.minecraft.client.gui.screens.inventory.FurnaceScreen", "net.minecraft.client.gui.screens.inventory.BlastFurnaceScreen", "net.minecraft.client.gui.screens.inventory.SmokerScreen", "net.minecraft.client.gui.screens.inventory.AnvilScreen", "net.minecraft.client.gui.screens.inventory.SmithingScreen", "net.minecraft.client.gui.screens.inventory.GrindstoneScreen", "net.minecraft.client.gui.screens.inventory.StonecutterScreen", "net.minecraft.client.gui.screens.inventory.LoomScreen", "net.minecraft.client.gui.screens.inventory.CartographyTableScreen", "net.minecraft.client.gui.screens.inventory.EnchantmentScreen", "net.minecraft.client.gui.screens.inventory.BrewingStandScreen", "net.p3pp3rf1y.sophisticatedbackpacks.client.gui.BackpackScreen"]
	#true: every other container screen (modded machines, storage, ...) also shows it by default,
	#except the ones in excludedScreens. false: only enabledScreens do.
	allContainers = false
	#Never switched on by allContainers.
	excludedScreens = ["net.p3pp3rf1y.sophisticatedbackpacks.client.gui.BackpackSettingsScreen"]
	#Starting position for a screen the player hasn't opened yet: 'class|anchorX|anchorY|x|y'.
	#The anchor is a fraction of the panel (0.5 = center, 1.0 = right/bottom edge) and x/y are
	#pixels from it to the slot's top-left; the slot is 28x28. Screens not listed start under the
	#panel's bottom-right corner. Dragging the slot in game overrides this.
	positions = ["net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen|1.0|1.0|0|-28", "net.p3pp3rf1y.sophisticatedbackpacks.client.gui.BackpackScreen|1.0|1.0|-28|0"]
	#true: each Sophisticated Backpacks tier (leather, copper, iron, gold, diamond, netherite)
	#remembers its own trash slot position and on/off state. false: all backpacks share one.
	splitBackpacksByTier = true

#Pet cats and the Feather on a Stick (server side).
[cats]
	#true: a cast Feather on a Stick sticks to a mob it hits, like a fishing hook (reeling in lets go, no
	#pull), and the caster's tamed cats nearby attack the hooked mob while it stays hooked. Sitting cats and
	#Cozy's Improved Cats cats in Stay mode do not join. false: the feather passes through mobs (Domestication
	#Innovation's own behavior).
	featherHooksMobs = true
	#Hostile mobs (monsters that are not neutral) can be hooked.
	hookHostile = true
	#Peaceful and neutral mobs (animals, villagers, iron golems, wolves, endermen, zombified piglins, ...) can
	#be hooked. The caster's own pets never can.
	hookNeutralAndPassive = false
	#Players other than the caster can be hooked, and the caster's cats attack them. Independent of the
	#server's pvp setting.
	hookPlayers = false
	#A cat that lands an attack on a mob hooked by its owner's feather gets Strength, Resistance and
	#Regeneration for this many seconds (0: no effects).
	#Range: 0 ~ 600
	buffSeconds = 10
	#Level of those three effects (3 = III).
	#Range: 1 ~ 10
	buffLevel = 3

#Immersive Paintings: every modded painting variant is offered on its Datapacks page, built from the
#art in the installed mod jars when the world's data loads (server side). Vanilla paintings come from
#the pack's own datapack, not from here.
[paintings]
	#Build the modded paintings set.
	enabled = true
	#More places to read painting art from (assets/<mod>/textures/painting/<id>.png and the en_us lang),
	#after the installed mods; a later entry wins for the same painting. Paths are relative to the game
	#folder (or absolute). Each entry is a jar or zip (a painting mod, a resource pack that retextures
	#paintings), a folder with assets/ in it, or a folder of jars and zips.
	#Example: ["resourcepacks/My Paintings.zip", "painting_jars"]
	extraSources = []

#TNT shrapnel: when a primed TNT entity or a burning TNT item explodes, it also
#flings out a burst of fast, gravity-immune projectiles mostly along the horizontal
#plane (with some vertical variation) that despawn once they've traveled far enough.
[shrapnel]
	#Master on/off switch for TNT shrapnel.
	enabled = true
	#Number of shrapnel projectiles spawned per TNT explosion, spread evenly around the full circle.
	#Range: 0 ~ 512
	count = 24
	#Base shrapnel speed, in blocks/tick.
	#Range: 0.0 ~ 10.0
	speed = 1.4
	#Random speed variation as a fraction of the base speed (e.g. 0.25 = each piece
	#gets a random speed between 75% and 125% of speed).
	#Range: 0.0 ~ 1.0
	speedVariance = 0.25
	#Max vertical launch angle in degrees, either side of dead-level (0 = perfectly
	#horizontal, 90 = could fire straight up/down). Each piece rolls an independent
	#random angle in [-verticalAngle, +verticalAngle].
	#Range: 0.0 ~ 90.0
	verticalAngle = 15.0
	#Distance in blocks a shrapnel piece travels before it despawns.
	#Range: 0.5 ~ 128.0
	maxDistance = 12.0
	#Damage dealt to whatever a shrapnel piece hits.
	#Range: 0.0 ~ 100.0
	damage = 3.0
	#Item id rendered as the flying shrapnel piece.
	item = "minecraft:iron_nugget"
	#Chain cap: most shrapnel pieces in flight within 32 blocks of a new burst. A burst
	#fires only the pieces left under the cap, so a chain of TNT does not flood the level.
	#0 = no cap.
	#Range: 0 ~ 4096
	maxNearby = 32
	#Shrapnel also hits minecarts, boats, item frames and armor stands (false: living
	#things only, so a burst no longer breaks nearby carts or turns TNT minecarts into items).
	hitsNonLiving = false
	#Damage factor of the explosion of a burning TNT item (fire or lava); its knockback is unchanged.
	#Range: 0.0 ~ 1.0
	itemBlastDamageFactor = 0.5

#Walking on blocks: speed per surface tier (BlockRunner), sticky pistons, framed / copycat
#blocks and visual sinking. Tier contents are the blockrunner:surface/* block tags
#(kubejs blocktags.js). Keep this section the same on server and client, apart from
#[surface.sinking], which is client-side only.
[surface]

	#Walk-speed multiplier per surface tier. 1.0 = normal speed, 1.5 = 50% faster, 0.5 = half.
	#These replace the tier entries in config/blockrunner.json, which now only holds one-off
	#block overrides. The server's values are sent to players. Saving the file re-applies
	#them straight away; you feel a change after stepping onto a new block.
	[surface.speed]
		#Asphalt: Immersive Petroleum asphalt, Create D&D colored asphalt.
		#Range: 0.05 ~ 4.0
		asphalt = 1.5
		#Concrete: vanilla concrete, IE concrete and hempcrete, Engineer's Decor rebar concrete, cinder blocks.
		#Range: 0.05 ~ 4.0
		concrete = 1.4
		#See-through walkway floors: catwalks, floor grating, Quark grate, metal scaffolding.
		#Range: 0.05 ~ 4.0
		grating = 1.3
		#Solid metal: storage blocks, copper, sheet metal and plating, metal fences, gates and trapdoors.
		#Range: 0.05 ~ 4.0
		metal = 1.25
		#Ice and soap: ice, packed/blue ice, soap block, thin ice.
		#Range: 0.05 ~ 4.0
		slippery = 1.25
		#Cut, polished and tiled stone: smooth stone, polished stones, quartz, glazed terracotta.
		#Range: 0.05 ~ 4.0
		constructed_smooth = 1.25
		#Bricks and masonry: every brick and tile family, prismarine, purpur, shingles.
		#Range: 0.05 ~ 4.0
		constructed_brick = 1.25
		#Trodden ground: dirt path, coarse dirt, gravel, cobblestone families.
		#Range: 0.05 ~ 4.0
		natural_path = 1.15
		#Wood: planks, logs, wooden slabs/stairs, fences, gates and trapdoors, scaffolding.
		#Range: 0.05 ~ 4.0
		wood = 1.1
		#Raw rock: stone, deepslate, tuff, calcite, terracotta, ores, obsidian.
		#Range: 0.05 ~ 4.0
		natural_smooth = 1.05
		#Machines and plumbing: processing machines, belts, shafts, casings, tanks, pumps, boilers, logic gates and computers.
		#Range: 0.05 ~ 4.0
		machinery = 1.0
		#Workstations and magic blocks: altars, apothecaries, waystones, anvils, crafting stations.
		#Range: 0.05 ~ 4.0
		functional = 1.0
		#Decor that is not furniture: trim, girders, vents, stepping stones, statues, trophies, coin piles.
		#Range: 0.05 ~ 4.0
		decorative = 1.0
		#Framed / copycat blocks. Only used by an empty frame, or by every frame when [surface.camouflage] copyCamo is false.
		#Range: 0.05 ~ 4.0
		camouflage = 1.0
		#Glass blocks, framed glass, windows, sea lantern.
		#Range: 0.05 ~ 4.0
		glass = 1.0
		#Leftover #minecraft:dirt: grass block, dirt, rooted dirt, rich soil.
		#Range: 0.05 ~ 4.0
		dirt = 1.0
		#Rough, crumbly ground: podzol, mycelium, nylium, netherrack, basalt, raw ore blocks.
		#Range: 0.05 ~ 4.0
		natural_rough = 0.92
		#Soft and fibrous: wool, hay, moss, beds, sponge, sculk. Full blocks also sink (see [surface.sinking]).
		#Range: 0.05 ~ 4.0
		soft = 0.88
		#Loose powder: sand, concrete powder, dust piles, sawdust. Full blocks also sink.
		#Range: 0.05 ~ 4.0
		dust = 0.85
		#Edible blocks: chocolate, cake, pies, melon, pumpkins.
		#Range: 0.05 ~ 4.0
		confectionery = 0.85
		#Crop fields: farmland, rich soil farmland, tilled end stone.
		#Range: 0.05 ~ 4.0
		tilled = 0.8
		#Leaves and hedges.
		#Range: 0.05 ~ 4.0
		leaves = 0.78
		#Snow block, coarse snow, powder snow, and snow layers stood on in leather boots. Walking through snow layers slows by height instead ([surface.passthrough.layers]).
		#Range: 0.05 ~ 4.0
		snow = 0.75
		#One sticky face: sticky pistons and their heads, sticky launchers (see [surface.sticky]).
		#Range: 0.05 ~ 4.0
		sticky = 0.65
		#Squelching ground: mud, clay, wet sponge, dough, flesh blocks. Full blocks also sink.
		#Range: 0.05 ~ 4.0
		spongy = 0.6
		#Whole slime and honey blocks. Full blocks also sink.
		#Range: 0.05 ~ 4.0
		very_sticky = 0.45
		#Furniture and storage: benches, desks, counters, couches, chests, crates, barrels, drawers, cabinets.
		#Range: 0.05 ~ 4.0
		furniture = 1.0
		#Plants and nature props tall enough to stand on: pots, stumps, coral, mushrooms, nests.
		#Range: 0.05 ~ 4.0
		flora = 1.0

	#The sticky tier (sticky pistons, piston heads, sticky launchers).
	[surface.sticky]
		#true: a sticky piston only slows you while its sticky face points up (a piston head
		#only while it's a sticky head). false: every block in the tier slows you whichever way it faces.
		faceUpOnly = true

	#Walk speed on framed / copycat blocks (FramedBlocks, Copycats+, Create copycats).
	[surface.camouflage]
		#true: walk like the camo block (its own tier speed). Hybrid blocks holding several
		#materials use the one inserted most recently. false: the camouflage tier's flat speed.
		#Independent of [surface.sinking] copyCamo.
		copyCamo = true

	#Visual soul-sand-style sinking: entities standing on a full block in the soft, dust,
	#spongy or very_sticky tier (#creativecompat:sinking) are drawn lower, and so is the
	#camera. Collision, hitboxes, movement, mob AI and shadows are untouched.
	[surface.sinking]
		#How far the camera and entities appear to sink, in 1/16-block pixels (soul sand's real sink is 2). 0 = off.
		#Range: 0 ~ 8
		depthPixels = 2
		#true: full framed / copycat blocks (cubes, hybrid double slabs, anything with a full
		#block shape) sink like their camo, the newest one in a hybrid. Frames that aren't a
		#full block never sink, same as any other block. false: frames never sink.
		#Independent of [surface.camouflage] copyCamo.
		copyCamo = true

	#A 'Run Speed' line in WTHIT's look-at overlay: the speed you'd walk at on that block, by
	#the same rules as movement (camo and sticky facing included). Blocks you pass through
	#get no Run Speed line: pass-through blocks get the passThrough lines below, and the few
	#others that slow you from inside (powder snow, bamboo spikes) a 'walking through' line;
	#thin layers (carpet, 1-2 snow layers) show the block beneath, which is the one you walk on.
	#Client-side only; it reads BlockRunner's own speed table, no server traffic.
	[surface.wthit]
		#Master on/off switch for the line.
		enabled = true
		#true: no line on any block at normal speed (1.0), tiered or not.
		hideNormal = true
		#true: name the surface tier after the value, e.g. 'Run Speed: 1.50× (Asphalt)', and add
		#notes: 'from camo', 'sticky face not up', 'block below' (thin layers), 'own speed'
		#(soul sand), 'walking through' (cobwebs and other blocks that slow you from inside).
		showTier = true
		#MULTIPLIER: 1.50× / 0.88×. PERCENT: +50% / -12%.
		#Allowed Values: MULTIPLIER, PERCENT
		format = "MULTIPLIER"
		#true: no line on blocks nothing gives a speed to: no surface tier, no blockrunner.json
		#entry, no speed of their own, and they don't slow you from inside. Those are always 1.0,
		#so this only matters with hideNormal = false: tiered 1.0 blocks (Glass, Dirt) still show.
		hideUntyped = true
		#Pass-through blocks ([surface.passthrough]: crops, ropes, vines, cobwebs, layered blocks):
		#'Walk Through: 0.50× (Dense neighbors) on Farmland (Tilled)' (the block's walk value times
		#the soil's speed; the soil is named only when its speed is not 1.00; layered blocks add '3 of 8
		#layers'), 'Fall Through: 0.20×' or 'Fall Through: stopped' (a surrounded web), and
		#'Neighbors: 3 of 4' for tiers that count them. A pile high enough to act whole gets the Run Speed line.
		#hideNormal hides a 1.00 walk or fall line. No line for a crop below its growth rule or when
		#you are exempt (Depth Strider on a leaf pile). Uses the server's values. false = no lines.
		#Read on every overlay refresh, so a saved change applies at once (see [surface.passthrough]).
		passThrough = true

	#Walking and falling through blocks you stand in rather than on: crops, grass, ropes, vines,
	#cobwebs, barbed wire, berry bushes, layered blocks (snow, leaf piles). Tier contents are the
	#creativecompat:passthrough/<tier> block tags (layers: creativecompat:passthrough_layers; kubejs
	#passthrough_tags.js); a block slows you while your box touches its outline. Several at once: the
	#lowest walk and the lowest fall win. Soil speed (the surface tiers) multiplies with the walk value.
	#Spectators, flying players, elytra gliding and swimming are never slowed. The server's values are
	#sent to players on join and on save. A saved edit applies when Forge's file watcher sees it; an
	#editor that saves by replacing the file is missed: then run /cdevreload compat (Creative
	#Devtools) or restart.
	[surface.passthrough]
		#Master switch. false = every pass-through block behaves as before this system (its
		#own vanilla or mod slowdown).
		enabled = true
		#Ticks a pickable arrow stuck in a block or a web lasts before it despawns (vanilla 1200 = 1
		#minute). Unpickable arrows (skeletons, Infinity, multishot) keep vanilla's minute.
		#Range: 1200 ~ 1728000
		arrowLifeTicks = 12000
		#Long-life arrows per chunk. When one more sticks, the oldest drops to vanilla's minute (and
		#despawns at once if it is already past it).
		#Range: 0 ~ 4096
		arrowLongLifeCap = 128
		#Snowballs, ender pearls, fireballs and the other projectiles that break on impact: ticks one
		#must stay stopped (under 0.05 blocks per tick) inside a web before it breaks where it stopped
		#(an ender pearl teleports there). 0 = off (they break only in a web enclosed on every side).
		#Range: 0 ~ 100
		breakStallTicks = 3

		#Crops grown in thick fields: corn, IE hemp, rice and rice panicles, Vintage Delight oats, wheat, tomatoes.
		[surface.passthrough.dense_crop]
			#Horizontal speed multiplier while inside (1.0 = normal).
			#Range: 0.05 ~ 1.5
			walk = 0.75
			#Multiplier on downward speed each tick, and on fall distance per block passed.
			#Range: 0.0 ~ 1.0
			fall = 1.0
			#ANY: always. HALF: own growth at least half. TALL_HALF: a tall crop's lower block decides for both.
			#Allowed Values: ANY, HALF, TALL_HALF
			growth = "TALL_HALF"
			#Density count: NONE, SIDES (the 4 side-adjacent blocks, same layer) or FACES (the 6
			#face-adjacent blocks). Same-tier blocks count, grown or not.
			#Allowed Values: NONE, SIDES, FACES
			neighbours = "SIDES"
			#Neighbor count at which the dense values apply (above the shape's max: never).
			#Range: 1 ~ 6
			denseFrom = 3
			#Walk multiplier once dense.
			#Range: 0.05 ~ 1.5
			denseWalk = 0.5
			#Fall multiplier once dense.
			#Range: 0.0 ~ 1.0
			denseFall = 1.0
			#Fall damage resets every tick while dense.
			denseResetsFall = false
			#What a count of surroundedAt does: NONE, or WEB (falling stops; hang, climb and sink at web speed).
			#Allowed Values: NONE, WEB
			surrounded = "NONE"
			#Walk slowdown only while moving horizontally through the block (vines).
			walkOnlyMoving = false
			#Dropped items and experience orbs: NONE, or STICK (they stop inside the block).
			#Allowed Values: NONE, STICK
			items = "NONE"
			#With items = STICK: chance per tick that an item inside stops where it is.
			#Range: 0.0 ~ 1.0
			itemStickChance = 0.35
			#Projectiles are slowed in every direction (modded bullets never are).
			projectiles = false
			#Depth Strider boots walk through unslowed.
			depthStriderPasses = false
			#Neighbor count that makes a block surrounded (clamped to the shape's max: 4 or 6).
			#Range: 1 ~ 6
			surroundedAt = 6

		#Every other planted crop, Farmer's Respite coffee.
		[surface.passthrough.crop]
			#Horizontal speed multiplier while inside (1.0 = normal).
			#Range: 0.05 ~ 1.5
			walk = 0.75
			#Multiplier on downward speed each tick, and on fall distance per block passed.
			#Range: 0.0 ~ 1.0
			fall = 1.0
			#ANY: always. HALF: own growth at least half. TALL_HALF: a tall crop's lower block decides for both.
			#Allowed Values: ANY, HALF, TALL_HALF
			growth = "HALF"
			#Density count: NONE, SIDES (the 4 side-adjacent blocks, same layer) or FACES (the 6
			#face-adjacent blocks). Same-tier blocks count, grown or not.
			#Allowed Values: NONE, SIDES, FACES
			neighbours = "NONE"
			#Neighbor count at which the dense values apply (above the shape's max: never).
			#Range: 1 ~ 6
			denseFrom = 3
			#Walk multiplier once dense.
			#Range: 0.05 ~ 1.5
			denseWalk = 0.75
			#Fall multiplier once dense.
			#Range: 0.0 ~ 1.0
			denseFall = 1.0
			#Fall damage resets every tick while dense.
			denseResetsFall = false
			#What a count of surroundedAt does: NONE, or WEB (falling stops; hang, climb and sink at web speed).
			#Allowed Values: NONE, WEB
			surrounded = "NONE"
			#Walk slowdown only while moving horizontally through the block (vines).
			walkOnlyMoving = false
			#Dropped items and experience orbs: NONE, or STICK (they stop inside the block).
			#Allowed Values: NONE, STICK
			items = "NONE"
			#With items = STICK: chance per tick that an item inside stops where it is.
			#Range: 0.0 ~ 1.0
			itemStickChance = 0.35
			#Projectiles are slowed in every direction (modded bullets never are).
			projectiles = false
			#Depth Strider boots walk through unslowed.
			depthStriderPasses = false
			#Neighbor count that makes a block surrounded (clamped to the shape's max: 4 or 6).
			#Range: 1 ~ 6
			surroundedAt = 6

		#Wild crops (Farmer's Delight and other mods).
		[surface.passthrough.wild_crop]
			#Horizontal speed multiplier while inside (1.0 = normal).
			#Range: 0.05 ~ 1.5
			walk = 0.75
			#Multiplier on downward speed each tick, and on fall distance per block passed.
			#Range: 0.0 ~ 1.0
			fall = 1.0
			#ANY: always. HALF: own growth at least half. TALL_HALF: a tall crop's lower block decides for both.
			#Allowed Values: ANY, HALF, TALL_HALF
			growth = "ANY"
			#Density count: NONE, SIDES (the 4 side-adjacent blocks, same layer) or FACES (the 6
			#face-adjacent blocks). Same-tier blocks count, grown or not.
			#Allowed Values: NONE, SIDES, FACES
			neighbours = "NONE"
			#Neighbor count at which the dense values apply (above the shape's max: never).
			#Range: 1 ~ 6
			denseFrom = 3
			#Walk multiplier once dense.
			#Range: 0.05 ~ 1.5
			denseWalk = 0.75
			#Fall multiplier once dense.
			#Range: 0.0 ~ 1.0
			denseFall = 1.0
			#Fall damage resets every tick while dense.
			denseResetsFall = false
			#What a count of surroundedAt does: NONE, or WEB (falling stops; hang, climb and sink at web speed).
			#Allowed Values: NONE, WEB
			surrounded = "NONE"
			#Walk slowdown only while moving horizontally through the block (vines).
			walkOnlyMoving = false
			#Dropped items and experience orbs: NONE, or STICK (they stop inside the block).
			#Allowed Values: NONE, STICK
			items = "NONE"
			#With items = STICK: chance per tick that an item inside stops where it is.
			#Range: 0.0 ~ 1.0
			itemStickChance = 0.35
			#Projectiles are slowed in every direction (modded bullets never are).
			projectiles = false
			#Depth Strider boots walk through unslowed.
			depthStriderPasses = false
			#Neighbor count that makes a block surrounded (clamped to the shape's max: 4 or 6).
			#Range: 1 ~ 6
			surroundedAt = 6

		#Every vine: vanilla, twisting, weeping and cave vines, grape vines, modded vines. Slows only while moving through it.
		[surface.passthrough.vine]
			#Horizontal speed multiplier while inside (1.0 = normal).
			#Range: 0.05 ~ 1.5
			walk = 0.75
