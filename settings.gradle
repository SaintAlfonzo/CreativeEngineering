// One Gradle build for every in-tree mod. Each mod is a subproject that applies the shared
// `ce.forge-mod` convention plugin from build-logic/ (Forge setup, mods.toml expansion, jar
// manifest, jar archive, installToMods), so only mod-specific settings live in its own build.gradle.
//
//   ./gradlew build                      build every mod
//   ./gradlew :exposureBackport:build    build one mod (or `cd <mod> && ./gradlew build`)
//
// Shared versions (Minecraft, Forge, mappings, Java home) are in the root gradle.properties;
// mod_id / mod_version / ... are in each mod's own gradle.properties.
pluginManagement {
    includeBuild 'build-logic'
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'CreativeEngineering'

// The mod folders live under development/; project names (and :task paths) stay the bare mod names.
['creativeCommon', 'exposureBackport', 'creativeLabels', 'repackedStorage', 'creativeCalendar', 'creativeCompat', 'creativeMagic', 'creativeEquipment', 'creativeEngineering'].each { name ->
    include name
    project(":${name}").projectDir = file("development/${name}")
}

// Creative Delight (feature_writeup/creative_delight.md 14.3): the bundle, and its repacked members (ce.forge-repack)
// under development/creativeDelight/members/. Project name = the member's jar_name. The Veggies, Vintage, Fungi,
// Miner's and Display ports are members too (bundle_members, 2026-11-02; folders moved here the same day). Salt, Create:
// The Salt, Canned Goods (repacks) and Golden Food (donor port) joined 2026-11-02 (plan_creative_delight.md J2 to J4).
include 'creativeDelight'
project(':creativeDelight').projectDir = file('development/creativeDelight')
['repackedFarmers': 'farmers', 'repackedOceans': 'oceans', 'portedOceanic': 'oceanic', 'repackedEnds': 'ends', 'repackedNethers': 'nethers', 'backportedRustic': 'rustic', 'backportedRoll': 'roll', 'backportedLargeMeals': 'largemeals', 'repackedDelightful': 'delightful', 'backportedHearth': 'hearth', 'backportedBarbeques': 'barbeques', 'backportedDisplay': 'display', 'backportedVeggies': 'veggies', 'backportedVintage': 'vintage', 'backportedFungi': 'fungi', 'backportedMiners': 'miners', 'repackedSalt': 'salt', 'repackedCreateSalt': 'createsalt', 'repackedCannedGoods': 'cannedgoods', 'portedGolden': 'golden'].each { name, dir ->
    include name
    project(":${name}").projectDir = file("development/creativeDelight/members/${dir}")
}

// Creative Brewing (feature_writeup/creative_brewing.md): the bundle, and its members under
// development/creativeBrewing/members/ (the Vinery and Brewin' and Chewin' ports; project names unchanged).
include 'creativeBrewing'
project(':creativeBrewing').projectDir = file('development/creativeBrewing')
['backportedVinery': 'vinery', 'backportedBrewin': 'brewin'].each { name, dir ->
    include name
    project(":${name}").projectDir = file("development/creativeBrewing/members/${dir}")
}

// Creative Devtools (feature_writeup/creative_devtools.md): the dev-only bundle, and its members under
// development/creativeDevtools/members/ (the perf bot and the client capture driver; project names unchanged).
include 'creativeDevtools'
project(':creativeDevtools').projectDir = file('development/creativeDevtools')
['perfBot': 'perfbot', 'clientCapture': 'capture'].each { name, dir ->
    include name
    project(":${name}").projectDir = file("development/creativeDevtools/members/${dir}")
}

// Creative Worldgen (feature_writeup/creative_worldgen.md): world generation and fauna, and its members under
// development/creativeWorldgen/members/ (More Mooblooms and Baby Mobs; project names and mod ids unchanged).
include 'creativeWorldgen'
project(':creativeWorldgen').projectDir = file('development/creativeWorldgen')
['moreMooblooms': 'mooblooms', 'babyMobs': 'babymobs'].each { name, dir ->
    include name
    project(":${name}").projectDir = file("development/creativeWorldgen/members/${dir}")
}

// Tempad 3.0.4 port: its own jar (nested in Creative Compat until 2026-11-07; planned to fold into Creative Computing).
include 'backportedTempad'
project(':backportedTempad').projectDir = file('development/backportedTempad')
