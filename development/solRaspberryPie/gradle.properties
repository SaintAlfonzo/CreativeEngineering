# solRaspberryPie: Spice of Life: Raspberry Pie Addition (feature_writeup/raspberry_pie.md). Minecraft/Forge/mappings/Java
# settings are shared and live in the root ../../gradle.properties.

mod_id=solraspberrypie
mod_name=Spice of Life: Raspberry Pie Addition
# GPLv3, like everything else of ours (LICENSE.txt). Apple Pie (LGPL-2.1) is only mixed into and linked, never copied.
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.solraspberrypie
mod_authors=SaintAlfonzo
mod_description=Selectable diet bonuses on top of Spice of Life: Apple Pie Edition: a configurable ladder of hearts, attribute tiers, flat effects, effect slots and one-time effect unlocks, driven by food diversity. Drinks leave the food diet and are kept in the Liquid Diet Log. Credits: Spice of Life: Apple Pie Edition (tarinoita) and the Potato and Carrot Edition teams it was forked from.

# Jar file name: solRaspberryPie-<mod_version>.jar
jar_name=solRaspberryPie
mixin_configs=solraspberrypie.mixins.json
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.solraspberrypie
refmap_name=solraspberrypie.refmap.json
