// solRaspberryPie: Spice of Life: Raspberry Pie Addition (mod id solraspberrypie), feature_writeup/raspberry_pie.md.
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle (+ ce.forge-mod-refmap.gradle); the
// shipped jar is ce.forge-bundle's bundleJar, which nests Apple Pie and Carrot unmodified (bundle_external_jars in
// gradle.properties, sha1-pinned; plan_rp_standalone.md P1). The own jar alone is the `-own` classifier.
// libs/ (git-ignored): solapplepie-1.19.2-2.2.0.jar (CurseForge file 4596169), SoL-Carrot-1.19.2-1.14.0.jar,
// jei-1.19.2-forge-11.8.1.1034.jar and appleskin-forge-mc1.19-2.4.2.jar, the same files as the pack's (mods/ or, for
// Apple Pie and Carrot once they leave mods/, the nested copies in this jar).
plugins {
	id 'ce.forge-mod-refmap'
	id 'ce.forge-bundle'
}

// The nested mods' license texts (upstream LICENSE.txt at the NOTICE's tag/commit) next to ours and the NOTICE.
tasks.named('jar', Jar).configure {
	from('licenses') {
		include '*.txt'
		rename { "solRaspberryPie-${it}" }
	}
}

dependencies {
	// Spice of Life: Apple Pie Edition 2.2.0 exactly: accessors and mixins on its private members (section 13.5).
	compileOnly fg.deobf('local:solapplepie-1.19.2:2.2.0')
	// Spice of Life: Carrot Edition 1.14.0: the Food Dictionary sort mixins (plan_diet_books.md phase 2); gated on solcarrot.
	compileOnly fg.deobf('local:SoL-Carrot-1.19.2:1.14.0')
	// JEI: the inventory widget's exclusion area. Optional; the plugin class is only loaded by JEI.
	compileOnly fg.deobf('local:jei-1.19.2-forge:11.8.1.1034')
	// AppleSkin 2.4.2: the food tooltip row mixin (plan_diet_books_r2.md A11); gated on appleskin at that version.
	compileOnly fg.deobf('local:appleskin-forge-mc1.19:2.4.2')
}
