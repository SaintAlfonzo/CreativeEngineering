# Spice of Life: Raspberry Pie Addition. The dollar-brace values come from gradle.properties (mod_*) and the root
# gradle.properties (versions), expanded by build-logic's ce.forge-mod.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/SaintAlfonzo/CreativeEngineering"
credits="Spice of Life: Apple Pie Edition by tarinoita, forked from the Potato Edition (Kevun1) and the Carrot Edition team. Apple Pie and Carrot Edition (LGPL-2.1) are nested unmodified (see solRaspberryPie-NOTICE-nested-LGPL.txt in the jar); no code of theirs is copied."
description='''${mod_description}'''
# Pixel art, adapted: credits in NOTICE-nested-LGPL.txt (in the jar).
logoFile="raspberry_pie_logo.png"
logoBlur=false

# Mod list icon for Catalogue (Forge 1.19.2 itself has no item icon key).
[modproperties.${mod_id}]
catalogueItemIcon="solraspberrypie:liquid_diet_log"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Apple Pie 2.2.0 exactly (its jar reports version 1.19.2-2.2.0): mixins and accessors on its private members. Nested in
# this jar (META-INF/jarjar/), so it is always there unless replaced.
[[dependencies.${mod_id}]]
modId="solapplepie"
mandatory=true
versionRange="[1.19.2-2.2.0]"
ordering="AFTER"
side="BOTH"

# JEI: keeps its overlay clear of the inventory widget.
[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[11,)"
ordering="NONE"
side="CLIENT"

# Spice of Life: Carrot Edition: the Food Dictionary sort (mixins gated on it, plan_diet_books.md phase 2). Nested in this
# jar but optional (plan_rp_standalone.md D6): Raspberry Pie still loads when it is replaced or removed.
[[dependencies.${mod_id}]]
modId="solcarrot"
mandatory=false
versionRange="[1.19.2-1.14.0,)"
ordering="NONE"
side="BOTH"

# AppleSkin: the food tooltip row layout (client mixin gated on it, RpMixinPlugin).
[[dependencies.${mod_id}]]
modId="appleskin"
mandatory=false
versionRange="[2.4,)"
ordering="NONE"
side="CLIENT"
