# terrablenderStub: an empty mod with the id terrablender, nested in Creative Worldgen. Biomes O' Plenty declares TerraBlender
# mandatory, but the pack uses BOP only for the Visceral Heap and places it itself (feature_writeup/visceral_heap.md).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.

mod_id=terrablender
mod_name=TerraBlender stub (Creative Worldgen)
mod_license=GPL-3.0-only
# The lowest version BOP accepts, with no qualifier, so a real TerraBlender wins if one is ever present (test VH-11).
mod_version=2.0.1.128
mod_group_id=com.SaintAlfonzo.terrablenderstub
mod_authors=SaintAlfonzo
mod_description=An empty placeholder that satisfies Biomes O' Plenty's TerraBlender dependency. Contains no TerraBlender code.

# Jar file name: terrablenderStub-<mod_version>.jar
jar_name=terrablenderStub
mixin_configs=none
bundled_in=creativeWorldgen
