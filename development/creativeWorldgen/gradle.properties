# Creative Worldgen: the pack's world generation and fauna (feature_writeup/creative_worldgen.md): structures, locate,
# earth and water fill, terrain adaptation, sky islands, bee nests, wild flowers, leaf decay, loot, mob spawns and caps,
# named mobs, mooshrooms. Carved out of patcherMod on 2026-11-02 (feature_writeup/creative_split.md 7.6, wave 5).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativeworldgen
mod_name=Creative Worldgen
mod_license=GNU GPL3
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativeworldgen
mod_authors=SaintAlfonzo
mod_description=The Creative Engineering pack's world generation and fauna: structure placement, frequencies and biome rules, locate, earth and water fill, terrain adaptation, sky islands, bee nests, wild flowers, leaf decay, loot tuning, mob spawns and caps, named mobs and mooshrooms. Nests More Mooblooms and Baby Mobs. Needs the pack (patcherMod, Creative Compat and KubeJS).
# Jar file name: creativeworldgen-<mod_version>.jar
jar_name=creativeworldgen
# Mixins applied only when their mod is loaded (WorldgenMixinPlugin, a GatedMixinPlugin), SRG names with remap = false.
mixin_configs=creativeworldgen.mixins.json
# Members nested under META-INF/jarjar/ (ce.forge-bundle); each sets bundled_in=creativeWorldgen.
bundle_members=:moreMooblooms,:babyMobs
replaces_jars=moreMooblooms-*.jar,babyMobs-*.jar
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,mixinplugin
shared_base=com.SaintAlfonzo.creativeworldgen
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
