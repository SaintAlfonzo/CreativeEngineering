# Creative Loot: the pack's loot engine (feature_writeup/creative_loot.md): the chest, block, mob and fishing loot rules
# (global.LOOT, the pre-roll tuning, the LootJS layer) and the global loot modifier merge (GlmMerge). Split out of
# Creative Worldgen on 2026-11-17 (plan_rules_fixes.md section 5b, D13).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativeloot
mod_name=Creative Loot
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativeloot
mod_authors=SaintAlfonzo
mod_description=The Creative Engineering pack's loot engine: chest loot tuning (removals, frequencies, packed food, additions), block, mob and fishing drop rules, and one merged list of every mod's global loot modifiers. Needs the pack (Creative Common, Creative Compat and KubeJS).
# Jar file name: creativeloot-<mod_version>.jar
jar_name=creativeloot
# One mixin (LootModifierManagerMixin, Forge's own class, always present): no plugin, default config name.
mixin_configs=creativeloot.mixins.json
# No Mixin refmap: the mixin uses the SRG method name with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
