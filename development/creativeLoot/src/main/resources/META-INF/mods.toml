# Creative Loot (feature_writeup/creative_loot.md): the pack's loot engine and the global loot modifier merge. Registers
# nothing; its loot scripts run through KubeJS and GlmMerge hooks Forge's LootModifierManager.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.creativeloot]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.creativeloot]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# Creative Common: KubeJS, the shared helpers and the startup script loader.
[[dependencies.creativeloot]]
modId="creativecommon"
mandatory=true
versionRange="[1.1.0,)"
ordering="AFTER"
side="BOTH"
# Creative Compat: required by every other Creative jar (creative_split.md 7.6).
[[dependencies.creativeloot]]
modId="creativecompat"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
# LootJS: the post-roll layer of the loot scripts (loot/00_lib.js, 05_tuning.js, 10 to 40).
[[dependencies.creativeloot]]
modId="lootjs"
mandatory=true
versionRange="[2.9.1,)"
ordering="AFTER"
side="BOTH"
