# Creative Delight: the Delight add-ons the pack owns, in one jar (feature_writeup/creative_delight.md).
# Plugin ce.forge-bundle (build-logic): this project's own jar (the @Mod class, CD's config, its startup scripts and
# the server/client script trees from the pack folder, 10.4) plus each member's jar nested under META-INF/jarjar/.
mod_id=creative_delight
mod_name=Creative Delight
mod_license=GNU GPL3
# The pack's own scheme for the CD jar (Q17): 1.0.0, then 1.0.01, 1.0.02.
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativedelight
mod_authors=SaintAlfonzo; members by their upstream authors (see each NOTICE)
mod_description=The Delight add-ons the Creative Engineering pack ships, in one jar: each member keeps its own mod id and namespace. Needs the pack (patcherMod and KubeJS).
jar_name=creative_delight
# Java compartments (creative_delight.md 12): mixins applied only when their mod is loaded (compat/CDMixinPlugin).
mixin_configs=creative_delight.mixins.json

# Members, nested in this order (each sets bundled_in=creativeDelight). Farmer's Delight first, the base (21); the
# four ports join later (14.3 order).
bundle_members=:repackedFarmers,:repackedOceans,:repackedOceanic,:repackedEnds,:backportedRustic,:repackedDelightful,:endersAdditions
# installToMods moves these out of mods/ (the members' old standalone jars) to jar_archive/displaced/.
replaces_jars=FarmersDelight-*.jar,oceansdelight-*.jar,oceanic_delight-*.jar,ends_delight-*.jar,repackedOceans-*.jar,repackedOceanic-*.jar,repackedEnds-*.jar,repackedFarmers-*.jar,rusticdelight-*.jar,backportedRustic-*.jar,Delightful-*.jar,repackedDelightful-*.jar
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.creativedelight
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
