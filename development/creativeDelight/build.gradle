// creativeDelight: the Creative Delight jar (feature_writeup/creative_delight.md 10, 14.2, 14.3 B6). The bundling
// (members nested under META-INF/jarjar/, metadata.json) is build-logic/src/main/groovy/ce.forge-bundle.gradle;
// this file adds what is specific to CD:
//   - the CD script trees, authored in the pack folder so /reload and F3+T pick them up without a rebuild (10.4),
//     copied into the jar at the same resource paths:
//       kubejs/data/creative_delight/kubejs/    -> data/creative_delight/kubejs/    (server scripts)
//       kubejs/assets/creative_delight/kubejs/  -> assets/creative_delight/kubejs/  (client scripts)
//       kubejs/data/creative_delight/worldgen/  -> data/creative_delight/worldgen/  (wild crop features, 24)
//       kubejs/data/creative_delight/cup_conversion/ -> data/creative_delight/cup_conversion/ (Miner's cups, 27)
//     Startup scripts live in this project (src/main/resources/kubejs_startup/creative_delight/), loaded from the
//     jar by patcherMod's startup loader.
//   - creative_delight_members.txt: the mod ids of bundle_members, read by CreativeDelight / CDConfig (one list).
//   - -Pcd_test_suite: also packs the scratch test suite (tools/creative_delight_test/, all three script types)
//     into the jar, for the jar-path checks of SQ-CDT. Never for a release (build_deploy refuses such a jar).
// Build: ./gradlew :creativeDelight:build --offline   Install: ./gradlew :creativeDelight:installToMods
plugins {
    id 'ce.forge-bundle'
}

dependencies {
    // Fruits Delight compartment (compat/FruitsDelightHooks). SRG-named jar; only its own type is used.
    compileOnly 'local:fruitsdelight:0.5.11'
    // QoL compartments (creative_delight.md 8): the remainder buffer API, CEConfig and CropGrowth are patcherMod's
    // (a hard dependency); the pot (QoL-1), kettle (QoL-1) and WTHIT (QoL-6) jars as in patcherMod/libs.
    compileOnly project(':patcherMod')
    compileOnly 'local:FarmersDelight:1.19.2-1.2.4'
    compileOnly 'local:FarmersRespite:1.19-2.0'
    compileOnly 'local:wthit:1.19.2-forge-5.36.1'
    // Farmer's Respite Kettle tank (farmers_respite.md 2.1): drink <-> fluid pairs from Create's filling / emptying
    // recipes, and the base fluid slot on Respite's JEI page.
    compileOnly 'local:create:1.19.2-0.5.1.i'
    compileOnly 'local:jei:1.19.2-forge-11.8.1.1034'
    // Banana merge (item_merges.md 2.1): the gorilla and sugar glider forage mixins.
    compileOnly 'local:alexsmobs:1.21.1'
}

def scriptTrees = ['data/creative_delight/kubejs', 'assets/creative_delight/kubejs']
def dataTrees = ['data/creative_delight/worldgen', 'data/creative_delight/cup_conversion']
def testSuite = rootProject.file('tools/creative_delight_test/suite')
def withTestSuite = project.hasProperty('cd_test_suite')

def membersFile = layout.buildDirectory.file('generated/cd_members/creative_delight_members.txt')
def writeMembers = tasks.register('writeMembersList') {
    def ids = providers.provider {
        (findProperty('bundle_members') ?: '').toString().split(',')*.trim().findAll { it }
                .collect { project(it).findProperty('mod_id').toString() }
    }
    inputs.property('ids', ids)
    outputs.file(membersFile)
    doLast {
        def f = membersFile.get().asFile
        f.parentFile.mkdirs()
        f.text = '# Mod ids of the members nested in this jar (generated from bundle_members)\n' + ids.get().join('\n') + '\n'
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn writeMembers
    from(membersFile)
    (scriptTrees + dataTrees).each { tree ->
        from(rootProject.file("kubejs/${tree}")) {
            into tree
            exclude '**/*.md'
        }
    }
    inputs.property('cd_test_suite', withTestSuite)
    if (withTestSuite) {
        from(testSuite) {
            exclude '**/*.md'
        }
    }
}

// The scripts in the jar run only through KubeJS; a missing tree means the pack-folder path moved.
tasks.named('jar', Jar).configure {
    doLast {
        def entries = new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { z -> z.entries().collect { it.name } }
        ['kubejs_startup/creative_delight/', 'data/creative_delight/kubejs/', 'assets/creative_delight/kubejs/'].each { dir ->
            if (!entries.any { it.startsWith(dir) && it.endsWith('.js') }) {
                throw new GradleException("creative_delight jar has no scripts under ${dir}")
            }
        }
    }
}

// A test-suite build is a separate jar (creative_delight-<v>-cdtest.jar): never archived, never installed.
if (withTestSuite) {
    tasks.named('bundleJar', Jar).configure { archiveClassifier = 'cdtest' }
    tasks.named('archiveJar').configure { enabled = false }
    tasks.named('installToMods').configure {
        doFirst { throw new GradleException('-Pcd_test_suite builds a scratch-test jar: copy it into the scratch server, never mods/') }
    }
}
