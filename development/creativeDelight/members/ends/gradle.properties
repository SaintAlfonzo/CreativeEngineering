# End's Delight repacked as a Creative Delight member (feature_writeup/creative_delight.md 14.3 B2).
# Plugin ce.forge-repack (build-logic): the upstream jar's classes and resources unchanged, plus this project's
# overlay (mods.toml, NOTICE). Ships nested in creativeDelight's jar only.
# Since 2026-11-02 (plan J1, ends_delight.md 5.9) the overlay also carries a second mod, enders_additions: Ender's
# Delight 1.1.4's End plants, items and dishes, our own code (GNU GPL3), registered under the endersdelight namespace,
# whether or not the installed All Rights Reserved Ender's Delight 1.2.2 (mods/endersdelight-1.19-1.2.2.jar) is loaded.
# Its art and data are read at runtime from the unmodified MIT 1.1.4 jar in <game dir>/enders_upstream/ (donor route;
# the pin that counts is in com/SaintAlfonzo/creativedelight/enders/upstream/UpstreamJars.java). Its mods.toml entry is
# written out in full (the expansion keys below are End's Delight's).
mod_id=ends_delight
mod_name=End's Delight (Creative Delight)
mod_license=MIT (upstream); overlay GNU GPL3
# upstream version verbatim + -ce-19.2-NN, so it is newer than the upstream jar (creative_delight.md 14.1.4)
mod_version=1.19.2-2.1-ce-19.2-03
mod_group_id=cn.foggyhillside.endsdelight
mod_authors=FoggyHillside (End's Delight); repack: SaintAlfonzo
mod_description=An addon mod for Farmer's Delight based around adding culinary content to the end! Repacked for Creative Delight with the pack's dragon drops, Dragon Tooth Knife repair fix and 2.6.1 art.
jar_name=repackedEnds
bundled_in=creativeDelight

upstream_jar=ends_delight-1.19.2-2.1.jar
upstream_sha1=e0d223416d514417389a7a1b77c4d19549791645
upstream_version=1.19.2-2.1
# Overlay mixin: the Dragon Tooth tier repairs with a Dragon Tooth (ends_delight.md 3.3)
mixin_configs=ends_delight.ce.mixins.json
# Overlay copies of upstream files (ends_delight.md 3.1, 3.3): dragon drops need no tool, knife extras added, machete dragon drops = the knife extras (the five
# add_dragon_* modifiers and the GLM list); the 13 End's Delight 2.6.1 retextures (MIT, same author).
replaced_resources=data/ends_delight/loot_modifiers/add_dragon_meat.json=75a01e68b9dfee02fff7d5659ed96277b588021c,data/ends_delight/loot_modifiers/add_dragon_leg.json=26dc4eb77fc5e5d58cd474534e16adcdae2eee74,data/ends_delight/loot_modifiers/add_dragon_tooth.json=bcfd90d2abd379412d648c37f8937b94af9d6cf8,data/forge/loot_modifiers/global_loot_modifiers.json=b57f4dff16b98ba3c94ffb211f4ba37879996c78,assets/ends_delight/textures/block/dragon_meat_stew_detail.png=3225cdc294c9dc0ec752fe86ac2a852e1b69a582,assets/ends_delight/textures/block/steamed_dragon_egg_detail.png=d0e37714b66de82bdd21f953cd82b585ec95ec0c,assets/ends_delight/textures/item/chorus_fruit_wine.png=2125c75ebd07497254a964c8a5c102df4a4d1a77,assets/ends_delight/textures/item/dragon_leg.png=97eadf85043874310d39fd0edffd86dc087b167f,assets/ends_delight/textures/item/ender_sausage.png=96a7af30520f6cb6740bc945c83e15647aa0dd8b,assets/ends_delight/textures/item/raw_ender_sausage.png=4e4d9301f062f18752789299f0d2f869d8c7822f,assets/ends_delight/textures/item/roasted_shulker_meat.png=173f710cad14ff76e660f93c8faefab8fd402ac4,assets/ends_delight/textures/item/roasted_shulker_meat_slice.png=e096c0c7813d0ade4945f5084aff314e2f3e59d2,assets/ends_delight/textures/item/shulker_meat.png=e10d6a8897bd865da6f1cb2099034373678fc5bb,assets/ends_delight/textures/item/shulker_meat_slice.png=af89659a5e2d014328586692c9a38a83c5a036ea,assets/ends_delight/textures/item/shulker_omelette.png=c62378910b3a53c495bbf799f7ec3711e4c0660a,assets/ends_delight/textures/item/smoked_dragon_leg.png=160ef04e5de8abd4bf0a55246f1e39ace9fa3065,assets/ends_delight/textures/item/stir_fried_shulker_meat.png=d5b3c6fbf4a40b1d80288594715e2a9aea1cbc47,data/ends_delight/loot_modifiers/nd_add_dragon_meat.json=0ad6d28df32c471326c2ef376326e8dd1a7225a8,data/ends_delight/loot_modifiers/nd_add_dragon_tooth.json=fe027216e88c61ebbca2d56729ad02d0e42c5e09

# enders_additions (former endersAdditions member, last standalone build 1.1.4-ce-19.2-03)
# Second mod id in this jar: written into creativedelight_members.txt so it has its own [members] switch (SQ-ENM-04b)
bundle_extra_mods=enders_additions
# Donor (record; the pin that counts is in upstream/UpstreamJars.java)
donor_jar=endersdelight-1.1.4.jar
donor_sha1=d1541d70c7dbae71c2a7e1693f512f2166908802
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources"), compiled for the
# enders_additions code only, under its package
shared_sources=packs,upstream
shared_base=com.SaintAlfonzo.creativedelight.enders
# Licence guard (ce.forge-mod checkNoArrResources): nothing of the installed All Rights Reserved Ender's Delight 1.2.2
# jar, and nothing of the 1.1.4 donor, may ship here. Own files: mods.toml, the lang file (merges across jars, only our
# names for the keys 1.1.4 added) and End's Delight's global loot modifier list (same path in 1.2.2, our edited copy of
# End's Delight's file, see replaced_resources).
resource_guard_jars=mods/endersdelight-*.jar,enders_upstream/endersdelight-1.1.4.jar
resource_guard_arr=true
resource_guard_name=Ender's Delight
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta,assets/endersdelight/lang/en_us.json,data/forge/loot_modifiers/global_loot_modifiers.json
