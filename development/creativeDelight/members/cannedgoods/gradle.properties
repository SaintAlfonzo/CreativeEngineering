# Canned Goods repacked as a Creative Delight member (feature_writeup/cans.md 9, plan_creative_delight.md J3).
# Plugin ce.forge-repack (build-logic): the upstream jar's classes and resources unchanged, except the two classes in
# replaced_classes, plus this project's overlay (mods.toml, NOTICE, the two modified classes, the golem dye helper).
# Ships nested in creativeDelight's jar only.
mod_id=canned_goods
mod_name=Canned Goods (Creative Delight)
mod_license=Academic Free License v3.0 (upstream and the modified upstream classes); overlay GNU GPL3
# upstream release version verbatim + -ce-19.2-NN (creative_delight.md 14.1.4). The upstream mods.toml says 1.0.0;
# 1.19.2-3 (the release name) sorts above it, so the repack always beats a stale upstream jar.
mod_version=1.19.2-3-ce-19.2-01
mod_group_id=net.mcreator.cannedgoods
mod_authors=BlueIvey (Canned Goods); repack: SaintAlfonzo
mod_description=Canned food, drinks and the canned golem. Repacked for Creative Delight with a dyeable canned golem.
jar_name=repackedCannedGoods
bundled_in=creativeDelight

upstream_jar=CannedGoods-1.19.2-3.jar
upstream_sha1=9afaf0978e46cebd0d1b7e86fbb35f211e03fc29
upstream_version=1.19.2-3
# no overlay mixins: the golem dye is direct code in the two replaced classes (cans.md 2.3), the manifest gets no MixinConfigs
mixin_configs=none
# Decompiled (Vineflower 1.10.1), mapped to Mojmap, marked modified (AFL 3.0 section 6): the golem's colour data, save
# fields and dye interaction; the renderer's texture lookup. The sha1 pins the upstream bytes each replaces.
replaced_classes=net/mcreator/cannedgoods/entity/CannedGolemEntity.class=70ea144ea9bbf0190749fe5425108f289777ef3b,net/mcreator/cannedgoods/client/renderer/CannedGolemRenderer.class=99a4dd067deabebd6a619ee0b5f3158c4fb16ab5
