# Canned Goods (Creative Delight repack): upstream mods.toml with the display name suffix, our version, a description
# and the forge dependency (creative_delight.md 0.3, 14.1.6). Expanded by ce.forge-mod's processResources.
modLoader="javafml"
loaderVersion="[43,)"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits="Created using mod maker MCreator - https://mcreator.net/about"
displayURL="https://mcreator.net"
authors="${mod_authors}"
description='''${mod_description}'''
[[dependencies.canned_goods]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.canned_goods]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2]"
    ordering="NONE"
    side="BOTH"
