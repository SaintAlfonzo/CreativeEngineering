# incubationAdditions: this pack's additions to Incubation (Team Abnormals): Incubation-style nests for
# Alex's Mobs emus and Untitled Duck Mod ducks and geese. Minecraft/Forge/mappings/Java settings are
# shared and live in the root ../gradle.properties.

mod_id=incubation_additions
mod_name=Incubation Additions
# GPLv3, like everything else of ours (LICENSE.txt)
mod_license=GNU GPL3
mod_version=1.1.0
mod_group_id=com.SaintAlfonzo.incubation_additions
mod_authors=SaintAlfonzo
mod_description=Incubation nests for more birds: emus (Alex's Mobs), ducks and geese (Untitled Duck Mod).

# Jar file name: incubationAdditions-<mod_version>.jar
jar_name=incubationAdditions
mixin_configs=incubation_additions.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,mixinplugin
shared_base=com.SaintAlfonzo.incubation_additions
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
# Nested in Creative Delight since the Creative Split CD carve (2026-11-01, creative_delight.md 34): animal husbandry.
bundled_in=creativeDelight
