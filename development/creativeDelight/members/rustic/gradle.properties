# backportedRustic: Rustic Delight 1.7.0 (PhantomWing, Forge 1.20.1) ported to Forge 1.19.2, a Creative Delight member.
# Replaces the pack's rusticdelight-forge-1.19.2-1.3.0.jar. Minecraft/Forge/mappings/Java settings are shared and live
# in the root ../../../gradle.properties.
#
# Rustic Delight is MIT (PhantomWing, confirmed 2026-11-10). The code is our own (GPL-3.0-only); upstream's textures,
# models, lang and data are baked into src/main/resources by tools/bake_upstream.py (donor jar pinned there, dev
# machine only; feature_writeup/plan_rustic_fold_in.md). NOTICE-upstream-MIT.txt carries the MIT notice.

# Upstream mod id, so every resource location (rusticdelight:bell_pepper_red, ...) and old world keeps working.
mod_id=rusticdelight
mod_name=Rustic Delight (Creative Delight)
mod_license=MIT (upstream art and data); GPL-3.0-only (port code)
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.7.0-ce-19.2-02
mod_group_id=com.SaintAlfonzo.creativedelight.rustic
mod_authors=PhantomWing (Rustic Delight); 1.19.2 backport: SaintAlfonzo
mod_description=Bell peppers in nine colours, coffee, cotton, calamari, pancakes and syrup for Farmer's Delight. Backport of Rustic Delight 1.7.0 to Forge 1.19.2.

# Jar file name: backportedRustic-<mod_version>.jar
jar_name=backportedRustic
mixin_configs=none
bundled_in=creativeDelight
