# backportedRustic: Rustic Delight 1.7.0 (PhantomWing, Forge 1.20.1) ported to Forge 1.19.2, a Creative Delight member.
# Replaces the pack's rusticdelight-forge-1.19.2-1.3.0.jar. Minecraft/Forge/mappings/Java settings are shared and live
# in the root ../../../gradle.properties.
#
# Rustic Delight is All Rights Reserved (code and assets). The jar holds only our own code, written from behaviour;
# upstream's textures, models, lang and data are read at runtime from the unmodified upstream jar in
# <game dir>/rustic_upstream/ (feature_writeup/rustic_delight.md section 5, the Miner's Delight method).

# Upstream mod id, so every resource location (rusticdelight:bell_pepper_red, ...) and old world keeps working.
mod_id=rusticdelight
mod_name=Rustic Delight (Creative Delight)
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.7.0-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativedelight.rustic
mod_authors=PhantomWing (Rustic Delight); 1.19.2 backport: SaintAlfonzo
mod_description=Bell peppers in nine colours, coffee, cotton, calamari, pancakes and syrup for Farmer's Delight. Backport of Rustic Delight 1.7.0 to Forge 1.19.2; reads its art and data from the upstream jar in rustic_upstream/.

# Jar file name: backportedRustic-<mod_version>.jar
jar_name=backportedRustic
mixin_configs=none
bundled_in=creativeDelight

# Donor (record; the pin that counts is in upstream/UpstreamJars.java)
donor_jar=rusticdelight-forge-1.20.1-1.7.0.jar
donor_sha1=bca9adf60b59951ae5049149185da64a6f7b6f8a
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream
shared_base=com.SaintAlfonzo.creativedelight.rustic
# No upstream resources in the jar (ce.forge-mod checkNoUpstreamResources), except the root files we write ourselves
resource_guard_jars=rustic_upstream/rusticdelight-forge-1.20.1-1.7.0.jar
resource_guard_name=Rustic Delight
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta
