# Golden Food 2.0.0 (GGWPJason, Forge 1.19.2, All rights reserved) rebuilt as a Creative Delight member (mod id goldenfood),
# 2026-11-02 (plan_creative_delight.md J4, TODO creativedelight/members #50). The licence is All rights reserved, so the jar
# holds only our own code, written from the mod's behaviour; upstream's textures, models, lang, recipes and loot tables are
# read at runtime from the unmodified upstream jar in <game dir>/goldenfood_upstream/ (the Miner's Delight method).

# Upstream mod id, so every resource location and old world keeps working.
mod_id=goldenfood
mod_name=Golden Food (Creative Delight)
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<build>
mod_version=2.0.0-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativedelight.golden
mod_authors=GGWPJason (Golden Food); rebuild: SaintAlfonzo
mod_description=Golden and enchanted golden versions of vanilla foods. Rebuild of Golden Food 2.0.0 for Creative Delight; reads its art and data from the upstream jar in goldenfood_upstream/.

jar_name=portedGolden
mixin_configs=none
bundled_in=creativeDelight

# Donor (record; the pin that counts is in upstream/UpstreamJars.java)
donor_jar=goldenfood-1.19.2-2.0.0.jar
donor_sha1=4109e4d6d484892b8efc201b1a32b9361df930cd
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream
shared_base=com.SaintAlfonzo.creativedelight.golden
# No upstream resources in the jar (ce.forge-mod checkNoUpstreamResources), except the root files we write ourselves
resource_guard_jars=goldenfood_upstream/goldenfood-1.19.2-2.0.0.jar
resource_guard_name=Golden Food
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta
