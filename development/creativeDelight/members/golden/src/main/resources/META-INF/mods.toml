# Golden Food 2.0.0 rebuilt for Creative Delight (feature_writeup/golden_food.md). Keeps the upstream mod id so every
# resource location and old world matches; art and data are read from goldenfood_upstream/ at runtime.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"

[[mods]]
modId="goldenfood"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.goldenfood]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.goldenfood]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
