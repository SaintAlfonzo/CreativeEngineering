# endersAdditions: the End plants, items and dishes Ender's Delight 1.1.4 (Axedgaming, Forge 1.20.1, MIT) added, rebuilt
# for Forge 1.19.2 as a Creative Delight member. Ender's Delight itself (mod id endersdelight, mods/endersdelight-1.19-1.2.2.jar)
# stays installed as its own jar; this mod adds to it. Minecraft/Forge/mappings/Java settings are shared and live in the
# root ../../../gradle.properties.
#
# Licence: code here is ours (GNU GPL3), written from the 1.1.4 behaviour. The art and data in src/main/resources come
# from the MIT 1.1.4 jar only (NOTICE-upstream-MIT.txt), never from the installed All Rights Reserved 1.2.2 jar.
# Blocks and items register under the endersdelight namespace so their ids match upstream 1.1.4.

mod_id=enders_additions
mod_name=Ender's Delight Additions (Creative Delight)
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.1.4-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativedelight.enders
mod_authors=Axedgaming (Ender's Delight 1.1.4, MIT); 1.19.2 rebuild: SaintAlfonzo
mod_description=Amberveils, Ethereal Saffron, Chorusflame, Void Pepper and five End dishes for Ender's Delight, rebuilt for Forge 1.19.2 from the MIT Ender's Delight 1.1.4 release.

# Jar file name: endersAdditions-<mod_version>.jar
jar_name=endersAdditions
mixin_configs=none
bundled_in=creativeDelight

# Source of the art and data (record)
upstream_jar=devmods/createiveDelight/endersdelight-1.1.4.jar
upstream_sha1=d1541d70c7dbae71c2a7e1693f512f2166908802
# Licence guard (ce.forge-mod checkNoArrResources): the installed Ender's Delight 1.2.2 is All Rights Reserved, so
# nothing of it may ship here. resource_guard_own_files: the root files we write ourselves and the lang file, which merges across jars
# and holds only the keys 1.1.4 added
resource_guard_jars=mods/endersdelight-*.jar
resource_guard_arr=true
resource_guard_name=Ender's Delight
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta,assets/endersdelight/lang/en_us.json
