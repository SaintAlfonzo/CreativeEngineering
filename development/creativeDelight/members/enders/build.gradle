// endersAdditions: Ender's Delight 1.1.4's new End plants, items and dishes rebuilt for Forge 1.19.2 (mod id
// enders_additions, registry namespace endersdelight), nested in Creative Delight.
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle.
// Build from the instance root (`./gradlew :endersAdditions:build`); it ships through `:creativeDelight:installToMods`.
plugins {
    id 'ce.forge-mod'
}

dependencies {
    // Farmer's Delight: ConsumableItem, the Nourishment effect and the creative tab.
    // flatDir notation: 'local:<file name without -version>:<version>'
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
}
