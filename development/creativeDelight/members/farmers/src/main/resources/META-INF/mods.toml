# Farmer's Delight (Creative Delight repack): upstream mods.toml with the display name suffix, our version and
# cleaned dependencies (creative_delight.md 0.3, 14.1.6). Expanded by ce.forge-mod's processResources.
modLoader="javafml"
loaderVersion="[43,)"
license="${mod_license}"
issueTrackerURL="https://github.com/vectorwing/FarmersDelight/issues"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/vectorwing/FarmersDelight"
logoFile="logo.png"
logoBlur=false
credits="Chloe Dawn, Grimmauld, CDAGaming, TelepathicGrunt, ConductiveFoam, simibubi, Jozufozu, bagel, Silk, SkySom, Eutro, RaymondBlaze and many others!"
authors="${mod_authors}"
description='''${mod_description}'''
itemIcon="farmersdelight:stove"
configBackground="minecraft:textures/block/bricks.png"
[[dependencies.farmersdelight]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.farmersdelight]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2,1.20)"
    ordering="NONE"
    side="BOTH"
[[dependencies.farmersdelight]]
    modId="crafttweaker"
    mandatory=false
    versionRange="[10.1.41,)"
    ordering="NONE"
    side="BOTH"
