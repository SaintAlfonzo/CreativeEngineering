# Farmer's Delight repacked as a Creative Delight member, the base every other member needs (creative_delight.md 21).
# Plugin ce.forge-repack (build-logic): the upstream jar's classes and resources unchanged, plus this project's
# overlay (mods.toml, NOTICE; later the backported 1.3.4 features, farmers_delight.md 3). Ships nested in creativeDelight's jar only.
mod_id=farmersdelight
mod_name=Farmer's Delight (Creative Delight)
mod_license=MIT (upstream); overlay GNU GPL3
# upstream version verbatim + -ce-19.2-NN, so it is newer than the upstream jar (creative_delight.md 14.1.4)
mod_version=1.19.2-1.2.4-ce-19.2-02
mod_group_id=vectorwing.farmersdelight
mod_authors=vectorwing (Farmer's Delight); repack: SaintAlfonzo
mod_description=A cozy farming and cooking expansion for Minecraft! Repacked for Creative Delight.
jar_name=repackedFarmers
bundled_in=creativeDelight

upstream_jar=FarmersDelight-1.19.2-1.2.4.jar
upstream_sha1=7474aaf58f3001455db9426d4bf36bc3e80455f1
upstream_version=1.19.2-1.2.4
# The upstream manifest is replaced, so its own config is listed here; overlay configs join it (comma-separated).
mixin_configs=farmersdelight.mixins.json,farmersdelight.ce.mixins.json

# Donor for the backports (creative_delight.md 21.2): the newest Forge build (1.20.1, Forge 47), MIT like the base, so a backported
# class may be decompiled from it (Q6 hybrid). Record only: the build does not read it. File in upstream/donors/.
donor_jar=FarmersDelight-1.20.1-1.3.4.jar
donor_sha1=26f615fd35f652021f5b0f1cba68afa7d578fe15

# Edited upstream files (farmers_delight.md 3): lang (new names, rice and skillet lines), sounds (rope fence gate).
replaced_resources=assets/farmersdelight/lang/en_us.json=cc02f059f8a1d33bac286c300fc30b325e57da01,assets/farmersdelight/sounds.json=6b95df3e46335cfb69ff9f3912c25c5027032151
