# backportedRoll: Roll Delight 1.3.1 (MCreator, Forge 1.20.1) ported to Forge 1.19.2, a Creative Delight member
# (feature_writeup/roll_delight.md). Minecraft/Forge/mappings/Java settings are shared and live in the root
# ../../../gradle.properties.
#
# Roll Delight is All Rights Reserved (code and assets). The jar holds only our own code, written from behaviour;
# upstream's textures and models are read at runtime from the unmodified upstream jar in <game dir>/roll_upstream/
# (the Rustic Delight method).

# Upstream mod id, so every resource location (roll_delight:rice_roll, ...) matches the upstream art.
mod_id=roll_delight
mod_name=Roll Delight (Creative Delight)
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.3.1-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativedelight.roll
mod_authors=Matthewrat27 (Roll Delight); 1.19.2 port: SaintAlfonzo
mod_description=Sushi rolls and slices, two roll medleys and chopsticks for Farmer's Delight. Port of Roll Delight 1.3.1 to Forge 1.19.2; reads its art from the upstream jar in roll_upstream/.

# Jar file name: backportedRoll-<mod_version>.jar
jar_name=backportedRoll
mixin_configs=none
bundled_in=creativeDelight

# Donor (record; the pin that counts is in upstream/UpstreamJars.java)
donor_jar=roll_delight-1.3.1-forge-1.20.1.jar
donor_sha1=e23d48373f2a62c51533d15cd99eb24397f8d8d8
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream
shared_base=com.SaintAlfonzo.creativedelight.roll
# No upstream resources in the jar (ce.forge-mod checkNoUpstreamResources), except the root files we write ourselves
resource_guard_jars=roll_upstream/roll_delight-1.3.1-forge-1.20.1.jar
resource_guard_name=Roll Delight
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta
