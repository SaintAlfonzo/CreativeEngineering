# backportedHearth: Hearth and Harvest 1.4.1 (AlabasterLeking, NeoForge 1.21.1, MIT) ported to Forge 1.19.2 as a Creative
# Delight member, one piece at a time (feature_writeup/hearth_and_harvest.md 4). Minecraft/Forge/mappings/Java settings
# are shared and live in the root ../../../gradle.properties.
#
# Licence: code here is ours (GPL-3.0-only), written for 1.19.2 from the 1.4.1 behaviour. The art and data in
# src/main/resources come from the MIT 1.4.1 jar (NOTICE-upstream-MIT.txt). Ids match upstream (namespace hearthandharvest).
# Watering cans: the copper can keeps 1.4.1's id (hearthandharvest:watering_can, moved here from patcherMod); the
# iron to dragon tiers are pack additions (hearth_and_harvest.md 4.0).

mod_id=hearthandharvest
mod_name=Hearth and Harvest (Creative Delight)
mod_license=MIT (upstream assets) / GPL-3.0-only
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.4.1-ce-19.2-02
mod_group_id=com.SaintAlfonzo.creativedelight.hearth
mod_authors=AlabasterLeking (Hearth and Harvest 1.4.1, MIT); 1.19.2 port: SaintAlfonzo
mod_description=Raspberries and the watering can from Hearth and Harvest 1.4.1, ported to Forge 1.19.2 for Creative Delight.

# Jar file name: backportedHearth-<mod_version>.jar
jar_name=backportedHearth
mixin_configs=none
bundled_in=creativeDelight

# Source of the art and data (record)
upstream_jar=devmods/toBackport/later_large_content_overlap/hearthandharvest-1.21.1-1.4.1.jar
