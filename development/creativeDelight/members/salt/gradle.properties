# Salt repacked as a Creative Delight member (plan_creative_delight.md J2, feature_writeup/salt.md).
# Plugin ce.forge-repack (build-logic): the upstream jar's classes and resources (access transformer
# META-INF/accesstransformer.cfg, mixins.salt.json and its refmap included) unchanged, plus this project's overlay:
# mods.toml, NOTICE and an edited Dissolving (raw rock salt block never dissolves; was CD's SaltRockNoDissolveMixin).
# Ships nested in creativeDelight's jar only.
mod_id=salt
mod_name=Salt (Creative Delight)
mod_license=MIT (upstream); overlay GNU GPL3
# upstream version verbatim + -ce-19.2-NN, so it is newer than the upstream jar (creative_delight.md 14.1.4)
mod_version=1.2.4.1-ce-19.2-01
mod_group_id=io.github.mortuusars.salt
mod_authors=mortuusars (Salt); repack: SaintAlfonzo
mod_description=Worth its weight in gold. Repacked for Creative Delight.
jar_name=repackedSalt
bundled_in=creativeDelight

upstream_jar=salt-1.19.2-1.2.4.1.jar
upstream_sha1=2d9e01126dfbc69ec56c0346ec73ecd6995ea8ea
upstream_version=1.2.4.1
# The upstream manifest is dropped (ce.forge-repack writes its own): name Salt's own mixin config again.
mixin_configs=mixins.salt.json
# Dissolving: overlay holds the decompiled class with the rock salt exemption (src/main/java).
replaced_classes=io/github/mortuusars/salt/Dissolving.class=1b95f0bff40a30f7d18a66c3fb36e8761baf6e9f
