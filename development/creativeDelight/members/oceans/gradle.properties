# Ocean's Delight repacked as a Creative Delight member (feature_writeup/creative_delight.md 14.3 B2).
# Plugin ce.forge-repack (build-logic): the upstream jar's classes and resources unchanged, plus this project's
# overlay (mods.toml, NOTICE, the global loot modifier list). Ships nested in creativeDelight's jar only.
mod_id=oceansdelight
mod_name=Ocean's Delight (Creative Delight)
mod_license=MIT (upstream); overlay GPL-3.0-only
# upstream version verbatim + -ce-19.2-NN, so it is newer than the upstream jar (creative_delight.md 14.1.4)
mod_version=1.0.2-1.19.2-ce-19.2-02
mod_group_id=com.scouter.oceansdelight
mod_authors=Scouter456 (Ocean's Delight); repack: SaintAlfonzo
mod_description=This is a mod that adds food based on the creatures in the ocean. Repacked for Creative Delight (its guardian loot modifier is off).
jar_name=repackedOceans
bundled_in=creativeDelight

upstream_jar=oceansdelight-1.0.2-1.19.2.jar
upstream_sha1=b998d3283c7e4a4b7c71ac00416254df4c90b48b
upstream_version=1.0.2-1.19.2
# Ocean's global loot modifier list without guardian_drop (dishes/ocean #11, D12): the guardian's Guardian Shell comes
# from Hostile's table (CD oceansdelight/loot.js), so the modifier's second shell goes. The overlay ships the list.
replaced_resources=data/forge/loot_modifiers/global_loot_modifiers.json=9347a8c86c5d1e8013d83dbde2fef57ce8a9521e
# no overlay mixins: the manifest gets no MixinConfigs
