# Ocean's Delight (Creative Delight repack): upstream mods.toml with the display name suffix, our version and
# cleaned dependencies (creative_delight.md 0.3, 14.1.6). Expanded by ce.forge-mod's processResources.
modLoader="javafml"
loaderVersion="[43,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Scouter456/Oceans_Delight/issues"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="oceans_delight_logo.png"
credits=""
authors="${mod_authors}"
description='''${mod_description}'''
[[dependencies.oceansdelight]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.oceansdelight]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2,1.20)"
    ordering="NONE"
    side="BOTH"
[[dependencies.oceansdelight]]
    modId="farmersdelight"
    mandatory=true
    versionRange="[1.19-1.2.0,)"
    ordering="NONE"
    side="BOTH"
