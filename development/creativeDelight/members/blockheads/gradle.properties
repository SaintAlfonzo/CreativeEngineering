# blockheadsAdditions: the pack's Cooking for Blockheads additions and changes, a Creative Delight member
# (feature_writeup/kitchen.md 9). Minecraft/Forge/mappings/Java settings are shared and live in the root
# ../../../gradle.properties.
#
# Licence: Cooking for Blockheads 13.3.4 (BlayTheNinth) is All Rights Reserved; its permissions page allows modpack use
# but no rehosting and no published modified versions. So it is not repacked: it stays its own jar in mods/ and this mod
# depends on it. Everything here is ours (GNU GPL3): the code, the rack art (crops of each wood's planks, made in
# textureswapper/rack/), the models (which only name CfB's models as parents) and the data. New blocks register under
# the cookingforblockheads namespace (memory arr-mod-overrides-route); CfB's own files are never copied or overridden.

mod_id=blockheads_additions
mod_name=Cooking for Blockheads Additions (Creative Delight)
mod_license=GNU GPL3
# <upstream version it is built against>-ce-<MC 1.19.2>-<build>
mod_version=13.3.4-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativedelight.blockheads
mod_authors=SaintAlfonzo (for Cooking for Blockheads by BlayTheNinth)
mod_description=Wood spice racks and tool racks, kitchen corner storage, oven fuel and smoking, a full-height fridge and counter-top placement for Cooking for Blockheads.

# Jar file name: blockheadsAdditions-<mod_version>.jar
jar_name=blockheadsAdditions
mixin_configs=blockheads_additions.mixins.json
bundled_in=creativeDelight
# Mixins use SRG member names with remap = false (no refmap), as patcherMod's did
disable_target_validator=true

# Licence guard (ce.forge-mod checkNoArrResources): nothing of the installed All Rights Reserved jar may ship here
resource_guard_jars=mods/cookingforblockheads-*.jar
resource_guard_arr=true
resource_guard_name=Cooking for Blockheads
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta
