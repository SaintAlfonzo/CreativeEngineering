// blockheadsAdditions: the pack's own Cooking for Blockheads content and changes (mod id blockheads_additions, new ids
// under the cookingforblockheads namespace), nested in Creative Delight. Cooking for Blockheads itself is All Rights
// Reserved and stays its own jar in mods/; nothing of it ships here (checkNoArrResources).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle.
// Build from the instance root (`./gradlew :blockheadsAdditions:build`); it ships through `:creativeDelight:installToMods`.
plugins {
    id 'ce.forge-mod'
}

dependencies {
    // flatDir notation: 'local:<file name without -version>:<version>' (libs/, copied from mods/, git-ignored)
    // Cooking for Blockheads and Balm: the racks extend CfB's blocks; the mixins target CfB's oven and corner.
    compileOnly fg.deobf('local:cookingforblockheads-forge-1.19.2:13.3.4')
    compileOnly fg.deobf('local:balm-forge-1.19.2:4.6.0')
    // Farmer's Delight: the cutting board renderer (CuttingBoardRendererOffsetMixin).
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
    // The pack's Brewin' and Chewin' port: the coaster renderer (CoasterRendererOffsetMixin).
    compileOnly project(':backportedBrewin')
}
