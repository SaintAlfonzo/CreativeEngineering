# backportedMiners: Miner's Delight 1.4.5 (Forge 1.20.1) and 1.1.2 (Forge 1.19.2) merged into one Forge 1.19.2 jar.
# Replaces the pack's miners_delight-1.19.2-1.1.2.jar. Minecraft/Forge/mappings/Java settings are shared and live in the
# root gradle.properties.
#
# Miner's Delight is All Rights Reserved (code and assets). The jar holds only our own code, written from behaviour;
# upstream's textures, models, lang and data are read at runtime from the unmodified upstream jar in
# <game dir>/miners_upstream/ (feature_writeup/miners_delight.md D2, D12, D13).

# Upstream mod id, so every resource location (miners_delight:cave_carrot, ...) and old world keeps working.
mod_id=miners_delight
mod_name=Miner's Delight (Creative Delight)
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.4.5-ce-19.2-06
mod_group_id=com.sammy.minersdelight
mod_authors=SammySemicolon (Miner's Delight); 1.19.2 backport: SaintAlfonzo
mod_description=Cave carrots, copper pots, squid, bat and insect food for Farmer's Delight. Backport of Miner's Delight 1.4.5 to Forge 1.19.2; reads its art and data from the upstream jar in miners_upstream/.

# Jar file name: backportedMiners-<mod_version>.jar
# Nested in the Creative Delight jar (creativedelight members #1, 2026-11-02): build and install through
# :creativeDelight: only; the old standalone jars are in CD's replaces_jars.
bundled_in=creativeDelight
jar_name=backportedMiners
mixin_configs=miners_delight.mixins.json
# Same mod id as the stock 1.1.2 jar, so `installToMods` moves that one out of mods/ too.
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream,stations,cdconfig
shared_base=com.sammy.minersdelight
# Mixin refmap (ce.forge-mod-refmap): the FoodProperties accessor uses Mojang names
refmap_name=miners_delight.refmap.json
# D2 (miners_delight.md): no upstream resources in the jar (ce.forge-mod checkNoUpstreamResources). resource_guard_own_files are root
# files the donor also has; ours are our own (the packs only serve assets/ and data/)
resource_guard_jars=miners_upstream/miners_delight-1.20.1-1.4.5-backport.jar,miners_upstream/miners_delight-1.19.2-1.1.2.jar
resource_guard_name=Miner's Delight
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,META-INF/accesstransformer.cfg,pack.mcmeta,miners_delight.mixins.json,miners_delight.refmap.json
