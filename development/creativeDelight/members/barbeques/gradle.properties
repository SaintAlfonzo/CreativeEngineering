# backportedBarbeques: Barbeque's Delight 1.3.0 (lcy0x1, NeoForge 1.21.1, LGPL-2.1) ported to Forge 1.19.2 as a Creative
# Delight member (feature_writeup/barbeques_delight.md 4). Minecraft/Forge/mappings/Java settings are shared and live in
# the root ../../../gradle.properties.
#
# Licence: upstream is LGPL-2.1 (code and assets), so this is a fork: the Java is rewritten for plain Forge 1.19.2 from the
# 1.3.0 sources, the art, models and lang are the 1.3.0 files (NOTICE-upstream-LGPL.txt). Our changes are GPL-3.0-only.
# Ids match upstream (namespace barbequesdelight).

mod_id=barbequesdelight
mod_name=Barbeque's Delight (Creative Delight)
mod_license=LGPL-2.1 (upstream) / GPL-3.0-only (port changes)
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.3.0-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativedelight.barbeques
mod_authors=lcy0x1 and Mao (Barbeque's Delight 1.3.0, LGPL-2.1); 1.19.2 port: SaintAlfonzo
mod_description=Grills and skewers for Farmer's Delight: the Ingredients Basin, the Grill, skewers, seasonings and kebabs. Barbeque's Delight 1.3.0 ported to Forge 1.19.2 for Creative Delight.

# Jar file name: backportedBarbeques-<mod_version>.jar
jar_name=backportedBarbeques
mixin_configs=none
bundled_in=creativeDelight

# Source of the code, art and data (record)
upstream_jar=devmods/toBackport/barbequesdelight-1.3.0.jar
upstream_sha1=b69ee6fdd97d0d01eb0a6e9996912457226da909
