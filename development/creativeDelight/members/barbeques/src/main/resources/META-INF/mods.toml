# Barbeque's Delight 1.3.0 ported to Forge 1.19.2 (Creative Delight member). Registers the upstream ids under the
# barbequesdelight namespace.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"

[[mods]]
modId="barbequesdelight"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Barbeque's Delight by Mao and lcy0x1 (1.3.0 code, art and data, LGPL-2.1)"
description='''${mod_description}'''

[[dependencies.barbequesdelight]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.barbequesdelight]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.barbequesdelight]]
modId="farmersdelight"
mandatory=true
versionRange="[1.19.2-1.2.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.barbequesdelight]]
modId="creativeengineering"
mandatory=true
versionRange="[0,)"
ordering="NONE"
side="BOTH"
