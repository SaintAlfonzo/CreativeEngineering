# Nether's Delight repacked as a Creative Delight member (feature_writeup/nethers_delight.md 4.9, creative_split.md 7.9
# step 2). Plugin ce.forge-repack (build-logic): the upstream jar's classes and resources unchanged, plus this
# project's overlay (mods.toml, NOTICE, the 4.0 carry-overs). Ships nested in creativeDelight's jar only.
mod_id=nethersdelight
mod_name=Nether's Delight (Creative Delight)
mod_license=MIT (upstream); overlay GNU GPL3
# upstream version verbatim + -ce-19.2-NN, so it is newer than the upstream jar (creative_delight.md 14.1.4)
mod_version=1.19-3.1-ce-19.2-01
mod_group_id=umpaz.nethersdelight
mod_authors=Umpaz, SoyTutta (Nether's Delight); repack: SaintAlfonzo
mod_description=A nether expansion for the Farmer's Delight mod! Repacked for Creative Delight with the Nether's Delight 4.0 changes: Potted Mimicarnation, the 4.0 Fungus Colony rules and the moved recipe files.
jar_name=repackedNethers
bundled_in=creativeDelight

upstream_jar=NethersDelight-1.19-3.1.jar
upstream_sha1=844fcf67924c682d65adee493e4dd5ba2f6cc9f3
upstream_version=1.19-3.1
# Upstream mixins (wart, fungus, roots, sprouts) plus the overlay's Fungus Colony mixin (nethers_delight.md 4.4)
mixin_configs=nethersdelight.mixins.json,nethersdelight.ce.mixins.json
# 4.0 carry-overs (nethers_delight.md 4.1, 4.3): the Potted Mimicarnation model with render_type cutout (4.0's file);
# the two recipe files 4.0 moved, left out here and shipped by the overlay at the 4.0 paths
# (data/farmersdelight/recipes/cooking/stuffed_hoglin.json, data/minecraft/recipes/netherite_machete_smithing.json).
replaced_resources=assets/nethersdelight/models/block/potted_mimicarnation.json=8572034bfea89e122ea6dca5189aa7eb5d47044e,data/nethersdelight/recipes/cooking/stuffed_hoglin.json=916798cd3deda1bfe55a42c030222a693d291ebe,data/nethersdelight/recipes/netherite_machete_smithing.json=ec12768f1f5273a6938d07da8a2b9bc59501db79
