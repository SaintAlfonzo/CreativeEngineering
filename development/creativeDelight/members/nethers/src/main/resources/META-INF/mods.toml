# Nether's Delight (Creative Delight repack): upstream mods.toml with the display name suffix, our version and
# cleaned dependencies (creative_delight.md 0.3, 14.1.6). Expanded by ce.forge-mod's processResources.
modLoader="javafml"
loaderVersion="[43,)"
issueTrackerURL="https://github.com/Umpaz/NethersDelight/issues"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Umpaz/NethersDelight"
logoFile="logo.png"
logoBlur=false
credits="Umpaz, SoyTutta, and Sammy;"
authors="${mod_authors}"
description='''${mod_description}'''
itemIcon="nethersdelight:blackstone_stove"
configBackground="minecraft:textures/block/netherrack.png"
[[dependencies.nethersdelight]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.nethersdelight]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2,1.20)"
    ordering="NONE"
    side="BOTH"
[[dependencies.nethersdelight]]
    modId="farmersdelight"
    mandatory=true
    versionRange="[1.19-1.2.4,)"
    ordering="AFTER"
    side="BOTH"
