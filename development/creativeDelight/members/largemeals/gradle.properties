# backportedLargeMeals: Large Meals 1.3.0 (Forge 1.20.1) ported to Forge 1.19.2, a Creative Delight member
# (feature_writeup/large_meals.md). Minecraft/Forge/mappings/Java settings are shared and live in the root
# ../../../gradle.properties.
#
# Large Meals is All Rights Reserved (code and assets). The jar holds only our own code, written from behaviour;
# upstream's textures and models are read at runtime from the unmodified upstream jar in <game dir>/largemeals_upstream/
# (the Rustic and Roll Delight method).

# Upstream mod id, so every resource location (largemeals:omurice, ...) matches the upstream art.
mod_id=largemeals
mod_name=Large Meals (Creative Delight)
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.3.0-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativedelight.largemeals
mod_authors=FoundWiz, jamb (Large Meals); 1.19.2 port: SaintAlfonzo
mod_description=Bowl meals, soups, desserts, three feast blocks and a sheep-dropped mutton rack for Farmer's Delight. Port of Large Meals 1.3.0 to Forge 1.19.2; reads its art from the upstream jar in largemeals_upstream/.

# Jar file name: backportedLargeMeals-<mod_version>.jar
jar_name=backportedLargeMeals
mixin_configs=none
bundled_in=creativeDelight

# Donor (record; the pin that counts is in upstream/UpstreamJars.java)
donor_jar=largemeals-1.20.1-1.3.0.jar
donor_sha1=7662138788a75832a0c6bad6b13b006cac383496
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream
shared_base=com.SaintAlfonzo.creativedelight.largemeals
# No upstream resources in the jar (ce.forge-mod checkNoUpstreamResources), except the root files we write ourselves
resource_guard_jars=largemeals_upstream/largemeals-1.20.1-1.3.0.jar
resource_guard_name=Large Meals
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta
