// repackedDelightful: Delightful 3.4.1 repacked for Creative Delight, with the 3.8.1 items the pack takes
// (feature_writeup/delightful.md 3) added by the overlay. Everything else is in
// build-logic/src/main/groovy/ce.forge-repack.gradle and gradle.properties; the overlay is src/.
// Build: ./gradlew :repackedDelightful:build --offline (ships only inside :creativeDelight:bundleJar).
plugins {
    id 'ce.forge-repack'
}

dependencies {
    // The overlay's pies, feast and foods are Farmer's Delight types; the repacked FD member ships beside it.
    compileOnly files(rootProject.file('development/creativeDelight/upstream/FarmersDelight-1.19.2-1.2.4.jar'))
    // Milkshake cauldrons (compartment DelightfulMilkshakes, only touched when Neapolitan is loaded). SRG-named jars;
    // only their own types are used.
    compileOnly 'local:neapolitan-1.19.2:4.1.0'
    compileOnly 'local:blueprint-1.19.2:6.2.0'
}
