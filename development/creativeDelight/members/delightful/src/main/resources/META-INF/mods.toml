# Delightful (Creative Delight repack): upstream mods.toml with the display name suffix, our version and cleaned
# dependencies (creative_delight.md 0.3, 14.1.6; no updateJSONURL). Expanded by ce.forge-mod's processResources.
modLoader="javafml"
loaderVersion="[43,)"
license="${mod_license}"
issueTrackerURL="https://github.com/brnbrd/Delightful/issues"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/delightful"
logoFile="delightful.png"
logoBlur=false
authors="${mod_authors}"
description='''${mod_description}'''
itemIcon="delightful:smore"
configBackground="farmersdelight:textures/block/tatami_mat_half.png"
[[dependencies.delightful]]
    modId="forge"
    mandatory=true
    versionRange="[43.2,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.delightful]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2,1.20)"
    ordering="NONE"
    side="BOTH"
[[dependencies.delightful]]
    modId="farmersdelight"
    mandatory=true
    versionRange="[1.19-1.2,)"
    ordering="AFTER"
    side="BOTH"
# The milkshake cauldrons hook Neapolitan's milk cauldron (optional; registered only when it is loaded).
[[dependencies.delightful]]
    modId="neapolitan"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.delightful]]
    modId="ars_nouveau"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.delightful]]
    modId="create"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.delightful]]
    modId="byg"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.delightful]]
    modId="undergarden"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
