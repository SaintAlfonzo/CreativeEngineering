# Delightful repacked as a Creative Delight member (feature_writeup/delightful.md 3, creative_delight.md 26).
# Plugin ce.forge-repack (build-logic): the upstream jar's classes and resources unchanged, plus this project's
# overlay (mods.toml, NOTICE, the 3.8.1 items backported into the delightful namespace, the edited lang).
# Ships nested in creativeDelight's jar only.
mod_id=delightful
mod_name=Delightful (Creative Delight)
mod_license=MIT (upstream); overlay GPL-3.0-only
# upstream version verbatim + -ce-19.2-NN, so it is newer than the upstream jar (creative_delight.md 14.1.4)
mod_version=3.4.1-ce-19.2-01
mod_group_id=net.brnbrd.delightful
mod_authors=brnbrd (Delightful); repack and backport: SaintAlfonzo
mod_description=Farmer's Delight addon with mod compatibility features and fun new foods. Repacked for Creative Delight with items from Delightful 3.8.1.
jar_name=repackedDelightful
bundled_in=creativeDelight

upstream_jar=Delightful-1.19.2-3.4.1.jar
upstream_sha1=531b4031e28fc5c72ae2584f9123f9439d633342
upstream_version=3.4.1
# The upstream manifest has no MixinConfigs; the overlay's config hooks the backports into Delightful's constructor.
mixin_configs=delightful.ce.mixins.json

# Donor for the backports: the 1.20.1 build, MIT like the base, so its classes, art and data may be reused with the
# notice kept (Q6 hybrid). Record only: the build does not read it. File in upstream/donors/.
donor_jar=Delightful-1.20.1-3.8.1.jar
donor_sha1=4fff88037d3535158e0ab19525887768e9fc647a

# Edited upstream files: lang (the backported items' names).
replaced_resources=assets/delightful/lang/en_us.json=fdaffcf7879536e38f32542513c07fd7057d51a3
