# Oceanic Delight 1.0.1 (DariusZeBaguette, Forge 1.19.2) rebuilt as a Creative Delight member (mod id oceanic_delight).
# Replaces the former repack (repackedOceanic, which shipped the upstream classes and files) since 2026-11-01:
# the owner moved Oceanic to the donor-jar route (creative_delight.md 33.1, 28.1; TODO creativedelight/framework #3).
# The upstream licence is unclear (its mods.toml says MIT, its Modrinth listing All Rights Reserved), so the jar holds
# only our own code, written from the mod's behaviour; upstream's textures, models, lang and data are read at runtime
# from the unmodified upstream jar in <game dir>/oceanic_upstream/ (the Miner's Delight method).

# Upstream mod id, so every resource location and old world keeps working.
mod_id=oceanic_delight
mod_name=Oceanic Delight (Creative Delight)
mod_license=GPL-3.0-only
# <upstream version>-ce-<MC 1.19.2>-<build>; -02 is the first donor-route build (-01 was the repack)
mod_version=1.0.1-ce-19.2-02
mod_group_id=com.SaintAlfonzo.creativedelight.oceanic
mod_authors=DariusZeBaguette (Oceanic Delight); rebuild: SaintAlfonzo
mod_description=Shrimps, fish eggs, sea grapes, pickles and more for Farmer's Delight. Rebuild of Oceanic Delight 1.0.1 for Creative Delight; reads its art and data from the upstream jar in oceanic_upstream/.

jar_name=portedOceanic
mixin_configs=none
bundled_in=creativeDelight

# Donor (record; the pin that counts is in upstream/UpstreamJars.java)
donor_jar=oceanic_delight-1.0.1-forge-1.19.2.jar
donor_sha1=91fd8842a5bf9b55c2d9fb39f721129bc6cae1b5
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream
shared_base=com.SaintAlfonzo.creativedelight.oceanic
# No upstream resources in the jar (ce.forge-mod checkNoUpstreamResources), except the root files we write ourselves
resource_guard_jars=oceanic_upstream/oceanic_delight-1.0.1-forge-1.19.2.jar
resource_guard_name=Oceanic Delight
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta
