# Oceanic Delight (Creative Delight repack): upstream mods.toml with the display name suffix, our version and
# cleaned dependencies (creative_delight.md 0.3, 14.1.6). Expanded by ce.forge-mod's processResources.
modLoader="javafml"
loaderVersion="[43,)"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://legacy.curseforge.com/members/dariuszebaguette/projects"
logoFile="logo.png"
credits="Made With Love (and a bit of MCreator)"
authors="${mod_authors}"
description='''${mod_description}'''
[[dependencies.oceanic_delight]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2]"
    ordering="NONE"
    side="BOTH"
