# Oceanic Delight 1.0.1 rebuilt for Creative Delight (feature_writeup/ocean_delight.md 5.6). Keeps the upstream mod id so
# every resource location, loot table and old world matches; art and data are read from oceanic_upstream/ at runtime.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"

[[mods]]
modId="oceanic_delight"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.oceanic_delight]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.oceanic_delight]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.oceanic_delight]]
modId="farmersdelight"
mandatory=true
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.oceanic_delight]]
modId="jei"
mandatory=false
versionRange="[0,)"
ordering="NONE"
side="BOTH"
