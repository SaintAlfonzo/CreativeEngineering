# babyMobs: Baby Mobs, a backport of the 1.21.2 / 26.1 "Tiny Takeover" baby mobs to 1.19.2. Minecraft/Forge/mappings/Java
# settings are shared and live in the root ../../gradle.properties.

mod_id=baby_mobs
mod_name=Baby Mobs
# GPLv3, like everything else of ours (LICENSE.txt)
mod_license=GNU GPL3
mod_version=1.1.0
mod_group_id=com.SaintAlfonzo.baby_mobs
mod_authors=SaintAlfonzo
mod_description=Baby squid, glow squid and dolphins as in Minecraft 1.21.2 and the 26.1 Tiny Takeover drop: a share of natural spawns are babies that grow up in 20 minutes (dolphins faster when fed fish), with the 26.1 baby models and textures, smaller hitboxes, higher-pitched sounds and no drops.

# Jar file name: babyMobs-<mod_version>.jar
jar_name=babyMobs
mixin_configs=baby_mobs.mixins.json
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
# Nested in Creative Delight since the Creative Split CD carve (2026-11-01, creative_delight.md 34): animal husbandry.
bundled_in=creativeDelight
