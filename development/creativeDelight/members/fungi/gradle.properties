# backportedFungi: Fungi Delight 1.3 (Forge 1.20.1) ported to Forge 1.19.2. No 1.19.2 build of the mod exists.
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
#
# Plan and decisions: feature_writeup/fungi_delight.md. The port drops the sniffer mixin and tag, the config file, the
# configurable rarity filter, biome modifiers and placed features (the pack places everything), the Botany Pots
# recipes, advancements, the compost hook and the mooshroom breeding mixin (patcherMod owns breeding); it caps the
# Inky Goo Veil, gates pig digging on mob griefing and names the suspicious stew effects by registry id.

# Upstream mod id, so every resource location (fungidelight:truffle, ...) matches the upstream data.
mod_id=fungidelight
mod_name=Fungi Delight (Creative Delight)
# GPLv3 for everything we write; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.3-ce-19.2-02
mod_group_id=net.mehdinoui.fungidelight
mod_authors=Eggmain (Fungi Delight); 1.19.2 backport: SaintAlfonzo
mod_description=Inky caps, morels, truffles, mushroom cows and dishes for Farmer's Delight. Backport of Fungi Delight 1.3 to Forge 1.19.2.

# Jar file name: backportedFungi-<mod_version>.jar
# Nested in the Creative Delight jar (creativedelight members #1, 2026-11-02): build and install through
# :creativeDelight: only; the old standalone jars are in CD's replaces_jars.
bundled_in=creativeDelight
jar_name=backportedFungi
mixin_configs=fungidelight.mixins.json
# Mixin refmap (ce.forge-mod-refmap): the Hoglin mixin uses Mojang names
refmap_name=fungidelight.refmap.json
