// backportedFungi: Fungi Delight 1.3 (Forge 1.20.1) ported to Forge 1.19.2 (mod id fungidelight).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle (+ ce.forge-mod-refmap.gradle).
// A Creative Delight member (folder moved here 2026-11-02): build and install through `:creativeDelight:` only.
// Resources come from the upstream jar through tools/port_resources.py (run it again after changing it).
plugins {
    id 'ce.forge-mod-refmap'
}

dependencies {
    // Farmer's Delight is the one hard dependency (MushroomColonyBlock/Item, ConsumableItem, effects, tags).
    // flatDir notation: 'local:<file name without -version>:<version>'
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
}

// Access transformer (SRG names): Pig.FOOD_ITEMS and PotionBrewing.addMix.
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
