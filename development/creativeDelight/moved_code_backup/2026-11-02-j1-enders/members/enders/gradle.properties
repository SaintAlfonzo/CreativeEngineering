# endersAdditions: the End plants, items and dishes Ender's Delight 1.1.4 (Axedgaming, Forge 1.20.1, MIT) added, rebuilt
# for Forge 1.19.2 as a Creative Delight member. Ender's Delight itself (mod id endersdelight, mods/endersdelight-1.19-1.2.2.jar)
# stays installed as its own jar; this mod adds to it. Minecraft/Forge/mappings/Java settings are shared and live in the
# root ../../../gradle.properties.
#
# Licence: code here is ours (GPL-3.0-only), written from the 1.1.4 behaviour. Since 2026-11-01 (owner, TODO members #9) no
# upstream file ships here: the art and data are read at runtime from the unmodified MIT 1.1.4 jar in
# <game dir>/enders_upstream/ (donor route, the Miner's Delight method; upstream/UpstreamJars, upstream/EndersTranslator).
# Nothing ever comes from the installed All Rights Reserved 1.2.2 jar.
# Blocks and items register under the endersdelight namespace so their ids match upstream 1.1.4.

mod_id=enders_additions
mod_name=Ender's Delight Additions (Creative Delight)
mod_license=GPL-3.0-only
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.1.4-ce-19.2-03
mod_group_id=com.SaintAlfonzo.creativedelight.enders
mod_authors=Axedgaming (Ender's Delight 1.1.4, MIT); 1.19.2 rebuild: SaintAlfonzo
mod_description=Amberveils, Ethereal Saffron, Chorusflame, Void Pepper and five End dishes for Ender's Delight, rebuilt for Forge 1.19.2 from the MIT Ender's Delight 1.1.4 release; reads its art and data from the 1.1.4 jar in enders_upstream/.

# Jar file name: endersAdditions-<mod_version>.jar
jar_name=endersAdditions
mixin_configs=none
bundled_in=creativeDelight

# Donor (record; the pin that counts is in upstream/UpstreamJars.java)
donor_jar=endersdelight-1.1.4.jar
donor_sha1=d1541d70c7dbae71c2a7e1693f512f2166908802
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream
shared_base=com.SaintAlfonzo.creativedelight.enders
# Licence guard (ce.forge-mod checkNoArrResources): nothing of the installed All Rights Reserved 1.2.2 jar, and nothing
# of the 1.1.4 donor, may ship here. resource_guard_own_files: the root files we write ourselves and the lang file, which
# merges across jars and holds only our names for the keys 1.1.4 added
resource_guard_jars=mods/endersdelight-*.jar,enders_upstream/endersdelight-1.1.4.jar
resource_guard_arr=true
resource_guard_name=Ender's Delight
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta,assets/endersdelight/lang/en_us.json
