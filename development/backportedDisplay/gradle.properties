# backportedDisplay: Display Delight 1.7.0 (jkvin114, Forge 1.20.1) ported to Forge 1.19.2. Replaces the pack's
# displaydelight-1.2.0.jar. Minecraft/Forge/mappings/Java settings are shared and live in the root ../gradle.properties.
#
# Plan and decisions: feature_writeup/display_delight.md. The port ships only the display blocks for mods in the pack
# (tools/port_resources.py, EXCLUDED_PREFIXES), links Miner's Delight foods to the pack's miners_delight port, and
# leaves out the wandering trader sales and the Expanded Delight compat class.

# Upstream mod id, so every resource location (displaydelight:food_plate, ...) and every placed block keeps working.
mod_id=displaydelight
mod_name=Display Delight (Backport)
# GPLv3 for everything we write; upstream is LGPLv3 (code, models) with an MIT notice for 5 models, both kept in
# NOTICE-upstream.txt
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.7.0-ce-19.2-01
mod_group_id=com.jkvin114.displaydelight
mod_authors=jkvin114 (Display Delight); 1.19.2 backport: SaintAlfonzo
mod_description=Place and display foods from Farmer's Delight and its add-ons, on the floor or on plates. Backport of Display Delight 1.7.0 to Forge 1.19.2.

# Jar file name: backportedDisplay-<mod_version>.jar
jar_name=backportedDisplay
mixin_configs=none
# installToMods moves the upstream 1.19.2 jar out of mods/ too
replaces_jars=displaydelight-*.jar

# Upstream jar the resources come from (tools/port_resources.py checks the sha1)
upstream_jar=devmods/checkNewerVersionForContent/displaydelight-1.7.0.jar
upstream_sha1=ee5cd8126ec4053a6a50ae1f2af434b91ab6d42e
