// backportedDisplay: Display Delight 1.7.0 (Forge 1.20.1) ported to Forge 1.19.2 (mod id displaydelight).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle.
// Build from the instance root (`./gradlew :backportedDisplay:build`) or from here (`./gradlew build`).
// Resources come from the upstream jar through tools/port_resources.py (run it again after changing it); the same
// tool writes src/main/java/.../init/DisplayFoods.java from tools/display_blocks.json.
plugins {
    id 'ce.forge-mod'
}
