# Creative Calendar: the pack's calendar, day and night length, seasons, season types by biome and crop seasons
# (feature_writeup/creative_calendar.md). Carved out of patcherMod on 2026-11-01 (feature_writeup/creative_split.md).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativecalendar
mod_name=Creative Calendar
mod_license=GNU GPL3
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativecalendar
mod_authors=SaintAlfonzo
mod_description=The Creative Engineering pack's calendar: day and night length, seasons on the sun clock, season types by biome (arid, frozen, tropical, permanent seasons), crop growing seasons and the wine clock, steering Serene Seasons, Better Days and SeasonHUD from one config. Creative Delight and Creative Brewing require it.
# Jar file name: creativecalendar-<mod_version>.jar
jar_name=creativecalendar
# Mixins applied only when their mod is loaded (compat/CalendarMixinPlugin), SRG names with remap = false.
mixin_configs=creativecalendar.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.creativecalendar
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
