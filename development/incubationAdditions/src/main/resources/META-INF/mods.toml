# Incubation Additions: this pack's additions to Incubation. The dollar-brace values come from
# gradle.properties (mod_*) and the root gradle.properties (versions), expanded by build-logic's ce.forge-mod.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Incubation: the nests are its EmptyNestBlock / BirdNestBlock with its nest properties, and
# LayEggInNestGoalMixin patches its egg-laying goal. Nothing works without it.
[[dependencies.${mod_id}]]
modId="incubation"
mandatory=true
versionRange="[3.0,)"
ordering="AFTER"
side="BOTH"

# Alex's Mobs: the emu nest and EntityEmuEggLayerMixin (both skipped when it's absent).
[[dependencies.${mod_id}]]
modId="alexsmobs"
mandatory=false
versionRange="[1.21,)"
ordering="AFTER"
side="BOTH"

# Untitled Duck Mod: the duck and goose nests and their EggLayer mixins (skipped when it's absent).
[[dependencies.${mod_id}]]
modId="untitledduckmod"
mandatory=false
versionRange="[0.6,)"
ordering="AFTER"
side="BOTH"
