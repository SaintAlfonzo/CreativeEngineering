# Storage Delight (Creative Engineering build): upstream mods.toml with our version and display name. Expanded by
# ce.forge-mod's processResources.
modLoader="javafml"
loaderVersion="[43,)"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
[[dependencies.storagedelight]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.storagedelight]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2,1.20)"
    ordering="NONE"
    side="BOTH"
# Pack addition (creative_split.md 7.17): the cabinets use Farmer's Delight classes; upstream never declared it.
[[dependencies.storagedelight]]
    modId="farmersdelight"
    mandatory=true
    versionRange="[1.19.2-1.2.4,)"
    ordering="AFTER"
    side="BOTH"
