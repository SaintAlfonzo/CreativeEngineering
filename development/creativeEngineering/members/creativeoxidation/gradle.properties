# creativeOxidation: Creative Oxidation, a port of Create: Oxidized 1.0.0 (createoxidized, Forge 1.20.1, Mr.Mulle, MIT)
# to Forge 1.19.2 / Create 0.5.1, a Creative Engineering member (feature_writeup/plan_creative_oxidation.md).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativeoxidation
mod_name=Creative Oxidation
# GPLv3 for everything we write; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GPL-3.0-only
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.0.0-ce-19.2-01
mod_group_id=com.SaintAlfonzo.creativeoxidation
mod_authors=Mr.Mulle (Create: Oxidized); 1.19.2 port: SaintAlfonzo
mod_description=Create's copper machines, pipes, tanks and copper decoration (Create, Create Deco, Design n' Decor) age like vanilla copper: exposed, weathered, oxidized, with waxing and scraping. Port of Create: Oxidized 1.0.0 to Forge 1.19.2, nested in Creative Engineering.
# Jar file name: creativeoxidation-<mod_version>.jar
jar_name=creativeoxidation
mixin_configs=creativeoxidation.mixins.json
# Nested in the Creative Engineering jar; ships through :creativeEngineering:installToMods
bundled_in=creativeEngineering
# Mixin refmap (ce.forge-mod-refmap): mixins on Minecraft use Mojang names; mixins on Create, Flywheel and Registrate
# classes use remap = false
refmap_name=creativeoxidation.refmap.json
