modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.creativeoxidation]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.creativeoxidation]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# After Create and the copper decoration mods, so the baked model wrapper sits outside their model swaps
[[dependencies.creativeoxidation]]
modId="create"
mandatory=true
versionRange="[0.5.1,)"
ordering="AFTER"
side="BOTH"
[[dependencies.creativeoxidation]]
modId="createdeco"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"
[[dependencies.creativeoxidation]]
modId="design_decor"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"
