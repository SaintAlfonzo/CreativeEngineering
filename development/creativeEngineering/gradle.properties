# Creative Engineering: the pack's machines and engineering content (feature_writeup/creative_engineering.md): Create's
# dragon breathing fan type, the IE sawmill blade routing and sawdust, the wooden bucket, TNT shrapnel, Ore Excavation's
# undo rules, BlockRunner surfaces, the liquid XP bridge, the IE and Immersive Posts tweaks, and the engineering
# scripts (components, metals, wood, machines, computing). Carved out of patcherMod on 2026-11-04
# (feature_writeup/creative_split.md 7.6 and 7.13, wave 8); it took over the mod id creativeengineering at the swap,
# and the rest of patcherMod became Creative Common (development/creativeCommon).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativeengineering
mod_name=Creative Engineering
mod_license=GPL-3.0-only
# 2.0.0: the mod id's earlier versions (1.0.0 to 1.1.09) were patcherMod, which is now Creative Common.
mod_version=2.0.0
mod_group_id=com.SaintAlfonzo.creativeengineering
mod_authors=SaintAlfonzo
mod_description=The Creative Engineering pack's machines and engineering: Create's dragon breathing fan processing, IE sawmill blade routing and sawdust, the wooden bucket, TNT shrapnel, Ore Excavation undo rules, BlockRunner walking surfaces, the liquid XP bridge, and the component, metal, wood and machine recipes. Needs the pack (Creative Common, Creative Compat and KubeJS).
# Jar file name: creativeengineering-<mod_version>.jar
jar_name=creativeengineering
# Mixins applied only when their mod is loaded (EngineeringMixinPlugin, a GatedMixinPlugin), SRG names with remap = false.
mixin_configs=creativeengineering.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.creativeengineering
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
