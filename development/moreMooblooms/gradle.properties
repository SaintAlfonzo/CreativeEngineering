# moreMooblooms: More Mooblooms, data-driven moobloom variants on a cow base. Minecraft/Forge/mappings/Java
# settings are shared and live in the root ../../gradle.properties.

mod_id=more_mooblooms
mod_name=More Mooblooms
# GPLv3, like everything else of ours (LICENSE.txt)
mod_license=GNU GPL3
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.more_mooblooms
mod_authors=SaintAlfonzo
mod_description=Mooblooms in many flower variants: data-driven variants with weighted flower pools, cross-breeding combinations, two-stage shearing that regrows on grass, cows turn into mooblooms when fed flowers, per-biome spawn rules and rare witherblooms in soul sand valleys. Cleans up Buzzier Bees' moobloom, buttercup and Sunny when that mod is installed.

# Jar file name: moreMooblooms-<mod_version>.jar
jar_name=moreMooblooms
mixin_configs=more_mooblooms.mixins.json
