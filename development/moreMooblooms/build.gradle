// Shared Forge setup (runs, mods.toml expansion, jar manifest, jar_archive, installToMods) comes from
// build-logic/src/main/groovy/ce.forge-mod.gradle; this file has only what is specific to moreMooblooms.
// Build from the instance root (`./gradlew :moreMooblooms:build`) or from here (`./gradlew build`).
plugins {
    id 'ce.forge-mod'
}

dependencies {
    // Third-party mod jars copied from ../../mods (git-ignored): only jei (the optional JEI plugin).
    // Buzzier Bees is never a compile dependency (Abnormals License, see README): it is referred to by
    // registry ids only.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}
