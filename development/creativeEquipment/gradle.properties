# Creative Equipment: the pack's gear (feature_writeup/creative_equipment.md): tier shields, stepstools, backpack skins,
# the air brake, Bottled Air, elytra duplication and chestplates, the copper tool tier, armor caps and enchantability,
# the bone meal charm, tool and armor tuning, archery, End gear, harvest tiers. Carved out of patcherMod on 2026-11-04
# (feature_writeup/creative_split.md 7.6, wave 7).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativeequipment
mod_name=Creative Equipment
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativeequipment
mod_authors=SaintAlfonzo
mod_description=The Creative Engineering pack's gear: tier shields from copper to dragon, stepstools, backpack skins, the air brake, Bottled Air, elytra duplication and elytra chestplates, the copper tool tier, armor caps and enchantability, the bone meal charm, tool and armor tuning, archery, echo, felsic and dragon gear, and mining tiers. Needs the pack (Creative Common, Creative Compat and KubeJS).
# Jar file name: creativeequipment-<mod_version>.jar
jar_name=creativeequipment
# Mixins applied only when their mod is loaded (EquipmentMixinPlugin, a GatedMixinPlugin), SRG names with remap = false.
mixin_configs=creativeequipment.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.creativeequipment
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
