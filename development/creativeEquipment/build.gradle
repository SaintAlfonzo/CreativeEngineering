// creativeEquipment: Creative Equipment (mod id creativeequipment, feature_writeup/creative_equipment.md), carved out of patcherMod on
// 2026-11-04 (creative_split.md 7.6, wave 7). Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle.
// This file adds what is specific to Equipment, the same way creativeMagic/build.gradle does:
//   - the Equipment script trees, authored in the pack folder so /reload (server) and F3+T (client) pick them up without a
//     rebuild, copied into the jar at the same resource path:
//       kubejs/data/creativeequipment/kubejs/    -> data/creativeequipment/kubejs/    (server scripts)
//       kubejs/assets/creativeequipment/kubejs/  -> assets/creativeequipment/kubejs/  (client scripts)
//     The startup scripts live in this project (src/main/resources/kubejs_startup/creativeequipment/), loaded from the jar
//     by Creative Common's startup loader.
// Build: ./gradlew :creativeEquipment:build --offline   Install: ./gradlew :creativeEquipment:installToMods
plugins {
    id 'ce.forge-mod'
}

dependencies {
    // Creative Common (creativecommon): a hard dependency (KubeJS, the shared helpers, the startup loader) and the
    // Common APIs this jar calls (swap/ConfigRename, damage/DamageTags and DamageFlag, shield/EffectTickContext).
    compileOnly project(':creativeCommon')
    // Creative Compat: required by every Creative jar (creative_split.md 7.6).
    compileOnly project(':creativeCompat')
    // The mods the mixins target (Sophisticated Backpacks, Easy Elytra Takeoff, Everything Copper, Curios, Nock Enough
    // Arrows): the pack's jars, shared with
    // patcherMod (git-ignored libs/, SRG-named).
    compileOnly fileTree(dir: rootProject.file('development/creativeCommon/libs'), include: '*.jar')
}

def scriptTrees = ['data/creativeequipment/kubejs', 'assets/creativeequipment/kubejs']

tasks.named('processResources', ProcessResources).configure {
    scriptTrees.each { tree ->
        from(rootProject.file("kubejs/${tree}")) {
            into tree
            exclude '**/*.md'
        }
    }
}

// The scripts in the jar run only through KubeJS; a missing tree means the pack-folder path moved.
tasks.named('jar', Jar).configure {
    doLast {
        def entries = new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { z -> z.entries().collect { it.name } }
        ['kubejs_startup/creativeequipment/', 'data/creativeequipment/kubejs/', 'assets/creativeequipment/kubejs/'].each { dir ->
            if (!entries.any { it.startsWith(dir) && it.endsWith('.js') }) {
                throw new GradleException("creativeequipment jar has no scripts under ${dir}")
            }
        }
    }
}
