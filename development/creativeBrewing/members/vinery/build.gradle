// backportedVinery: Let's Do Vinery 1.5.5 ported to Forge 1.19.2 (mod id vinery), with the part of Let's Do
// Foundation 1.0.1 it uses bundled under net.satisfy.foundation.
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle (+ ce.forge-mod-refmap.gradle).
// Build from the instance root (`./gradlew :backportedVinery:build`); it ships nested in Creative Brewing (`:creativeBrewing:installToMods`).
plugins {
    id 'ce.forge-mod-refmap'
}

repositories {
    mavenCentral()
}

dependencies {
    // Optional integrations; every entry point checks the mod is loaded first.
    // flatDir notation: 'local:<file name without -version>:<version>'
    compileOnly fg.deobf('local:jei-1.19.2-forge:11.8.1.1034')

    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    // WTHIT lines (B4.6); the pack's jar, shared with Creative Common
    compileOnly files(rootProject.file('development/creativeCommon/libs/wthit-1.19.2-forge-5.36.1.jar'))
    // The pack's [time] master (time.md 3.7): forge/PackTime calls Creative Calendar's time.WineTime (CB requires Calendar).
    compileOnly project(':creativeCalendar')
    // Flower box / pot plants use Supplementaries' special flower models when it is loaded (legacy/client/
    // SupplementariesFlowerModels). The pack's SRG jars; only a plain static method on a mod class is called.
    compileOnly files(rootProject.file('development/creativeCommon/libs/supplementaries-1.19.2-2.4.20.jar'))
    compileOnly files(rootProject.file('development/creativeCommon/libs/moonlight-1.19.2-2.3.7-forge.jar'))
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
}

// Access transformer (SRG names, generated from tools/accesstransformer.official.cfg by tools/gen_at.py).
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

// Port in progress: report every compile error, not javac's default first 100.
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}
