# Let's Do Vinery 1.5.5 ported to Forge 1.19.2. Keeps the upstream mod id so every resource location, recipe, tag and
# old-world block keeps working; replaces letsdo-vinery-forge-1.3.10.jar and doapi-1.1.0b.jar. Its art and data come
# from the unmodified upstream jars in vinery_upstream/ (net.satisfy.vinery.forge.upstream).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"

[[mods]]
modId="vinery"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
itemIcon="vinery:red_wine"
description='''${mod_description}'''

[[dependencies.vinery]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.vinery]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.vinery]]
modId="foundation"
mandatory=true
versionRange="*"
ordering="AFTER"
side="BOTH"

# Satisfy's Foundation library 1.0.1 (MIT), ported in the same jar. Own mod id so its registry names stay upstream's.
[[mods]]
modId="foundation"
version="1.0.1-ce-19.2"
displayName="Creative Brewing"
authors="satisfy (Foundation); 1.19.2 backport: SaintAlfonzo"
description='''Satisfy's shared library for the Let's Do mods (furniture, storage, seats, banners, armor sets), ported to Forge 1.19.2 for the Vinery backport.'''

[[dependencies.foundation]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"
