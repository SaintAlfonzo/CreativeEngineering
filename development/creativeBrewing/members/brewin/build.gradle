// backportedBrewin: Brewin' And Chewin' 4.5.0 ported to Forge 1.19.2 (mod id brewinandchewin).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle (+ ce.forge-mod-refmap.gradle).
// Build from the instance root (`./gradlew :backportedBrewin:build`); it ships nested in Creative Brewing (`:creativeBrewing:installToMods`).
plugins {
    id 'ce.forge-mod-refmap'
}

repositories {
    mavenCentral()
}

dependencies {
    // Farmer's Delight is the one hard dependency. fg.deobf remaps the SRG-named jars to Mojang names, so our code
    // can call Minecraft methods inherited through their classes (SyncedBlockEntity, ConsumableItem, ...).
    // flatDir notation: 'local:<file name without -version>:<version>'
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
    // Optional integrations; every entry point checks the mod is loaded first.
    compileOnly fg.deobf('local:jei-1.19.2-forge:11.8.1.1034')
    compileOnly fg.deobf('local:create-1.19.2:0.5.1.i')
    compileOnly fg.deobf('local:flywheel-forge-1.19.2:0.6.11-22')
    compileOnly fg.deobf('local:Registrate-MC1.19:1.1.5')
    compileOnly fg.deobf('local:appleskin-forge-mc1.19:2.4.2')

    // MixinExtras (WrapOperation, ModifyExpressionValue, Local, ...) as upstream uses it. Not bundled: the pack
    // already loads MixinExtras 0.5.4 through other mods. The annotation processor writes the refmap entries.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    // WTHIT keg lines (wthit_lines.md 2.8); the pack's jar, shared with Creative Common
    compileOnly files(rootProject.file('development/creativeCommon/libs/wthit-1.19.2-forge-5.36.1.jar'))
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
}

// Access transformer (SRG names, generated from tools/accesstransformer.official.cfg by tools/gen_at.py).
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

// Port in progress: report every compile error, not javac's default first 100.
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}
