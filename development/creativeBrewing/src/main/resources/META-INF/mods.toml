# Creative Brewing: the bundle's own mod (potion, alcohol and effect content, config, scripts). The members (Vinery,
# Foundation, Brewin' & Chewin') are nested jars, each with its own mods.toml (META-INF/jarjar/metadata.json).
# feature_writeup/creative_brewing.md 2.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SaintAlfonzo/CreativeEngineering"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.creativebrewing]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.creativebrewing]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# Creative Common: supplies KubeJS (it requires it, and KubeJS pulls in Rhino and Architectury), the shared helpers
# (global.NCH, global.tags), the dicts and the startup script loader.
[[dependencies.creativebrewing]]
modId="creativecommon"
mandatory=true
versionRange="[1.1.0,)"
ordering="AFTER"
side="BOTH"
# Creative Compat: required by every other Creative jar (creative_split.md 7.6).
[[dependencies.creativebrewing]]
modId="creativecompat"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
# Creative Calendar: the [time] master; the Vinery member's PackTime calls its time.WineTime directly
# (feature_writeup/creative_calendar.md). AFTER so its startup script pack (global.CAL) runs before CB's.
[[dependencies.creativebrewing]]
modId="creativecalendar"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
# Creative Delight: nests Farmer's Delight (Brewin's base) and defines global.CD. AFTER so CB's startup script pack
# loads after CD's (patcherMod's loader runs jar packs in mod-list order).
[[dependencies.creativebrewing]]
modId="creativedelight"
mandatory=true
versionRange="[1.1.0,)"
ordering="AFTER"
side="BOTH"
# MoreJS: potions.js adds every brewing-stand mix (and through them Create's Automatic Brewing and the IE Mixer list)
# with MoreJSEvents.registerPotionBrewing; without it the CB potions exist but cannot be brewed (owner 2026-11-06).
[[dependencies.creativebrewing]]
modId="morejs"
mandatory=true
versionRange="[0.3.0,)"
ordering="NONE"
side="BOTH"

# Optional (owner 2026-11-06): mods CB's scripts, mixin compartments or JEI pages use when present; each is guarded
# (global.has, CBMixinPlugin compartments). Listed so the project page and the mod list show them, loaded after them.
