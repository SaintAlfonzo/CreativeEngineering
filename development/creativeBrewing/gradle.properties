# Creative Brewing: the brewing, alcohol and potion add-ons the pack owns, in one jar (feature_writeup/creative_brewing.md).
# Plugin ce.forge-bundle (build-logic): this project's own jar (the @Mod class, CB's config, its startup scripts and the
# server/client script trees from the pack folder) plus each member's jar nested under META-INF/jarjar/. Same shape as
# Creative Delight (development/creativeDelight).
mod_id=creative_brewing
mod_name=Creative Brewing
mod_license=GNU GPL3
# The pack's own scheme for the bundle jars (as CD's Q17): 1.0.0, then 1.0.01, 1.0.02.
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativebrewing
mod_authors=SaintAlfonzo; members by their upstream authors (see each NOTICE)
mod_description=The brewing, alcohol and potion add-ons the Creative Engineering pack ships, in one jar: each member keeps its own mod id and namespace. Needs the pack (patcherMod and KubeJS) and Creative Delight.
jar_name=creative_brewing
# Java compartments: mixins applied only when their mod is loaded (compat/CBMixinPlugin), SRG names with remap = false.
mixin_configs=creative_brewing.mixins.json

# Members, nested in this order (each sets bundled_in=creativeBrewing).
bundle_members=:backportedVinery,:backportedBrewin
# installToMods moves these out of mods/: the members' old standalone jars, and what each member replaces (the stock
# Vinery 1.3.10 jar becomes a donor in vinery_upstream/, creative_brewing.md 3).
replaces_jars=backportedVinery-*.jar,backportedBrewin-*.jar,letsdo-vinery-forge-1.3.10.jar,doapi-*.jar,BrewinAndChewin-1.19-*.jar
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.creativebrewing
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
