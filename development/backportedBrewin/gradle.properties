# backportedBrewin: Brewin' And Chewin' 4.5.0 (NeoForge/Fabric 1.21.1) ported to Forge 1.19.2. Replaces the
# pack's BrewinAndChewin-1.19-2.0.jar. Minecraft/Forge/mappings/Java settings are shared and live in the root
# ../gradle.properties.

# Upstream mod id, so every resource location (brewinandchewin:keg, #brewinandchewin:...) and old world keeps working.
mod_id=brewinandchewin
mod_name=Brewin' And Chewin' (Backport)
# GPLv3 for everything we write; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=4.5.0-ce-19.2-03
mod_group_id=umpaz.brewinandchewin
mod_authors=Probleyes, Umpaz, MerchantCalico (Brewin' And Chewin'); 1.19.2 backport: SaintAlfonzo
mod_description=Fermenting addon for Farmer's Delight. Backport of Brewin' And Chewin' 4.5.0 to Forge 1.19.2.

# Jar file name: backportedBrewin-<mod_version>.jar
jar_name=backportedBrewin
mixin_configs=brewinandchewin.mixins.json
# Same mod id as the stock 2.0 jar, so `installToMods` moves that one out of mods/ too.
replaces_jars=BrewinAndChewin-1.19-*.jar
