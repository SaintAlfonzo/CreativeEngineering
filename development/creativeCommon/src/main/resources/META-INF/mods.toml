# Creative Common: the shared core of the Creative mods. Built by ce.forge-mod (build-logic); the template values come
# from gradle.properties and the root gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"

[[mixins]]
config = "creativecommon.mixins.json"

[[mods]]
modId="creativecommon"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SaintAlfonzo/CreativeEngineering"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.creativecommon]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.creativecommon]]
modId="minecraft"
mandatory=true
versionRange="1.19.2"
ordering="NONE"
side="BOTH"

# KubeJS (brings Rhino and Architectury): the jar startup script loader, server and client script trees and 6 mixins.
# Required over the tested range in perf/CEMixinPlugin MOD_RANGE, since Common's scripts cannot load without them.
[[dependencies.creativecommon]]
modId="kubejs"
mandatory=true
versionRange="[1902.6.2-build.73,1902.7)"
ordering="AFTER"
side="BOTH"

# Optional integrations. versionRange stays "*": the tested ranges are in each jar's mixin plugin MOD_RANGE, which skips a
# mod's mixins (one warning in the log) when its version is outside them, where a range here would stop the boot.

# sequenced assembly mixin
[[dependencies.creativecommon]]
modId="create"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"

# block growth fixes and the random-tick fast path (3 mixins)
[[dependencies.creativecommon]]
modId="immersive_weathering"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# fluid tag input mixin (shared API; WTHIT sheet metal tank lines: Creative Compat)
[[dependencies.creativecommon]]
modId="immersiveengineering"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# large item list fix (JEI smithing: Creative Compat)
[[dependencies.creativecommon]]
modId="armor_trims"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# skips the block state id table build at server start
[[dependencies.creativecommon]]
modId="worldedit"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# Spiral Spires teleport check without synchronous chunk loads
[[dependencies.creativecommon]]
modId="quark"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# dimension lookup fix
[[dependencies.creativecommon]]
modId="create_gravity"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# whistle arrow goal skip
[[dependencies.creativecommon]]
modId="nock_enough_arrows"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# Phantom Bane rules (rest reset, spawner skip); its potions are Creative Brewing's since 2026-11-07
[[dependencies.creativecommon]]
modId="better_beacons"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# Effect remap of Fruits Delight's jam and jelly effect lines
[[dependencies.creativecommon]]
modId="fruitsdelight"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

