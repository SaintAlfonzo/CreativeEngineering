# Creative Common: the shared core of the Creative mods. Built by ce.forge-mod (build-logic); the template values come
# from gradle.properties and the root gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SaintAlfonzo/CreativeEngineering/issues"

[[mixins]]
config = "creativecommon.mixins.json"

[[mods]]
modId="creativecommon"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SaintAlfonzo/CreativeEngineering"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.creativecommon]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.creativecommon]]
modId="minecraft"
mandatory=true
versionRange="1.19.2"
ordering="NONE"
side="BOTH"

# KubeJS (brings Rhino and Architectury): the jar startup script loader, server and client script trees and 6 mixins.
# Required over the tested range in perf/CEMixinPlugin MOD_RANGE, since Common's scripts cannot load without them.
[[dependencies.creativecommon]]
modId="kubejs"
mandatory=true
versionRange="[1902.6.2-build.73,1902.7)"
ordering="AFTER"
side="BOTH"

# Optional integrations. versionRange stays "*": the tested ranges are in perf/CEMixinPlugin MOD_RANGE, which skips a
# mod's mixins (one warning in the log) when its version is outside them, where a range here would stop the boot.

# JEI plugin (craftable-first lists, pack ingredient order, seasoning, potion bucket, tipped arrow, can and world interaction categories, cycling crafting) and 12 mixins
[[dependencies.creativecommon]]
modId="jei"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# WTHIT plugins: state lines, holder and pot contents, hives, campfires, coasters, tanks, remainder buffer, silk touch, sheared, operator blocks, block model icons
