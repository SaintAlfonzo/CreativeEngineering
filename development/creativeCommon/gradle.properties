# Creative Common (development/creativeCommon, Gradle project :creativeCommon): patcherMod until the Creative Split
# swap (2026-11-04, feature_writeup/creative_split.md 6 Q1 and 7.13), when the content left for the carved jars and the
# mod id creativeengineering went to Creative Engineering. Jar: creativecommon-<mod_version>.jar; it displaces the old
# creativeengineering-1.x jars (replaces_jars). Minecraft/Forge/mappings/Java settings are shared by every in-tree mod
# and live in the root ../gradle.properties.

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=creativecommon
# The human-readable display name for the mod.
mod_name=Creative Common
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
mod_version=1.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.SaintAlfonzo.creativecommon
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=SaintAlfonzo
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Shared core of the Creative mods; every Creative jar requires it, and it adds no blocks or items of its own. Library: config framework; KubeJS script loading from mod jars, with shared helpers (recipes, tags, compost, trades, JEI order), armor and tool effect frameworks, and item, block, fluid and food dictionaries that skip absent mods; swap lists that remap renamed ids in saved worlds; data-driven damage tags; loot tables that name optional mods; trade sync for dedicated-server clients; server profiling events for Java Flight Recorder. Interface: in-game changelog viewer, loading screen tip bar, mod display names. Effects: Magic Resistance and its potions; effect category, swap, block and HUD icon rules in the config. Fixes and performance: Poison and Wither ticks told apart from other magic damage, ghost blocks and null block state packets in large packs, thread-safe level random, creative pick-block sync, client exit hang on some NVIDIA drivers, faster Immersive Weathering random ticks, WorldEdit, Quark and Nock Enough Arrows stalls, Immersive Portals crashes with Serene Seasons and Heartstone, Better Beacons Phantom Bane no longer stopping phantoms for other players. Create: Gravity: low gravity also for dropped items (ItemPhysic included), falling blocks, TNT, minecarts, experience orbs, projectiles and boats, and active from dedicated server start. Optional pack settings, vanilla by default: no advancements, Wandering Trader timing and offers, survival inventory for creative players; the one performance limit on by default is Create: Gravity's dimension list. JEI, WTHIT and tooltip improvements are in Creative Compat.
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,mixinplugin
shared_base=com.SaintAlfonzo.creativecommon
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true

# Jar file name: creativecommon-<mod_version>.jar
jar_name=creativecommon
# patcherMod's jars (creativeengineering-1.0.x / 1.1.xx) leave mods/ when this one is installed. Not 2.x: that is Creative
# Engineering's own jar now.
replaces_jars=creativeengineering-1.*.jar
