# CE Client Capture (dev-only). The dollar-brace values come from gradle.properties (mod_*) and the root
# gradle.properties (versions), expanded by build-logic's ce.forge-mod.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

# JEI: the jei wait, jei_* screens and the recipe screen's bounds for the gui crop.
[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[11,)"
ordering="NONE"
side="CLIENT"
