# clientCapture: dev-only driver for unattended client screenshots (feature_writeup/client_capture.md).
# Minecraft/Forge/mappings/Java settings are shared and live in the root ../../gradle.properties.

mod_id=cecapture
mod_name=CE Client Capture
# GPLv3, like everything else of ours (LICENSE.txt)
mod_license=GNU GPL3
mod_version=0.1.0
mod_group_id=com.SaintAlfonzo.cecapture
mod_authors=SaintAlfonzo
mod_description=Dev-only. Runs a capture plan in a throwaway client: loads a test world, runs each test's steps and saves framebuffer shots with the rectangles that matter. Inert without -Dcecapture.plan.

# Jar file name: cecapture-<mod_version>.jar
jar_name=cecapture
mixin_configs=cecapture.mixins.json
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
