# Creative Devtools: the pack's developer tools in one dev-only jar (feature_writeup/creative_devtools.md).
# Plugin ce.forge-bundle (build-logic): this project's own jar (the @Mod class, its config, the startup core and the
# server/client script trees from the pack folder) plus each member's jar nested under META-INF/jarjar/. Same shape as
# Creative Brewing (development/creativeBrewing). Never shipped to players (mod_sides.md side `dev`).
mod_id=creativedevtools
mod_name=Creative Devtools
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativedevtools
mod_authors=SaintAlfonzo
mod_description=Dev-only. The Creative Engineering pack's developer tools: /cegen (generator runner), /dumpall and the /dump* commands, /ceperf, /ceplace, the block-state and Level-random probes, the test recipes and the Flower Test world. Nests CE Perf Bot and CE Client Capture. Needs the pack (Creative Common and KubeJS).
jar_name=creativedevtools
# No mixins: the probes subscribe to hooks in patcherMod (util/BlockStateLookupHook, util/LevelRandomHook).
mixin_configs=none

# Members, nested in this order (each sets bundled_in=creativeDevtools).
bundle_members=:perfBot,:clientCapture
