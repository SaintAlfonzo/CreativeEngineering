# perfBot: dev-only bot players and tick log for the scratch-server performance suite (feature_writeup/perf_suite.md).
# Minecraft/Forge/mappings/Java settings are shared and live in the root ../../gradle.properties.

mod_id=cdevperfbot
mod_name=Creative Devtools Perf Bot
# GPLv3, like everything else of ours (LICENSE.txt)
mod_license=GPL-3.0-only
mod_version=0.1.0
mod_group_id=com.SaintAlfonzo.cdevperfbot
mod_authors=SaintAlfonzo
mod_description=Dev-only. Bot players that count as real players on a dedicated server (chunk ticking, random ticks, mob spawning) and a per-tick timing log that survives a killed server. Inert without -Dcdevperfbot.out.

# Jar file name: cdevperfbot-<mod_version>.jar
jar_name=cdevperfbot
mixin_configs=none

# Nested in Creative Devtools (feature_writeup/creative_devtools.md); its tools still take this project's own build/libs jar.
bundled_in=creativeDevtools
