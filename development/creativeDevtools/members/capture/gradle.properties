# clientCapture: dev-only driver for unattended client screenshots (feature_writeup/client_capture.md).
# Minecraft/Forge/mappings/Java settings are shared and live in the root ../../gradle.properties.

mod_id=cdevcapture
mod_name=Creative Devtools Capture
# GPLv3, like everything else of ours (LICENSE.txt)
mod_license=GPL-3.0-only
mod_version=0.1.0
mod_group_id=com.SaintAlfonzo.cdevcapture
mod_authors=SaintAlfonzo
mod_description=Dev-only. Runs a capture plan in a throwaway client: loads a test world, runs each test's steps and saves framebuffer shots with the rectangles that matter. Inert without -Dcdevcapture.plan.

# Jar file name: cdevcapture-<mod_version>.jar
jar_name=cdevcapture
mixin_configs=cdevcapture.mixins.json
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true

# Nested in Creative Devtools (feature_writeup/creative_devtools.md); its tools still take this project's own build/libs jar.
bundled_in=creativeDevtools
