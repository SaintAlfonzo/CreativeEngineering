# Creative Devtools: the pack's developer tools (feature_writeup/creative_devtools.md). Dev mods/ only. The members are
# nested jars, each with its own mods.toml (META-INF/jarjar/metadata.json).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.creativedevtools]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.creativedevtools]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# Creative Common: KubeJS, the shared helpers, the startup script loader and the
# util/ hooks the probes subscribe to. Needs the Creative Common build that has those hooks.
[[dependencies.creativedevtools]]
modId="creativecommon"
mandatory=true
versionRange="[1.3.0,)"
ordering="AFTER"
side="BOTH"
# Creative Compat: optional for Devtools (TODO tooling/scratch-1115-follow-ups-2 #16, SQ-TX-18). Every command that
# reads Compat's classes (/cdevbench passthrough, /cdevreload compat, /dumpsurface, /cdevdumpicons) registers only when
# it is loaded. The other Creative jars still require it (creative_split.md 7.6).
[[dependencies.creativedevtools]]
modId="creativecompat"
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
# Creative Worldgen: /cdevplace (MassPlacer), the /dumpspawns tuning record and /cdevperf mobcap read its classes; each is
# skipped when it is not loaded (creative_split.md 7.6: Devtools has an optional dependency on Worldgen). The dump
# scripts that load its classes (dump_bee_nests.js, dump_structuregen.js) carry `// requires: creativeworldgen`.
[[dependencies.creativedevtools]]
modId="creativeworldgen"
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
# Immersive Engineering: only for the recycling log (ie/IeRecyclingDiagnostics), registered when IE is loaded.
[[dependencies.creativedevtools]]
modId="immersiveengineering"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
