# Creative Magic: the pack's enchanting and magic content (feature_writeup/creative_magic.md): Dark Fire and Flint and
# Terrasteel with the Nether portal rule, the Nock Enough Arrows enchantments off tables and trades, the Botania Trinket
# Case, the magic recipes. Carved out of patcherMod on 2026-11-04 (feature_writeup/creative_split.md 7.6, wave 6).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativemagic
mod_name=Creative Magic
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativemagic
mod_authors=SaintAlfonzo
mod_description=The Creative Engineering pack's enchanting and magic content: Dark Fire and Flint and Terrasteel (ordinary fire no longer opens a Nether portal), Nock Enough Arrows' Cycle, Stockpile and Recovery off tables and trades, a Botania Trinket Case that holds any item, and the magic recipes. Needs the pack (Creative Common, Creative Compat and KubeJS).
# Jar file name: creativemagic-<mod_version>.jar
jar_name=creativemagic
# Mixins applied only when their mod is loaded (MagicMixinPlugin, a GatedMixinPlugin), SRG names with remap = false.
mixin_configs=creativemagic.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.creativemagic
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
