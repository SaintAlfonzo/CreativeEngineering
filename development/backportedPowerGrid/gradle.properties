# backportedPowerGrid: Create: Power Grid 0.6.2 (Architectury, Forge/Fabric 1.20.1, Create 6) ported to Forge 1.19.2 and
# Create 0.5.1.i, for evaluation (feature_writeup/power_grid.md, plan feature_writeup/plan_power_grid.md). Minecraft/Forge/
# mappings/Java settings are shared and live in the root gradle.properties.
#
# Upstream mod id, so every resource location (powergrid:wire, #powergrid:...) matches the upstream data and art.
mod_id=powergrid
mod_name=Create: Power Grid
# Upstream files stay Apache-2.0 (LICENSE, NOTICE); files written for the port are GPLv3 (LICENSE.txt). B1, H12.
mod_license=Apache-2.0 AND GPL-3.0-only
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=0.6.2-ce-19.2-17
mod_group_id=org.patryk3211.powergrid
mod_authors=patryk3211, Da-Negy, rvndm, casvara (Create: Power Grid); 1.19.2 port: SaintAlfonzo
mod_description=Providing electricity to a world near you. Port of Create: Power Grid 0.6.2 to Forge 1.19.2 and Create 0.5.1, in progress (see port_phase).
# Jar file name: backportedPowerGrid-<mod_version>.jar
jar_name=backportedPowerGrid
# Port phase (plan_power_grid.md section 2). Content of a later phase is not registered, and its data and assets are
# left out of the jar (phases.json, PortPhase.CURRENT, the processResources filter in build.gradle). Raise it when a phase
# is done.
port_phase=10
# The jar's mixin config (one config for upstream's three; plan section 1: mixins go in with their phase).
mixin_configs=powergrid.mixins.json
# Mixin refmap (ce.forge-mod-refmap, since phase P2): mixins use Mojang names
refmap_name=powergrid.refmap.json
