// backportedPowerGrid: Create: Power Grid 0.6.2 (Architectury, 1.20.1, Create 6) ported to Forge 1.19.2 and Create 0.5.1.i
// (mod id powergrid), for evaluation: feature_writeup/power_grid.md, plan feature_writeup/plan_power_grid.md, notes in
// PORT_NOTES.md. Ported code is in src/main/java; upstream code not ported yet (common and forge trees merged,
// @ExpectPlatform inlined) is in upstream/java and is not compiled.
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle.
// Build from the instance root: ./gradlew :backportedPowerGrid:build --offline
// The jar does not go into the pack's mods/ during the port (plan E1): copy build/libs/ into a scratch server only.
plugins {
    id 'ce.forge-mod-refmap'
}

repositories {
    mavenCentral()
}

// EJML 0.44 (Apache-2.0), the solver's matrix library: compiled against and nested in the jar under META-INF/jarjar/,
// the same four modules upstream ships (META-INF/jars/ of the 0.6.2 jar). Plain libraries load from jarjar on Forge 43.
configurations {
    nestedLibs { transitive = false }
    compileOnly.extendsFrom nestedLibs
}

dependencies {
    nestedLibs 'org.ejml:ejml-core:0.44.0'
    nestedLibs 'org.ejml:ejml-ddense:0.44.0'
    nestedLibs 'org.ejml:ejml-dsparse:0.44.0'
    nestedLibs 'org.ejml:ejml-simple:0.44.0'

    // The pack's jars (hard links in libs/, git-ignored; flatDir notation 'local:<file name without -version>:<version>').
    // fg.deobf remaps the SRG-named jars to Mojang names.
    compileOnly fg.deobf('local:create-1.19.2:0.5.1.i')
    compileOnly fg.deobf('local:flywheel-forge-1.19.2:0.6.11-22')
    // Registrate as Create 0.5.1.i nests it (CreateRegistrate)
    compileOnly fg.deobf('local:Registrate-MC1.19:1.1.5')
    compileOnly fg.deobf('local:architectury:6.6.92-forge')
    compileOnly fg.deobf('local:jei-1.19.2-forge:11.8.1.1034')
    compileOnly fg.deobf('local:cc-tweaked-1.19.2:1.101.4')
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
    // MixinExtras as upstream uses it. Not nested: the pack already loads MixinExtras 0.5.4 (jar-in-jar of other mods).
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
}

// ---- Port phase (plan_power_grid.md section 1, "Phase manifest") -------------------------------------------------------
// A number: sub-steps of a phase are decimals (P9a to P9d = 9.1 to 9.4, PORT_NOTES.md section 5).
def portPhase = new BigDecimal((project.findProperty('port_phase') ?: '0').toString())
def manifestFile = file('phases.json')

// PortPhase.java: CURRENT and the phase of every id in phases.json, so registration code can check isPorted().
def portPhaseSource = tasks.register('portPhaseSource') {
    description = 'Generates org.patryk3211.powergrid.PortPhase from port_phase and phases.json'
    def out = layout.buildDirectory.dir('generated/sources/portPhase')
    inputs.property('portPhase', portPhase)
    inputs.file(manifestFile)
    outputs.dir(out)
    doLast {
        def m = new groovy.json.JsonSlurper().parse(manifestFile)
        def kinds = ['blocks', 'items', 'entities', 'fluids', 'menus']
        def sb = new StringBuilder()
        sb << '// Generated by backportedPowerGrid/build.gradle (portPhaseSource) from gradle.properties port_phase and phases.json.\n'
        sb << '// Do not edit.\npackage org.patryk3211.powergrid;\n\nimport java.util.Map;\n\n'
        sb << 'public final class PortPhase {\n'
        sb << "    /** The port phase this jar was built for (gradle.properties port_phase). */\n"
        sb << "    public static final double CURRENT = ${portPhase}d;\n"
        sb << '    /** First phase that registers content (P2, grid base). */\n    public static final int FIRST_CONTENT_PHASE = 2;\n\n'
        kinds.each { k ->
            def entries = (m[k] ?: [:]).collect { id, ph -> "Map.entry(\"${id}\", ${ph}d)" }
            sb << "    private static final Map<String, Double> ${k.toUpperCase()} = Map.ofEntries(\n            " << entries.join(',\n            ') << ');\n'
        }
        sb << '''
    private PortPhase() {}

    private static Map<String, Double> table(String kind) {
        return switch(kind) {
            case "block" -> BLOCKS;
            case "item" -> ITEMS;
            case "entity" -> ENTITIES;
            case "fluid" -> FLUIDS;
            case "menu" -> MENUS;
            default -> throw new IllegalArgumentException("Unknown kind " + kind);
        };
    }

    /** Phase of an upstream id ({@code kind}: block, item, entity, fluid, menu); a block's item is looked up as a block. */
    public static double phaseOf(String kind, String id) {
        Double phase = table(kind).get(id);
        if(phase == null && kind.equals("item"))
            phase = BLOCKS.get(id);
        if(phase == null)
            throw new IllegalArgumentException("powergrid:" + id + " (" + kind + ") is not in phases.json");
        return phase;
    }

    public static boolean isPorted(String kind, String id) {
        return phaseOf(kind, id) <= CURRENT;
    }

    /** Registration guard: fails when code registers an id of a later phase (never half-register, plan section 1). */
    public static String require(String kind, String id) {
        if(!isPorted(kind, id))
            throw new IllegalStateException("powergrid:" + id + " (" + kind + ") is phase " + phaseOf(kind, id)
                    + " but this build is phase " + CURRENT);
        return id;
    }
}
'''
        def f = new File(out.get().asFile, 'org/patryk3211/powergrid/PortPhase.java')
        f.parentFile.mkdirs()
        f.text = sb.toString()
    }
}
sourceSets.main.java.srcDir(portPhaseSource)

// The resources that ship at this phase: tools/pg_phase_check.py checks the manifest and the recipe gate (fails the build
// on a problem) and copies src/main/resources minus later-phase files, with tag entries for unported ids removed.
def phaseResources = tasks.register('phaseResources', Exec) {
    description = "Filters src/main/resources to port phase ${portPhase} (tools/pg_phase_check.py)"
    def out = layout.buildDirectory.dir('generated/phaseResources')
    def script = rootProject.file('tools/pg_phase_check.py')
    inputs.property('portPhase', portPhase)
    inputs.file(manifestFile)
    inputs.file(script)
    inputs.dir('src/main/resources')
    outputs.dir(out)
    commandLine 'python3', '-I', script.absolutePath, '--manifest', manifestFile.absolutePath,
            '--resources', file('src/main/resources').absolutePath, '--phase', portPhase.toPlainString(), '--out', out.get().asFile.absolutePath
}
sourceSets.main.resources.srcDirs = []
sourceSets.main.resources.srcDir(phaseResources)

// The EJML jars go into META-INF/jarjar/ with the metadata Forge's jar-in-jar locator reads.
def jarJarMetadata = tasks.register('jarJarMetadata') {
    description = 'Writes META-INF/jarjar/metadata.json for the nested EJML jars'
    def out = layout.buildDirectory.dir('generated/jarjar_metadata')
    inputs.files(configurations.nestedLibs)
    outputs.dir(out)
    doLast {
        def jars = configurations.nestedLibs.resolvedConfiguration.resolvedArtifacts.collect { a ->
            def id = a.moduleVersion.id
            [identifier: [group: id.group, artifact: id.name],
             version   : [range: "[${id.version},)", artifactVersion: id.version],
             path      : "META-INF/jarjar/${a.file.name}",
             isObfuscated: false]
        }
        def f = new File(out.get().asFile, 'META-INF/jarjar/metadata.json')
        f.parentFile.mkdirs()
        f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: jars])) + '\n'
    }
}
tasks.named('jar', Jar).configure {
    from(jarJarMetadata)
    into('META-INF/jarjar') {
        from(configurations.nestedLibs)
    }
}

// Port in progress: report every compile error, not javac's default first 100.
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}
