# backportedYuushyaModelling: Yuushya Modelling 2.4.1 (Forge 1.20.1) backported to Forge 1.19.2
# (feature_writeup/plan_yuushya_backport.md). Minecraft/Forge/mappings/Java settings are shared and live in the root
# gradle.properties.
#
# Upstream mod id (R2): every id (yuushya:showblock, yuushya:itemblock, ...), block entity key and item NBT key as
# upstream, so 2.2.0 saves load.
mod_id=yuushya_modelling
mod_name=Yuushya Modelling
# GPLv3 for everything we write or change; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GPL-3.0-only
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=2.4.1-ce-19.2-02
mod_group_id=com.yuushya.modelling
mod_authors=Coco, Xiao2 or XiLaiTL, SQwatermark, XieZai, Hikari, LD_Anvil, Little Panda, Crystal1921, ZhuRuoLing (Yuushya Modelling); 1.19.2 backport: SaintAlfonzo
mod_description=Tools to move, rotate and resize blocks and items like 3D modelling. Backport of Yuushya Modelling 2.4.1 to Forge 1.19.2.
# Jar file name: backportedYuushyaModelling-<mod_version>.jar
jar_name=backportedYuushyaModelling
mixin_configs=yuushya_modelling.mixins.json
# Mixin refmap (ce.forge-mod-refmap): mixins use Mojang names
refmap_name=yuushya_modelling.refmap.json
# Same mod id as the stock 2.2.0 jar, so installToMods moves that one out of mods/ (server_mods/ mirrors mods/ through
# tools/dump_server_mods.py).
replaces_jars=yuushya-modelling-*.jar
