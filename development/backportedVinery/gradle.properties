# backportedVinery: Let's Do Vinery 1.5.5 (Fabric 1.21.1) ported to Forge 1.19.2. Replaces the pack's
# letsdo-vinery-forge-1.3.10.jar and doapi-1.1.0b.jar. Minecraft/Forge/mappings/Java settings are shared and live in
# the root ../gradle.properties.
#
# The jar holds only code (upstream's MIT code, ported, plus ours) and files we write ourselves. Upstream's textures,
# models, lang and data (All Rights Reserved) are read at runtime from the unmodified upstream jars in
# <game dir>/vinery_upstream/ (feature_writeup/alcohol.md B4.8).

# Upstream mod id, so every resource location (vinery:red_wine, #vinery:...) and old world keeps working.
mod_id=vinery
mod_name=Let's Do Vinery (Backport)
# GPLv3 for everything we write; the upstream MIT notices are kept in NOTICE-upstream-MIT.txt
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.5.5-ce-19.2-03
mod_group_id=net.satisfy.vinery
mod_authors=satisfy, Cristelknight (Let's Do Vinery); 1.19.2 backport: SaintAlfonzo
mod_description=Grapes, wine and apple presses. Backport of Let's Do Vinery 1.5.5 to Forge 1.19.2; reads its art and data from the upstream jars in vinery_upstream/.

# Jar file name: backportedVinery-<mod_version>.jar
jar_name=backportedVinery
mixin_configs=vinery.mixins.json
# Same mod id as the stock 1.3.10 jar, so `installToMods` moves that one out of mods/ too (it becomes a resource donor
# in vinery_upstream/). doapi is only there for 1.3.10.
replaces_jars=letsdo-vinery-forge-1.3.10.jar,doapi-*.jar
