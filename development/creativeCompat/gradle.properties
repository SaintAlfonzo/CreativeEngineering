# Creative Compat: compatibility fixes and tweaks for third-party mods that have no wider system of their own (feature_writeup/creative_compat.md).
# Carved out of Creative Common on 2026-11-01 (feature_writeup/creative_split.md 7.6, wave 3).
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativecompat
mod_name=Creative Compat
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativecompat
mod_authors=SaintAlfonzo
mod_description=Compatibility fixes and tweaks for other mods: Quark, Supplementaries, Handcrafted, FTB, Lightman's Currency, Polymorph, Sophisticated Backpacks, Pretty Pipes, TrashSlot, MCA, Breezy, ItemPhysic, Immersive Paintings, Corpse and more. A mod's tweaks apply only when that mod is installed. Also: melting of ice and snow by salt, fire and lava (no fire in the End), Create: Gravity low gravity for items, blocks, projectiles and boats, glass shards from broken glass with Quark, sneak pick-up into sacks, Alex's Mobs' Fleet-Footed fix, and squid that flee cachalot whales. Changes to vanilla behavior (walk-through blocks, falling snow layers, golem farm cooldown, boat friction, toast filter, sign text distance and others) each have an on/off switch in the [mixins] section of creativecompat-common.toml, all on by default.
# Jar file name: creativecompat-<mod_version>.jar
jar_name=creativecompat
# Mixins applied only when their mod is loaded (compat/CompatMixinPlugin), SRG names with remap = false.
mixin_configs=creativecompat.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin,packs
shared_base=com.SaintAlfonzo.creativecompat
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true

# No members: Compat ships on its own with no donor jar. Tempad (nested here until 2026-11-07) is its own jar,
# development/backportedTempad.
