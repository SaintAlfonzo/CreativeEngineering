# Creative Compat: the pack's tweaks to third-party mods that have no wider system of their own (feature_writeup/creative_compat.md).
# Carved out of patcherMod on 2026-11-01 (feature_writeup/creative_split.md 7.6, wave 3). Every other Creative jar requires it.
# Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
mod_id=creativecompat
mod_name=Creative Compat
mod_license=GNU GPL3
mod_version=1.0.0
mod_group_id=com.SaintAlfonzo.creativecompat
mod_authors=SaintAlfonzo
mod_description=The Creative Engineering pack's tweaks to other mods: Quark, Supplementaries, Handcrafted, FTB, Lightman's Currency, Polymorph, Sophisticated Backpacks, Pretty Pipes, TrashSlot, MCA, Breezy, ItemPhysic, Immersive Paintings and more. Each tweak applies only when its mod is installed. Every other Creative mod requires it.
# Jar file name: creativecompat-<mod_version>.jar
jar_name=creativecompat
# Mixins applied only when their mod is loaded (compat/CompatMixinPlugin), SRG names with remap = false.
mixin_configs=creativecompat.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=mixinplugin
shared_base=com.SaintAlfonzo.creativecompat
# No Mixin refmap: mixins use SRG member names with remap = false, so the AP target validator is off (ce.forge-mod)
disable_target_validator=true
