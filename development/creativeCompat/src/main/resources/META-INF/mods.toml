# Creative Compat (feature_writeup/creative_compat.md): the pack's tweaks to third-party mods. Registers one block entity
# (the botanist pot) and one network channel (sack scrolling); its ids keep the creativeengineering namespace.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.creativecompat]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.creativecompat]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# patcherMod: KubeJS, the shared helpers, the startup script loader and the Common APIs this jar calls (swap/ConfigRename,
# the WTHIT and JEI holders). Becomes creativecommon at the final swap (creative_split.md 7.6 Q1). The range must exclude
# every patcherMod that still carries the compat classes and mixins (they would apply twice).
[[dependencies.creativecompat]]
modId="creativeengineering"
mandatory=true
versionRange="[1.1.06,)"
ordering="AFTER"
side="BOTH"
# The mods the tweaks target: optional, each mixin is gated on its mods (compat/CompatMixinPlugin) and each listener on
# ModList. No ordering: patcherMod never declared them either, so the load order stays as it was before the carve.
[[dependencies.creativecompat]]
modId="handcrafted"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"
