# backportedTempad: Tempad 3.0.4 (NeoForge 1.21.1, Kotlin) ported to Forge 1.19.2 in Java (feature_writeup/immersive_portals.md
# 2.1.1, TP-D1..TP-D7). Minecraft/Forge/mappings/Java settings are shared and live in the root gradle.properties.
#
# The jar holds only code (upstream's MIT code, translated, plus ours) and files we write ourselves. Upstream's textures,
# models, lang, sounds and blockstates (All Rights Reserved) and its data (MIT) are read at runtime, in memory, from the
# unmodified upstream jar in <game dir>/tempad_upstream/.
# Upstream mod id, so every resource location (tempad:tempad, #tempad:...) matches the upstream art and data.
mod_id=tempad
mod_name=Tempad
# GPLv3 for everything we write; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GPL-3.0-only
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=3.0.4-ce-19.2-01
mod_group_id=earth.terrarium.tempad
mod_authors=CodexAdrian (Tempad); 1.19.2 port: SaintAlfonzo
mod_description=A device that opens timedoors to saved locations. Port of Tempad 3.0.4 to Forge 1.19.2; reads its art and data from the upstream jar in tempad_upstream/.
# Jar file name: backportedTempad-<mod_version>.jar
jar_name=backportedTempad
# No mixins yet (phase 1 common side needs none; the client side may add tempad.mixins.json and change this).
mixin_configs=none
# Ships nested in this bundle (its bundle_members lists :backportedTempad). Remove this line to ship as a standalone jar.
bundled_in=creativeCompat
# Same mod id as the stock 1.19.2 Tempad (1.4.x), so installToMods moves that one out of mods/ too (standalone case;
# the host bundle lists the same glob).
replaces_jars=tempad-forge-*.jar
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,upstream
shared_base=earth.terrarium.tempad
# TP-D1: no upstream resources in the jar (ce.forge-mod checkNoUpstreamResources)
resource_guard_jars=tempad_upstream/tempad-1.21.1-3.0.4-all.jar
resource_guard_name=Tempad
resource_guard_own_files=META-INF/mods.toml,META-INF/MANIFEST.MF,pack.mcmeta
