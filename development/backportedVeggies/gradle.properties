# backportedVeggies: Veggies Delight 1.9.2 (Forge 1.20.1) ported to Forge 1.19.2. No 1.19.2 build of the mod exists.
# Minecraft/Forge/mappings/Java settings are shared and live in the root ../gradle.properties.
#
# Plan and decisions: feature_writeup/veggies_delight.md. The port drops VD's bell pepper line (Rustic Delight's
# peppers take its place), smoked pepper, advancements, chest-loot GLMs, trades, compost hook, config and the recipes
# for mods not in the pack; the pack adds those back through its own tools.

# Upstream mod id, so every resource location (veggiesdelight:broccoli, ...) matches the upstream data.
mod_id=veggiesdelight
mod_name=Veggies Delight (Backport)
# GPLv3 for everything we write; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=1.9.2-ce-19.2-03
mod_group_id=net.mehdinoui.veggiesdelight
mod_authors=mehdinoui (Veggies Delight); 1.19.2 backport: SaintAlfonzo
mod_description=Vegetables, wild plants and dishes for Farmer's Delight. Backport of Veggies Delight 1.9.2 to Forge 1.19.2.

# Jar file name: backportedVeggies-<mod_version>.jar
jar_name=backportedVeggies
mixin_configs=veggiesdelight.mixins.json
