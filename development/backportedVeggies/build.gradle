// backportedVeggies: Veggies Delight 1.9.2 (Forge 1.20.1) ported to Forge 1.19.2 (mod id veggiesdelight).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle.
// Build from the instance root (`./gradlew :backportedVeggies:build`) or from here (`./gradlew build`).
// Resources come from the upstream jar through tools/port_resources.py (run it again after changing it).
plugins {
    id 'ce.forge-mod'
}

dependencies {
    // Farmer's Delight is the one hard dependency. fg.deobf remaps the SRG-named jar to Mojang names, so our classes
    // can extend its blocks (PieBlock, FeastBlock) and items.
    // flatDir notation: 'local:<file name without -version>:<version>'
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
}

// Access transformer (SRG names; the same ids as upstream's 1.20.1 AT, checked against the 1.19.2 mappings).
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
