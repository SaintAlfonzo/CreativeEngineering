// backportedTempad: Tempad 3.0.4 (NeoForge 1.21.1, Kotlin) ported to Forge 1.19.2 in Java (mod id tempad),
// feature_writeup/immersive_portals.md 2.1.1. Self-contained: it uses no other in-tree mod, so it can ship nested in a
// bundle (set bundled_in in gradle.properties) or as its own jar (no bundled_in; see PORT_NOTES.md "Moving this member").
// Standalone since 2026-11-07 (development/backportedTempad); planned to fold into Creative Computing.
// The jar holds only code (upstream's MIT code, translated, plus ours); art and data are read at runtime from the
// unmodified upstream jar in <game dir>/tempad_upstream/ (forge/UpstreamJars, forge/UpstreamTranslator).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle.
// Build from the instance root: ./gradlew :backportedTempad:build --offline
plugins {
    id 'ce.forge-mod'
}

dependencies {
    // Phase 4 optional compat (TP-D8): compile against the pack's own jars in <instance>/mods/ (not the host's libs/, so
    // the member builds the same in any bundle). Runtime never needs them: every use is behind a ModList check, and
    // WTHIT reads waila_plugins.json only when it is installed. Curios 5.1 (CuriosCompat, CuriosRenderer), FTB Teams +
    // FTB Library + Architectury (FTBTeamsCompat; Team's supertypes), WTHIT (WthitPlugin, WthitClientPlugin).
    compileOnly fileTree(dir: rootProject.file('mods'), include: [
            'curios-forge-1.19.2-*.jar',
            'ftb-teams-forge-*.jar', 'ftb-library-forge-*.jar', 'architectury-*-forge.jar',
            'wthit-1.19.2-forge-*.jar'])
}

// Port in progress: report every compile error, not javac's default first 100.
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}
