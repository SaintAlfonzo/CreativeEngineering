# exposureBackport: Exposure 1.9.19 + its addons Expanded 1.0.1, Polaroid 1.1.6 and Catalog 1.1.2
# (NeoForge 1.21.1) ported to Forge 1.19.2, plus this pack's Exposure Extras (src/extras), all in one jar. Minecraft/Forge/mappings/Java settings are
# shared and live in the root ../gradle.properties.

# The jar holds five mods (see src/main/resources/META-INF/mods.toml). mod_id is the base mod; it keeps
# upstream's id so every upstream resource location (exposure:..., #exposure:lenses, ...) ports as is.
mod_id=exposure
mod_name=Exposure (Backport & Extras)
# GPLv3 for everything we write; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GNU GPL3
# <upstream Exposure version>-ce-<MC 1.19.2>-<port build>
mod_version=1.9.19-ce-19.2-02
mod_group_id=io.github.mortuusars.exposure
mod_authors=mortuusars (Exposure, Exposure Polaroid, Exposure Catalog); Sparkwave, JohnRamRu (Exposure: Expanded); 1.19.2 backport: SaintAlfonzo
mod_description=Camera mod with focus on process and aesthetics. Backport of Exposure 1.9.19 and its Expanded, Polaroid and Catalog addons to Forge 1.19.2, plus Extras (camera bags).

# Jar file name: exposureBackport-<mod_version>.jar
jar_name=exposureBackport
# Every mixin config in the jar (Forge 1.19.2 reads them from the jar manifest, not mods.toml).
# Same names as upstream with neoforge -> forge; refmaps are generated per source set (build.gradle).
mixin_configs=exposure-common.mixins.json,exposure-forge.mixins.json,exposure_expanded.mixins.json,exposure_polaroid-common.mixins.json,exposure_polaroid-forge.mixins.json,exposure_catalog-common.mixins.json,exposure_catalog-forge.mixins.json
# Same mod id as the stock Exposure jar, so `installToMods` moves that one out of mods/ too.
replaces_jars=exposure-1.19.2-*-forge.jar
