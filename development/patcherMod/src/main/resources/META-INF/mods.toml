# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="GNU GPL3"
[[mixins]]
config = "creativeengineering.mixins.json"
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId="creativeengineering" #mandatory
# The version number of the mod
version="${mod_version}" #mandatory
# A display name for the mod
displayName="Creative Engineering" #mandatory
# A text field displayed in the mod UI
authors="SaintAlfonzo" #optional

# The description text for the mod (multi line!) (#mandatory)
description='''Content for Creative Engineering'''
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.creativeengineering]] #optional
# the modid of the dependency
modId="forge" #mandatory
# Does this dependency have to exist - if not, ordering below must be specified
mandatory=true #mandatory
# The version range of the dependency
versionRange="${forge_version_range}"#mandatory
# An ordering relationship for the dependency - BEFORE or AFTER required if the dependency is not mandatory
# BEFORE - This mod is loaded BEFORE the dependency
# AFTER - This mod is loaded AFTER the dependency
ordering="NONE"
# Side this dependency is applied on - BOTH, CLIENT, or SERVER
side="BOTH"
# Here's another dependency
[[dependencies.creativeengineering]]
modId="minecraft"
mandatory=true
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange="1.19.2"
ordering="NONE"
side="BOTH"

# Create: MechanicalMixerBlockEntityMixin + DragonBreathBrewing patch it. Not
# strictly mandatory (the patch no-ops if absent) but must load first.
[[dependencies.creativeengineering]]
modId="create"
mandatory=false
versionRange="[0.5.1,)"
ordering="AFTER"
side="BOTH"

# ItemPhysic: ItemPhysicServerMixin splits its burningItems bucket into fire/lava and
# makes swimmingItems additive. Optional, but must load first if present.
[[dependencies.creativeengineering]]
modId="itemphysic"
mandatory=false
versionRange="[1.6,)"
ordering="AFTER"
side="BOTH"

# Create: Deep Dark: EchoArmorEffectProcedureMixin swaps the echo full-set bonus
# (Resistance + Strength -> Night Vision + better_beacons:phantom_bane). Optional; the
# mixin just no-ops (target class absent) if the mod is missing.
[[dependencies.creativeengineering]]
modId="create_deep_dark"
mandatory=false
versionRange="[1.7,)"
ordering="AFTER"
side="BOTH"

# Easy Elytra Takeoff: EasyElytraTakeoffHelperMixin widens its "is wearing an elytra"
# check so rocket-takeoff works with DragonLoot's upgraded_dragon_chestplate (and any
# #creativeengineering:elytra_chestplates member). Optional.
[[dependencies.creativeengineering]]
modId="easyelytratakeoff"
mandatory=false
versionRange="[4.0,)"
ordering="AFTER"
side="BOTH"

# Detail Armor Bar: DetailArmorBarCompat registers custom armor-bar icons/colors for modded
# armor sets via its own public API (plain call, not a mixin). Client-side mod - optional,
# no-ops if absent.
[[dependencies.creativeengineering]]
modId="detailab"
mandatory=false
versionRange="[2.6.4,)"
ordering="AFTER"
side="CLIENT"

