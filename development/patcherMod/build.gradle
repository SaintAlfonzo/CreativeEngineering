// Shared Forge setup (runs, mods.toml expansion, jar manifest, jar_archive, installToMods) comes from
// build-logic/src/main/groovy/ce.forge-mod.gradle; this file has only what is specific to patcherMod.
// Build from the instance root (`./gradlew :patcherMod:build`) or from here (`./gradlew build`).
plugins {
    id 'maven-publish'
    id 'ce.forge-mod'
    // Only its ShadowJar task type is used (relocateCommonmark below); no shadowJar of the whole mod.
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

repositories {
    mavenCentral()
}

configurations {
    // Libraries bundled into the jar under our own package (relocated, so no other mod can clash with them).
    shade
}

dependencies {
    // Third-party mod jars copied from ../mods (git-ignored). They are SRG-named, see the note below.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    // In-tree ports, compiled against the project (never a copied jar): the coaster renderer offset
    // (CoasterRendererOffsetMixin) and the dish blocks (compat/DisplayDelightDishBlocks).
    compileOnly project(':backportedBrewin')
    compileOnly project(':backportedDisplay')

    // Markdown parser for the changelog screen (changelog/ChangelogMarkdown). BSD-2-Clause, see NOTICE-commonmark.txt.
    shade 'org.commonmark:commonmark:0.21.0'
}

// The shaded libraries are relocated BEFORE compiling, so the source imports the relocated package
// (com.SaintAlfonzo.creativeengineering.shadow.commonmark) and the normal jar -> reobfJar -> archive/install
// chain stays as it is: the relocated classes are copied into the jar and reobf leaves them alone.
def relocateCommonmark = tasks.register('relocateCommonmark', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    configurations = [project.configurations.shade]
    archiveFileName = 'shade-relocated.jar'
    destinationDirectory = layout.buildDirectory.dir('shade')
    relocate 'org.commonmark', 'com.SaintAlfonzo.creativeengineering.shadow.commonmark'
    exclude 'META-INF/**', 'module-info.class'
}

dependencies {
    compileOnly files(relocateCommonmark)
}

tasks.named('jar', Jar).configure {
    dependsOn relocateCommonmark
    from(relocateCommonmark.map { zipTree(it.archiveFile) }) {
        exclude 'META-INF/**'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
