// backportedMiners: Miner's Delight 1.4.5 + 1.1.2 merged and ported to Forge 1.19.2 (mod id miners_delight).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle (+ ce.forge-mod-refmap.gradle).
// Build from the instance root (`./gradlew :backportedMiners:build`) or from here (`./gradlew build`).
plugins {
    id 'ce.forge-mod-refmap'
}

dependencies {
    // Farmer's Delight is the one hard dependency (cooking recipes, feasts, wild crops, heat sources).
    // flatDir notation: 'local:<file name without -version>:<version>'
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
    // Optional: the Copper Pot JEI category. The plugin class is only loaded by JEI.
    compileOnly fg.deobf('local:jei-1.19.2-forge:11.8.1.1034')
}

// Access transformer (SRG names): PotionBrewing.addMix for the haste potions.
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
