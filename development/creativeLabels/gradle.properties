# creativeLabels: Creative Labels, sticky notes and labels as one face_paper block. Minecraft/Forge/mappings/Java
# settings are shared and live in the root ../../gradle.properties.

mod_id=creativelabels
mod_name=Creative Labels
# GPLv3, like everything else of ours (LICENSE.txt)
mod_license=GPL-3.0-only
mod_version=1.0.1
mod_group_id=com.SaintAlfonzo.creativelabels
mod_authors=SaintAlfonzo
mod_description=Sticky notes and labels as paper on block faces: one face_paper block holds up to five dyeable, writable notes or one label with an item picture per face. Keeps text labels on items (inventory, anvil, off hand). Uses Sticky It! and Labels as art donors until its own art exists.

# Jar file name: creativeLabels-<mod_version>.jar
jar_name=creativeLabels
mixin_configs=creativelabels.mixins.json
# Shared Java sources (development/shared/, feature_writeup/pack_tooling.md "Shared Java sources")
shared_sources=packs,mixinplugin,itemhidden
shared_base=com.SaintAlfonzo.creativelabels
# Mixin refmap (ce.forge-mod-refmap): mixins use Mojang names
refmap_name=creativelabels.refmap.json
