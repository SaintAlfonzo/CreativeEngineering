// backportedVintage: Vintage Delight 0.1.6 (Forge 1.20.1) ported to Forge 1.19.2 (mod id vintagedelight).
// Shared Forge setup comes from build-logic/src/main/groovy/ce.forge-mod.gradle (+ ce.forge-mod-refmap.gradle).
// Build from the instance root (`./gradlew :backportedVintage:build`) or from here (`./gradlew build`).
// Resources come from the upstream jar through tools/port_resources.py (run it again after changing it).
plugins {
    id 'ce.forge-mod-refmap'
}

dependencies {
    // Farmer's Delight is the one hard dependency. fg.deobf remaps the SRG-named jars to Mojang names, so our classes
    // can extend its blocks (PieBlock, WildCropBlock, SafetyNetBlock) and items.
    // flatDir notation: 'local:<file name without -version>:<version>'
    compileOnly fg.deobf('local:FarmersDelight-1.19.2:1.2.4')
    // Optional: the Pickling Jar category. The plugin class is only loaded by JEI.
    compileOnly fg.deobf('local:jei-1.19.2-forge:11.8.1.1034')
}

// Access transformer (SRG names; the same ids as upstream's 1.20.1 AT less the PotionBrewing lines, checked against
// the 1.19.2 mappings by the Veggies port).
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
