# backportedVintage: Vintage Delight 0.1.6 (Forge 1.20.1) ported to Forge 1.19.2. No 1.19.2 build of the mod exists.
# Minecraft/Forge/mappings/Java settings are shared and live in the root ../gradle.properties.
#
# Plan and decisions: feature_writeup/vintage_delight.md. The port drops the gearo berry line, the Dehydrated effect and
# potions, the pickled pitcher pod, the Galosphere/Spelunkery/Diet data, the chest-loot GLMs and the biome modifiers of
# the four wild plants (the pack places them); it takes KOTS 0.3.1's jar ids, Cucumber Dough and a few fixes.

# Upstream mod id, so every resource location (vintagedelight:oat, ...) matches the upstream data.
mod_id=vintagedelight
mod_name=Vintage Delight (Backport)
# GPLv3 for everything we write; the upstream MIT notice is kept in NOTICE-upstream-MIT.txt
mod_license=GNU GPL3
# <upstream version>-ce-<MC 1.19.2>-<port build>
mod_version=0.1.6-ce-19.2-01
mod_group_id=net.ribs.vintagedelight
mod_authors=Ribs (Vintage Delight); 1.19.2 backport: SaintAlfonzo
mod_description=Oats, peanuts, cucumbers, ghost peppers, salt, cheese, mason jars and pickling for Farmer's Delight. Backport of Vintage Delight 0.1.6 to Forge 1.19.2.

# Jar file name: backportedVintage-<mod_version>.jar
jar_name=backportedVintage
mixin_configs=vintagedelight.mixins.json
