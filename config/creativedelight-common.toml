
#One switch per Creative Delight member. Off: Creative Delight's scripts skip that member's recipe,
#tag and loot rows (the member's own data is untouched). Server scripts re-read it on /reload.
[members]
	oceansdelight = true
	oceanic_delight = true
	ends_delight = true
	rusticdelight = true
	delightful = true
	enders_additions = true
	hearthandharvest = true
	nethersdelight = true
	roll_delight = true
	largemeals = true
	barbequesdelight = true
	veggiesdelight = true
	vintagedelight = true
	fungidelight = true
	miners_delight = true
	displaydelight = true
	salt = true
	create__the_salt = true
	canned_goods = true
	goldenfood = true

#One switch per Creative Delight QoL feature (feature_writeup/creative_delight.md 8). Off: that feature
#is skipped entirely. Startup and Java parts need a restart, server scripts re-read on /reload, client
#scripts on F3+T.
[qol]
	#QoL-1: ingredient leftovers (bottles, bowls, buckets) stay in the Farmer's Delight cooking
	#pot and the Farmer's Respite kettle (two take-only slots). Off: they are thrown out as in the original mods.
	#The stall and recycle dials are [cooking] below; the oven is its own block there.
	remainderBuffer = true
	#QoL-2: the 'Placeable' / 'Placeable on plate' tooltip lines, in place of the mods' own.
	placeableTooltips = true
	#QoL-4: Creative Delight's composter chances for member foods. Off: those foods fall to the pack's
	#compost rules.
	compost = true
	#QoL-5: grid meals on cooked food re-made as manual-only crafts, heatless routes for pot
	#meals, tortilla wraps (Veggies, Vintage and Fungi Delight). Off: the mods' own recipes stay.
	manualOnlyRoutes = true
	#QoL-6: the WTHIT 'Growth' line for plants WTHIT doesn't cover (only with WTHIT).
	#Dials: [crop_growth] below.
	wthitCropLine = true
	#QoL-6: JEI information pages for member mechanics (only with JEI).
	jeiInfoPages = true
	#QoL-7: sneak right-click with an empty hand picks up a cooking pot, copper pot, kettle or
	#skillet (#creativedelight:cookware_pickup) into the hand, as if broken; sneak left-click toggles the handle.
	#Off: sneak right-click toggles the handle as in the original mods.
	cookwarePickup = true
	#QoL-8: a cooking pot, copper pot or kettle broken by a player (or picked up, QoL-7) keeps
	#its ingredients, meal and output in the item, restored when placed; the leftover slots drop. Off: everything but
	#the meal drops, as in the original mods (QoL-7 pickup then empties the station into the inventory).
	cookwareKeepContents = true

#One switch per Creative Delight worldgen system (feature_writeup/creative_delight.md 24). Rejoin the world
#to apply; only chunks generated afterwards change.
[worldgen]
	#Which biomes each wild crop and fruit tree spawns in (_worldgen/wild_crops.json).
	#Off: every crop as its mod ships it.
	wildCrops = true

#WTHIT shows 'Growth: 60%' / 'Growth: Mature' only for CropBlock subclasses plus a few vanilla
#plants. This adds the same line, with the same wording and the same 'Crop progress' toggle in
#WTHIT's own config, to every other growing plant. The blocks and their stages are in
#assets/creativedelight/crop_growth.json (override it from kubejs/assets/creativedelight/).
#Client-side only; reads the block state the client already has. The line is Creative Delight's:
#its on/off switch is creativedelight-common.toml [qol] wthitCropLine.
[crop_growth]
	#true: a bush-type plant (BushBlock, not a sapling) with an integer 'age' that no rule in
	#crop_growth.json lists still gets a line, fully grown at its top age. Catches plants from
	#mods added later. false: only the plants in the file.
	fallback = true
	#true: plants that can be picked before they are fully grown (salmonberries from stage 3,
	#grapes from stage 2) read 'Growth: 75% (Harvestable)' until they finish. false: the
	#percentage only.
	showHarvestable = true

#Plain Dandelions mature into Mature Dandelions when planted on Rich Soil / Rich Soil Farmland
#or Fertile Soil. Values are the average number of soil random ticks per conversion
#(about one random tick a minute per block at the default randomTickSpeed). 0 = off for that soil.
#Takes effect immediately.
[dandelion_maturing]
	#Rich Soil and Rich Soil Farmland (Farmer's Delight).
	#Range: 0 ~ 100000
	richSoilTicks = 10
	#Fertile Soil (Immersive Weathering's mulch block).
	#Range: 0 ~ 100000
	fertileSoilTicks = 5

#Pack changes to crop harvest drops (server side, applied on /reload).
[crop_drops]

	#Rustic Delight bell peppers. A ripe plant drops one pepper picked by weight, then each
	#colour has its own bonus chance for one extra. Each colour's share of the picked pepper is
	#weight / (sum of weights). Per harvest, colour X averages
	#  weightX / (sum of weights) + bonusChanceX
	#Defaults (1:1:1, 0.15 each) give 0.483 of every colour. The mod ships 6:1:1 with no red
	#bonus (red about 58% of peppers). A weight of 0 takes the colour out of the main roll.
	[crop_drops.bell_peppers]
		#true: use the values below. false: the mod's own table, untouched.
		enabled = true
		#Weight of red in the main roll.
		#Range: 0 ~ 100
		redWeight = 1
		#Weight of green in the main roll.
		#Range: 0 ~ 100
		greenWeight = 1
		#Weight of yellow in the main roll.
		#Range: 0 ~ 100
		yellowWeight = 1
		#Chance [0-1] of one extra red pepper (0.15 = 15%).
		#Range: 0.0 ~ 1.0
		redBonusChance = 0.15
		#Chance [0-1] of one extra green pepper.
		#Range: 0.0 ~ 1.0
		greenBonusChance = 0.15
		#Chance [0-1] of one extra yellow pepper.
		#Range: 0.0 ~ 1.0
		yellowBonusChance = 0.15

	#Extra produce on better soil. A ripe crop whose block below is the soil gets one extra pool sized
	#to 'bonus' x the crop's average produce (seeds are not included): 0.33 = about a third more.
	#A crop that drops one item gets a 'bonus' chance of one more; a crop with a variable count gets
	#its average raised by the same share. The crop's own drops are unchanged. 0 = nothing for that soil.
	#Each crop is switched on in [crop_drops.soil_yield.crops].
	#feature_writeup/crop_yields.md lists every crop's drops.
	[crop_drops.soil_yield]
		#Vanilla farmland: share of extra produce.
		#Range: 0.0 ~ 4.0
		farmlandBonus = 0.0
		#Rich Soil Farmland: share of extra produce.
		#Range: 0.0 ~ 4.0
		richFarmlandBonus = 0.33
		#Fertile Soil (Immersive Weathering mulch): share of extra produce.
		#Range: 0.0 ~ 4.0
		fertileSoilBonus = 0.66
		#Untilled Rich Soil (only rice and adzuki grow on it): share of extra produce.
		#Range: 0.0 ~ 4.0
		richSoilBonus = 0.33

		#true: the crop gets the soil pools above. false: its drops are the same on every soil.
		[crop_drops.soil_yield.crops]
			wheat = true
			carrots = true
			potatoes = true
			beetroots = true
			cabbages = true
			onions = true
			tomatoes = true
			rice = true
			bell_peppers = true
			coffee = true
			cotton = true
			tobacco = true
			flax = true
			hemp = true
			corn = true
			cave_carrots = true
			broccoli = true
			cauliflower = true
			garlic = true
			sweet_potato = true
			turnip = true
			zucchini = true
			cucumber = true
			oats = true
			peanuts = true
			adzuki = true

#A stem that has grown its fruit (melon, pumpkin, hamimelon) can grow more on its other free
#sides, one at a time. Each extra fruit uses vanilla's stem growth roll (light, soil and
#hydration count the same) and also waits a minimum time since the stem's last fruit. The
#wait counts from the first random tick after a fruit grows. When the fruit the stem faces is
#taken, the stem turns to another of its fruits instead of back into a plain stem. Server side.
[stem_fruit]
	#Master on/off switch. Off = vanilla (one fruit per stem).
	enabled = true
	#Most fruits next to one stem (1 = vanilla, 4 = every side).
	#Range: 1 ~ 4
	maxFruits = 4
	#Minimum game minutes (1200 ticks) after the first fruit before a 2nd can grow.
	#Range: 0 ~ 1440
	secondFruitMinutes = 10
	#Minimum game minutes after the 2nd fruit before a 3rd can grow.
	#Range: 0 ~ 1440
	thirdFruitMinutes = 20
	#Minimum game minutes after the 3rd fruit before a 4th can grow.
	#Range: 0 ~ 1440
	fourthFruitMinutes = 40
	#true: a stem on soaked Fertile Soil gets Immersive Weathering's extra random ticks
	#(mulch_growth_random_ticks, 10 per soil tick). false: no extra ticks; Fertile Soil still counts
	#as moist farmland for the stem's own growth roll. Melon, pumpkin and cantaloupe stems alike.
	fertileSoilBoost = false

#Cans in #creativedelight:cans/servings/<n> hold n servings. Eating or crafting with
#one takes a serving; the servings left show as a durability bar and a tooltip line. The
#last serving leaves an empty can, a crushed can or nothing, rolled with the chances below.
[canning]
	#Off = every can behaves like the Canned Goods original (one serving, always an empty can).
	enabled = true
	#Chance [0-1] that an emptied can comes back as an empty can.
	#Range: 0.0 ~ 1.0
	emptyCanChance = 0.7
	#Chance [0-1] that it comes back as a crushed can instead. Whatever is left after both
	#chances gives nothing; if the two add up past 1, the crushed chance is cut to fit.
	#Range: 0.0 ~ 1.0
	crushedCanChance = 0.25
	#Item id handed back as the empty can.
	emptyCanItem = "canned_goods:empty_can"
	#Item id handed back as the crushed can.
	crushedCanItem = "canned_goods:crushed_empty_can"

#Leftover containers from ingredients (glass bottles, bowls, buckets) on the FD cooking pot, the
#Farmer's Respite kettle and the oven. A leftover the waiting meal is served in goes to the
#container slot; the rest goes to two leftover slots right of the output, which hoppers and
#funnels on the output faces can empty.
[cooking]
	#Oven only. Off = its leftovers are thrown out of the front. The pot and kettle
	#switch is creativedelight-common.toml [qol] remainderBuffer.
	remainderBuffer = true
	#On = a station whose leftover slots can't take a craft's leftovers waits (like a full output).
	#Off = it crafts anyway and throws what doesn't fit.
	stallWhenFull = true
	#On = an oven recipe ingredient with a count takes that many from one slot (3 wheat from a wheat
	#stack), so oven copies of 9-item crafting recipes cost the same as the craft. Off = every
	#ingredient takes one item from its own slot, and recipes that don't fit the 6 slots drop some of
	#their repeated items (feature_writeup/oven.md 2.6). Recipes are built at /reload.
	ovenIngredientCounts = false
	#Ticks a leftover recycled into the container slot (a bowl-food ingredient's bowl, a milk bottle's
	#bottle) stays visible there before the meal is plated with it, so the step can be seen.
	#0 = plate at once. Containers a player or hopper puts in plate at once either way.
	#Range: 0 ~ 100
	recycleShowTicks = 10
	#Ticks one Farmer's Respite Kettle brew takes (20 = 1 s) for every recipe that names no time of its
	#own (all of the pack's Kettle recipes). Read when recipes load: /reload to apply.
	#Range: 1 ~ 72000
	kettleBrewTicks = 600

#Performance throttles for other mods' per-tick work. See feature_writeup/perf.md section 7.
[perf]
	#Quark feeding trough: after an animal's trough search finds nothing, it does not search again for
	#this many ticks (600 = 30 s). Each search is a point-of-interest scan plus a ray cast, and a
	#hungry animal with no trough nearby repeated it every few ticks. Cost: a trough placed or
	#refilled next to an animal is noticed up to this long late. 0 = off (Quark's own behaviour).
	#Range: 0 ~ 72000
	troughMissCooldownTicks = 600

#Vintage Delight (Creative Delight). Was vintagedelight-common.toml (its values are carried over once).
[vintage]

	[vintage.pickling_jar]
		#Keep ingredient leftovers (glass bottles, bowls, buckets) in the Pickling Jar's leftover slot instead of
		#throwing them out.
		remainderBuffer = true
		#With remainderBuffer on, the jar waits instead of pickling when a batch's leftovers would not fit.
		#Off pickles anyway and throws what does not fit.
		stallWhenFull = true
		#Ticks a leftover the jar throws out (remainderBuffer off, or the slot full) waits before it leaves the jar.
		#0 throws it on the same tick as the batch.
		#Range: 0 ~ 1200
		overflowEjectDelayTicks = 20

	[vintage.worldgen]
		#Magic vine trees turn nearby dirt-like blocks into lush grass while they generate.
		magicVineConvertsDirtToLushGrass = true

#Salt (Creative Delight). Was salt-common.toml (its values are carried over once); same sections and keys.
#The client settings (salted overlay, JEI categories) stay in salt-client.toml.
[salt]

	#Salting foods to add extra nutrition. Can be disabled by removing 'salt:salting' recipe or removing all items from 'salt/tags/items/can_be_salted' tag.
	[salt.Salting]
		#Amount of additional nutrition that salted food provides. 1 nutrition = half of hunger shank.
		#Negative values will decrease hunger restored.
		#Range: -20 ~ 20
		SaltingNutrition = 2
		#Amount of additional saturation modifier to apply when food is eaten.
		#Range: -10.0 ~ 10.0
		SaltingSaturationModifier = 0.10000000149011612
		#Additional nutrition and saturation values per food. Overrides default values (defined above).
		#Format: itemRegistryName,nutrition,[saturationModifier].
		#Separated by commas. Saturation is optional (will use default value if not specified)
		SaltingFoodValues = ["minecraft:rotten_flesh,1,0.05"]

	[salt.Dissolving]
		#Salt blocks will dissolve if adjacent to blocks defined in the tag 'salt/tags/blocks/salt_dissolvables'
		SaltDissolvingEnabled = true
		#Chance of water dissolving in fluid on random tick. 1.0 = first random tick. 0.0 = never.
		#Range: 0.0 ~ 1.0
		SaltDissolvingChance = 0.35
		#If dissolved by a fluid source block - salt will convert to a fluid source block instead of air.
		SaltDissolvesIntoSourceBlocks = true
		#Salt blocks will dissolve when exposed to rain. Pack default: off.
		SaltDissolvingInRain = false
		#Chance of salt blocks dissolving in rain on random tick. 1.0 = first random tick. 0.0 = never.
		#Range: 0.0 ~ 1.0
		SaltDissolvingInRainChance = 0.15

	[salt.Melting]
		#Salt (item) will melt clicked blocks defined in tag 'salt/tags/blocks/meltables'.
		SaltItemMeltingEnabled = true
		#Salt blocks will melt adjacent blocks defined in tag 'salt/tags/blocks/meltables' on random tick.
		SaltBlockMeltingEnabled = true
		#Chance of block melting on random tick. 1.0 = first random tick. 0.0 = never.
		#Range: 0.0 ~ 1.0
		SaltBlockMeltingChance = 0.4
		#Melted ice is replaced with a water source block outside ultra-warm dimensions (the Nether).
		#Off: always air. Snow always leaves air.
		SaltMeltingPlaceWater = true

	[salt.Evaporation]
		#Water in a cauldron with a heat source beneath (defined in tag 'salt/tags/blocks/heaters') will evaporate and salt will be formed in the cauldron
		EvaporationEnabled = true
		#Chance of water evaporating on random tick. 1.0 = first random tick. 0.0 = never.
		#Range: 0.0 ~ 1.0
		EvaporationChance = 0.3

	[salt.GrowingSaltClusters]
		#Water dripping from a Pointed Dripstone on a blocks tagged as 'salt/tags/blocks/salt_cluster_growables' will grow Salt Clusters
		SaltClusterGrowingEnabled = true
		#Chance of cluster growing by one stage on random tick. 1.0 = first random tick. 0.0 = never.
		#Range: 0.0 ~ 1.0
		SaltClusterGrowingChance = 0.1

	#Rock Salt Deposits will generate in biomes defined in tag 'salt/tags/worldgen/biome/has_rock_salt_deposits'
	#Since 1.19 - parts of the Rock Salt generation is defined in jsons.
	#To enable/disable the generation or configure the generation chances you'll need to create a datapack.
	#Enable/disable generation - 'salt/worldgen/biome_modifier/add_rock_salt_deposit.json' - {"type": "forge:none"} will disable the generation.
	#Changing generation chances - 'salt/worldgen/placed_feature/mineral_rock_salt.json'
	[salt.RockSalt]
		#Size of the Rock Salt deposit
		#Range: 1 ~ 64
		RockSaltSize = 24
		#Chance of the Salt Clusters generating on the deposits (per side)
		#Range: 0.0 ~ 1.0
		RockSaltClusterChance = 0.15000000596046448

	[salt.VillagerTrades]
		#Butcher will buy and sell Salt (Salt's own trades). Pack default: off, the
		#pack's own butcher trade sells salt.
		ButcherSaltTradesEnabled = false

#Display Delight (Creative Delight): placing food on the floor and on plates. Was displaydelight-common.toml
#(its [Features] values are carried over once). Changes apply at once.
[display]
	#Display Delight's items in its creative tab (and so in JEI's list).
	creativeTabItems = true
	#Right-click with an axe hides a food's plate.
	axeHidesPlates = true
	#Mushroom stew, rabbit stew and beetroot soup can be placed. Off if that clashes with another mod.
	vanillaFoodPlacement = true
	#Skip the eating animation while plating some foods. Off if foods can't be eaten or plated.
	eatingAnimationFix = true
	#Right-click with a plate puts a hidden plate back.
	platesPutBack = true
	#A chat message when a food cannot be placed.
	placeMessage = true
	#A placed food broken with Silk Touch drops the food block item.
	silkTouchDropsFoodBlock = true
	#Shift right-click places all held items at once.
	placeAll = true
	#Shift right-click takes all items at once.
	takeAll = true

#Pack seasonings (crafted onto food, feature_writeup/seasonings.md).
[food]
	#Most seasonings one food may carry. A seasoning craft that would go past it does not match.
	#Which pairs may share a food is still each seasoning's combines list. Salt does not count.
	#Range: 1 ~ 16
	maxSeasonings = 2
	#On = Grilled (put on by the Barbeque's Delight Grill) counts toward maxSeasonings, and the Grill
	#does not add it to a skewer that is already full. Off = it never counts.
	grilledCountsTowardMax = false

#A lit campfire in #creativecommon:campfire/rain_douses (the plain campfire; not soul or
#Tinted campfires) goes out in open rain, unless it sits on a block in
##creativecommon:campfire/rain_proof_fuel (coal and charcoal blocks). Otherwise campfires
#burn forever. Server side.
[campfire]
	#Master on/off switch. Off = rain never puts a campfire out.
	rainDouses = true
	#Ticks of unbroken rain before the campfire goes out (160 = 8 s, Unlit Campfire's default).
	#Leaving the rain or being on a fuel block resets the count.
	#Range: 1 ~ 72000
	rainOutTicks = 160
	#Comfortable Campfires port (campfire.CampfireComfort): players near a lit campfire get Farmer's
	#Delight's Comfort, refreshed while under 3 s are left.
	comfort = true
	#Comfort when Farmer's Delight is present; false (or no Farmer's Delight) = Regeneration, as the mod.
	useComfort = true
	#Blocks around (and above) the campfire that count as near (the mod's 3).
	#Range: 1 ~ 16
	comfortDistance = 3
	#Seconds of Comfort per application (the mod's 5).
	#Range: 1 ~ 600
	comfortSeconds = 5
	#A campfire looks for players once per this many ticks (the mod checked every tick; campfires are
	#spread over the period). 1 = every tick.
	#Range: 1 ~ 200
	comfortEveryTicks = 20

#One switch per optional Creative Delight compartment (Java, assets and data folded into this jar).
#Each works only with its mod installed; off = as if that mod were absent: no blocks, no changes to it,
#no recipes or loot. Read at startup: restart to apply. Old saves keep the blocks only while it is on.
[compartments]
	#Incubation additions: emu nests (Alex's Mobs), duck and goose nests and egg crates (Untitled Duck Mod),
	#the goose golden egg (with Vintage Delight). Needs Incubation.
	incubation = true
	#Cooking for Blockheads additions: wood spice racks, tool racks and fruit baskets, kitchen corner storage,
	#oven fuel and smoking, the full-height fridge, counter-top placement. Needs Cooking for Blockheads and Balm.
	cookingforblockheads = true

#Cooking for Blockheads compartment ([compartments] cookingforblockheads).
#Small blocks on a Cooking for Blockheads counter or corner (#creativedelight:counter_supports):
#Farmer's Delight's cutting board, Display Delight's plates and plated foods, Brewin' and Chewin's
#coaster (#creativedelight:counter_toppers). The counter's worktop is 1 px lower than a full
#block, so they and what lies on them are drawn shifted by these offsets, in pixels (1/16 block):
#cuttingBoardOffset* for the board, plateOffset* for the plates and the coaster. X and Z are as
#seen on a counter facing north (door to the north, back edge to the south: +X = east, +Z = toward
#the back) and turn with the counter. Visual only; F3+A redraws.
[cookingforblockheads]
	#Sideways shift.
	#Range: -8.0 ~ 8.0
	cuttingBoardOffsetX = 0.0
	#Height shift; -1 puts the board on the worktop.
	#Range: -8.0 ~ 8.0
	cuttingBoardOffsetY = -1.0
	#Shift toward the counter's back (negative = toward the door).
	#Range: -8.0 ~ 8.0
	cuttingBoardOffsetZ = 0.0
	#Plates and coasters: sideways shift.
	#Range: -8.0 ~ 8.0
	plateOffsetX = 0.0
	#Plates and coasters: height shift; -1 puts them on the worktop.
	#Range: -8.0 ~ 8.0
	plateOffsetY = -1.0
	#Plates and coasters: shift toward the counter's back (negative = toward the door).
	#Range: -8.0 ~ 8.0
	plateOffsetZ = 0.0

#Incubation compartment ([compartments] incubation).
[incubation]
	#Untitled Duck Mod geese: chance, as 1 in N, that a goose lays a Golden Egg (Vintage Delight)
	#instead of its next goose egg. Rolled once per egg, before the goose looks for a nest; a golden egg
	#is always dropped on the ground near the goose, never laid in a nest. 0 = never.
	#Does nothing without Untitled Duck Mod and Vintage Delight.
	#Range: 0 ~ 1000000
	goldenEggChance = 1000

