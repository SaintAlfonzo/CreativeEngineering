
[moobloom]
	#Chance that a cow fed one of a variant's flowers turns into that moobloom.
	#The flower is used up whether or not it works.
	#Range: 0.0 ~ 1.0
	feedChance = 0.1
	#Chance that a sheared (bare) moobloom grows its flowers back each time it eats grass.
	#Range: 0.0 ~ 1.0
	regrowChance = 0.25
	#Shearing a bare moobloom (flowers already sheared off) turns it back into a cow.
	#When false, a bare moobloom can't be sheared.
	shearBareToCow = true
	#Shearing a bare moobloom back into a cow also drops the variant's shear drops.
	bareShearDrops = true

[spawning]
	#Master switch: natural cow spawns may be replaced by mooblooms (moobloom_spawns rules + rareChance).
	spawnSwap = true
	#Chance that any naturally spawning cow, anywhere, becomes a random moobloom (weighted by
	#each variant's any_weight). Applies after the biome rules, also to the cows they leave.
	#0 = off (the mod default; vanilla's pink sheep is 0.00164).
	#Range: 0.0 ~ 1.0
	rareChance = 0.002
	#Witherblooms spawn, very rarely, in soul sand valleys (biome tag
	##more_mooblooms:spawns_witherbloom). A built-in data pack: takes effect on the next world load.
	witherbloomSpawns = true

#Only used when Buzzier Bees is installed. Each switch is one cleanup of Buzzier Bees' moobloom,
#buttercup or Sunny effect. Data-pack switches take effect on the next world load / server start.
[buzzier_bees]
	#Turn off Buzzier Bees' moobloom spawns (sunflower plains).
	disableMoobloomSpawns = true
	#Turn off Buzzier Bees' removal of cows from sunflower plains.
	restoreCowSpawns = true
	#Buzzier Bees mooblooms never enter a world: existing ones are removed when
	#their chunk loads; eggs and /summon do nothing.
	removeMooblooms = true
	#Empty #buzzier_bees:moobloom_hostiles (zombies no longer hunt mooblooms).
	emptyHostilesTag = true
	#Hide Buzzier Bees' moobloom spawn egg from creative tabs and JEI.
	hideSpawnEgg = true
	#Two by Two asks for a bred More Mooblooms moobloom instead of Buzzier Bees' one.
	replaceTwoByTwo = true
	#How Did We Get Here no longer needs Sunny.
	removeSunnyFromAllEffects = true
	#No buttercup patches in new chunks.
	removeButtercupWorldgen = true
	#The Wandering Trader stops selling buttercups.
	removeButtercupTrade = true
	#Remove the buttercup recipes (yellow dye, Create milling, Abnormals Delight cutting).
	removeButtercupRecipes = true
	#Take the buttercup (and potted buttercup) out of every item and block tag,
	#so it can't make suspicious stew or go in flower boxes, planters and the like.
	removeButtercupTags = true
	#The composter no longer accepts buttercups.
	removeButtercupCompost = true
	#Hide the buttercup from creative tabs and JEI.
	hideButtercup = true
	#Turn the Sunny effect off completely: nothing can apply it (commands included),
	#it is removed from players and mobs when they join a world, and a mob with Sunny no
	#longer burns in daylight. Needs a restart (the burn check is a mixin).
	disableSunny = true

