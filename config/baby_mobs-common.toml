
#Which natural spawns are babies. The first mob of a spawn group is always an adult; each further
#member rolls this chance (vanilla's AgeableMob rule). A spawn egg used on an adult gives a baby
#(vanilla); otherwise spawn eggs and /summon give adults unless the NBT says Age:-24000.
[spawns]
	#Squid (vanilla 0.05)
	#Range: 0.0 ~ 1.0
	squidBabyChance = 0.05
	#Glow squid (vanilla 0.05)
	#Range: 0.0 ~ 1.0
	glowSquidBabyChance = 0.05
	#Dolphin (vanilla 0.10)
	#Range: 0.0 ~ 1.0
	dolphinBabyChance = 0.1

#Growing up.
[growth]
	#Ticks a baby takes to grow up (vanilla 24000 = 20 minutes)
	#Range: 1 ~ 1000000
	growTicks = 24000
	#Feeding a baby dolphin any #minecraft:fishes item ages it up by 10% of the time left (vanilla)
	dolphinFishFeeding = true

#Client.
[client]
	#Use the 26.1 (Tiny Takeover) baby models and textures for every remodelled baby
	#(squid, dolphins, farm animals, pets, horses, undead and the rest); false = vanilla 1.19.2 babies,
	#the adult model at half size
	babyModels = true
	#Babies of variant mobs. OLD_MODELS: the species in keepVanillaBabies, and any baby whose
	#coat comes from another mod with no 26.1 baby (Quark pride and shiny animals, Cozy's end and
	#nether cats), keep the 1.19.2 baby with that coat, mixed in with remodelled babies of the same
	#mob. NEW_MODELS: every baby that can be remodelled is; a coat with a matching 26.1 baby gets it
	#(More Mob Variants ashen wolf -> ashen baby), any other coat uses the mob's regular baby.
	#Allowed Values: OLD_MODELS, NEW_MODELS
	variantBabies = "OLD_MODELS"
	#With variantBabies = OLD_MODELS: entity ids whose babies all keep the 1.19.2 baby (the adult
	#model at half size, with the mob's own coat). Default: the mobs More Mob Variants gives coats
	#(owner, 2026-11-01). Cats stay remodelled; their More Mob Variants coats use the baby of the
	#cat's own vanilla coat.
	keepVanillaBabies = ["minecraft:wolf", "minecraft:cow", "minecraft:pig", "minecraft:chicken", "minecraft:sheep", "minecraft:zombie"]

