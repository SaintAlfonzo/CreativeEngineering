#Player changelog, "What's New" (client side). The notes are the pack's
#assets/creativeengineering/changelog/<version>.md files. Takes effect the next time a menu opens.
[changelog]
	#Master switch: off removes the book buttons and the update popup.
	enabled = true
	#Book button on the title screen, right of Singleplayer.
	titleButton = true
	#Book button on the pause menu, right of Back to Game.
	pauseButton = true
	#Speech bubble beside the book button while the newest version's notes are unread. Opening the
	#changelog once acknowledges it (config/creativeengineering/changelog_seen.txt).
	updatePopup = true

#Pack changes to crop harvest drops (server side, applied on /reload).
[crop_drops]

	#Rustic Delight bell peppers. A ripe plant drops one pepper picked by weight, then each
	#colour has its own bonus chance for one extra. Each colour's share of the picked pepper is
	#weight / (sum of weights). Per harvest, colour X averages
	#  weightX / (sum of weights) + bonusChanceX
	#Defaults (1:1:1, 0.15 each) give 0.483 of every colour. The mod ships 6:1:1 with no red
	#bonus (red about 58% of peppers). A weight of 0 takes the colour out of the main roll.
	[crop_drops.bell_peppers]
		#true: use the values below. false: the mod's own table, untouched.
		enabled = true
		#Weight of red in the main roll.
		#Range: 0 ~ 100
		redWeight = 1
		#Weight of green in the main roll.
		#Range: 0 ~ 100
		greenWeight = 1
		#Weight of yellow in the main roll.
		#Range: 0 ~ 100
		yellowWeight = 1
		#Chance [0-1] of one extra red pepper (0.15 = 15%).
		#Range: 0.0 ~ 1.0
		redBonusChance = 0.15
		#Chance [0-1] of one extra green pepper.
		#Range: 0.0 ~ 1.0
		greenBonusChance = 0.15
		#Chance [0-1] of one extra yellow pepper.
		#Range: 0.0 ~ 1.0
		yellowBonusChance = 0.15

	#Extra produce on better soil. A ripe crop whose block below is the soil gets 'tries' extra
	#chances at one more of its produce (seeds are not included), each at 'chance'. Average extra per
	#harvest = tries x chance. The crop's own drops are unchanged. 0 tries = nothing for that soil.
	#Each crop is switched on in [crop_drops.soil_yield.crops]; all are off by default.
	#feature_writeup/crop_yields.md lists every crop's drops.
	[crop_drops.soil_yield]
		#Vanilla farmland: extra tries.
		#Range: 0 ~ 8
		farmlandTries = 0
		#Vanilla farmland: chance [0-1] per try.
		#Range: 0.0 ~ 1.0
		farmlandChance = 0.0
		#Rich Soil Farmland: extra tries.
		#Range: 0 ~ 8
		richFarmlandTries = 2
		#Rich Soil Farmland: chance [0-1] per try.
		#Range: 0.0 ~ 1.0
		richFarmlandChance = 0.35
		#Fertile Soil (Immersive Weathering mulch): extra tries.
		#Range: 0 ~ 8
		fertileSoilTries = 2
		#Fertile Soil: chance [0-1] per try.
		#Range: 0.0 ~ 1.0
		fertileSoilChance = 0.25
		#Untilled Rich Soil (only rice and adzuki grow on it): extra tries.
		#Range: 0 ~ 8
		richSoilTries = 2
		#Untilled Rich Soil: chance [0-1] per try.
		#Range: 0.0 ~ 1.0
		richSoilChance = 0.35

		#true: the crop gets the soil pools above. false: its drops are the same on every soil.
		[crop_drops.soil_yield.crops]
			wheat = false
			carrots = false
			potatoes = false
			beetroots = false
			cabbages = false
			onions = false
			tomatoes = false
			rice = false
			bell_peppers = false
			coffee = false
			cotton = false
			ender_crop = false
			tobacco = false
			flax = false
			hemp = false
			corn = false
			cave_carrots = false
			broccoli = false
			cauliflower = false
			garlic = false
			sweet_potato = false
			turnip = false
			zucchini = false
			cucumber = false
			oats = false
			peanuts = false
			adzuki = false

#A stem that has grown its fruit (melon, pumpkin, hamimelon) can grow more on its other free
#sides, one at a time. Each extra fruit uses vanilla's stem growth roll (light, soil and
#hydration count the same) and also waits a minimum time since the stem's last fruit. The
#wait counts from the first random tick after a fruit grows. When the fruit the stem faces is
#taken, the stem turns to another of its fruits instead of back into a plain stem. Server side.
[stem_fruit]
	#Master on/off switch. Off = vanilla (one fruit per stem).
	enabled = true
	#Most fruits next to one stem (1 = vanilla, 4 = every side).
	#Range: 1 ~ 4
	maxFruits = 4
	#Minimum game minutes (1200 ticks) after the first fruit before a 2nd can grow.
	#Range: 0 ~ 1440
	secondFruitMinutes = 10
	#Minimum game minutes after the 2nd fruit before a 3rd can grow.
	#Range: 0 ~ 1440
	thirdFruitMinutes = 20
	#Minimum game minutes after the 3rd fruit before a 4th can grow.
	#Range: 0 ~ 1440
	fourthFruitMinutes = 40

#Ore Excavation's /undo_excavation. An undo is refused when the vein mine broke a block in
##creativeengineering:vein_undo_denied (ores, storage blocks, budding blocks, spawners, ancient
#debris; filled by KubeJS). Server side.
[vein_undo]
	#Seconds a player waits after a successful undo before the next one. 0 = none.
	#Range: 0 ~ 3600
	cooldownSeconds = 5
	#Also refuse when the vein mine broke a block with a block entity (chests, furnaces...).
	#A restored chest keeps its unrolled loot table, so mine-and-undo would reroll structure loot.
	denyBlockEntities = true

#Sophisticated Backpacks skins: a block smithed onto a backpack changes how it looks.
[backpackSkins]
	#Off: a skinned backpack cannot go in the chest slot or a Curios slot (so it is never worn).
	#On: it can, and the skin block is drawn on the back.
	allowEquip = false

#Moss block and moss carpet colour (client only; the server ignores this section).
[moss]
	#On: moss block and moss carpet take the biome's grass colour, like grass blocks.
	#Off: vanilla's fixed green moss. Read when models load: press F3+T or restart after changing it.
	biomeTint = true
	#How far moss follows the grass colour. 1.0 = shifts as much as grass does from Lush Caves
	#grass (where moss keeps its vanilla green); 0.0 = vanilla green everywhere. Chunks pick up
	#a change when they re-render (F3+A).
	#Range: 0.0 ~ 1.0
	tintStrength = 1.0

#Stepstools: a stool in the Curios feet slot. Standing still and holding the step-up keys stands the
#player on it, a block higher; moving, crouching or jumping steps off.
[stepstool]
	enabled = true
	#Client: holding Sprint + Jump steps up. The "Step Up (Stepstool)" key in Controls works too
	#(unbound by default); set this false to use only that key. While false, Sprint + Jump jumps as usual.
	sprintJump = true
	#Client: ticks the step-up keys must be held before stepping up (20 = 1 second).
	#Range: 0 ~ 100
	holdTicks = 5
	#Blocks the player may drift sideways from the stool's centre (knockback, pistons) before stepping off.
	#Range: 0.05 ~ 0.5
	maxDrift = 0.3
	#Taking damage knocks the player off the stool.
	stepOffWhenHurt = true

#Fully oxidized Everything Copper gear (armor worn, or any piece in the hotbar or
#offhand) poisons its holder now and then, and the Copper Poisoning effect (copper
#nuggets) gives Poison instead of dealing damage itself.
[copper_poisoning]
	#Roll for poison from oxidized gear.
	enabled = true
	#Average seconds between rolls, per player.
	#Range: 10 ~ 86400
	intervalSeconds = 300
	#Random spread either side of intervalSeconds.
	#Range: 0 ~ 86400
	jitterSeconds = 120
	#Chance per fully oxidized piece that a roll poisons; pieces roll independently, so
	#n pieces give 1 - (1 - chancePerPiece)^n.
	#Range: 0.0 ~ 1.0
	chancePerPiece = 0.15
	#Poison I duration with one oxidized piece.
	#Range: 1 ~ 600
	baseSeconds = 4
	#Extra Poison seconds per oxidized piece after the first.
	#Range: 0 ~ 600
	secondsPerExtraPiece = 2
	#Cap on the Poison duration from one roll.
	#Range: 1 ~ 600
	maxSeconds = 20
	#Poison I seconds the Copper Poisoning effect gives per effect level (a copper nugget
	#gives level II, so twice this).
	#Range: 1 ~ 600
	effectPoisonSeconds = 4

#Plain Dandelions mature into Mature Dandelions when planted on Rich Soil / Rich Soil Farmland
#or Fertile Soil. Values are the average number of soil random ticks per conversion
#(about one random tick a minute per block at the default randomTickSpeed). 0 = off for that soil.
#Takes effect immediately.
[dandelion_maturing]
	#Rich Soil and Rich Soil Farmland (Farmer's Delight).
	#Range: 0 ~ 100000
	richSoilTicks = 20
	#Fertile Soil (Immersive Weathering's mulch block).
	#Range: 0 ~ 100000
	fertileSoilTicks = 10

#Shears on a modded vine (Floral Enchantment's flower vines, Botania's solid vine) stop it growing,
#as Quark's Shear Vines does for the vanilla vine. Shears on the tip of a weeping, twisting or cave
#vine or kelp stop it growing longer (1.20's behaviour).
[vine_shearing]
	#Shears stop vines growing. Off: shears do nothing to vines (vines already sheared stay so).
	enabled = true
	#Shearing a modded vine also removes the same vine hanging below it, as Quark does.
	cutBelow = true
	#Client: a sheared modded vine is drawn with its bottom trimmed, like Quark's cut vine. Read when
	#models load: press F3+T or restart after changing it.
	trimmedLook = true

#Quark monster boxes (server side).
[monster_box]
	#true: a box stays after it spawns its wave, ejects one reward when the wave is gone, then waits
	#cooldownTicks before it can trigger again; it only breaks while sneaking, and Create drills skip it.
	#false: Quark's own box (breaks itself after spawning).
	vaultMode = true
	#Game ticks between the reward and the box re-arming (72000 = 1 hour).
	#Range: > 20
	cooldownTicks = 72000
	#Loot table rolled once for the reward; one stack of the result is ejected.
	rewardTable = "creativeengineering:misc/monster_box_reward"
	#true: the ejected stack is cut to 1 item; false: the stack as the table rolled it.
	rewardSingleCount = false
	#A wave mob farther than this many blocks from its box counts as gone.
	#Range: 4 ~ 256
	leashRange = 24
	#Ticks between checks of an active box's wave.
	#Range: 1 ~ 200
	checkIntervalTicks = 20

#Every crop has a type (block tags creativeengineering:crop_seasons/<type>, filled from
#kubejs/generation_scripts/worldgen/crop_seasons.json). Each season is fertile (grows faster),
#neutral or off (grows slower) for that type, read from the biome's own calendar: spring to winter
#in temperate and cold biomes, wet and dry in tropical, dry and arid ones. Replaces Serene Seasons'
#in/out of season rule (its fertility.toml seasonal_crops is off). A crop in no type grows as usual.
[crop_seasons]
	#false: no crop seasons at all (crops grow at their own speed everywhere).
	enabled = true
	#Fertile: this share of growth checks gets a second growth check right after (0.25 = 25 % faster).
	#Range: 0.0 ~ 1.0
	fertileBonus = 0.25
	#Off: this share of growth checks is refused (0.25 = 25 % slower).
	#Range: 0.0 ~ 1.0
	offPenalty = 0.25
	#Greenhouse glass: any block in #sereneseasons:greenhouse_glass (filled from crop_seasons.json
	#greenhouse_glass: glass blocks, panes, doors and trapdoors) in the 16 blocks straight above a seasonal
	#crop makes every season neutral (no fertile bonus, no off penalty). Only that column counts.
	greenhouse = true
	#Cave crops (cave carrots, glow berries) are fertile below this height.
	#Range: -64 ~ 320
	caveFertileBelowY = 0
	#Cave crops are off above this height; neutral in between.
	#Range: -64 ~ 320
	caveOffAboveY = 128

#A listed mob that spawns for one of the listed reasons has a small chance to get a random name
#(Minecraft Comes Alive's citizen names, else fallbackNames). Its death is announced in chat.
#Mobs already named are left alone; bred, egg, spawner and command mobs never roll.
[named_mobs]
	#Off: no new names. Mobs named earlier keep their name and announcement.
	enabled = true
	#Chance per eligible spawn. 0.01 = 1 in 100.
	#Range: 0.0 ~ 1.0
	chance = 0.01
	#Entity ids, or #entity type tags, that can be named.
	mobs = ["minecraft:cow", "minecraft:mooshroom", "minecraft:pig", "minecraft:sheep", "minecraft:chicken", "minecraft:goat"]
	#Spawn reasons that roll: NATURAL, CHUNK_GENERATION, STRUCTURE (see MobSpawnType for the rest).
	spawnReasons = ["NATURAL", "CHUNK_GENERATION", "STRUCTURE"]
	#Every player sees a named mob's death message ("Bessie the Cow was slain by Steve").
	#Follows the showDeathMessages gamerule.
	announceDeaths = true
	#Names used when Minecraft Comes Alive is missing or its name lists are not loaded.
	fallbackNames = ["Bessie", "Clover", "Daisy", "Biscuit", "Maple", "Pepper", "Hazel", "Barnaby", "Rosie", "Winston", "Mabel", "Otis", "Juniper", "Gus", "Poppy", "Waffles"]

