
[pumpkin_pie]
	#Which placed pie a vanilla Pumpkin Pie becomes when used on a block. Three mods have one:
	#FARMERSDELIGHT (Farmer's Delight 1.3.4, slices into Slice of Pumpkin Pie), DELIGHTFUL (Delightful's),
	#CREATE_CENTRAL_KITCHEN (Central Kitchen's). OFF leaves it to whichever of those mods acts first.
	#A change needs a restart (an edit of the file while the game runs is not picked up). A choice whose mod
	#is missing falls back to OFF.
	#Allowed Values: FARMERSDELIGHT, DELIGHTFUL, CREATE_CENTRAL_KITCHEN, OFF
	placeAs = "FARMERSDELIGHT"
	#Only place the pie while sneaking (Farmer's Delight 1.3.4 enablePumpkinPieSneakToPlace).
	sneakToPlace = false

[villagers]
	#Blocks a Farmer villager walks to and works besides vanilla Farmland (Farmer's Delight 1.3.4
	#VillagersTargetRichSoilMixin, widened to a list). Defaults: Rich Soil Farmland and Fertile Soil
	#(Immersive Weathering mulch). Only farmland-type blocks are kept (villagers plant only on those);
	#others are ignored with a warning in the log. Empty list: vanilla behaviour.
	farmlandBlocks = ["farmersdelight:rich_soil_farmland", "immersive_weathering:mulch_block"]

