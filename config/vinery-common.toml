	#Range: 1 ~ 10000
	totalFermentationTime = 6000
	#Juice units an Aging Barrel holds
	#Range: 100 ~ 10000
	maxFluidLevel = 100
	#Juice units one juice bottle adds
	#Range: 1 ~ 10000
	maxFluidIncrease = 25
	#Range: 1 ~ 10000
	applePressMashingTime = 600
	#Range: 1 ~ 10000
	applePressFermentationTime = 800
	#Range: 0.0 ~ 1.0
	cherryGrowthChance = 0.4
	#Range: 0.0 ~ 1.0
	appleGrowthChance = 0.4
	#Port (D10): chance that picking cherries also drops a rotten cherry, as in 1.3.10. 0 = never (1.5.5)
	#Range: 0.0 ~ 1.0
	rottenCherryChance = 0.15
	#Range: 0.0 ~ 1.0
	grapeGrowthChance = 0.5
	#Multiplies the growth chance of grape bushes, stems and lattices
	#Range: 0.0 ~ 10.0
	grapeGrowthMultiplier = 1.0
	#Stomps a full Grapevine Pot needs
	#Range: 1 ~ 100
	grapevinePotStomps = 12
	#Extra stomp progress in percent for an entity with 15 or more armor
	#Range: 0 ~ 100
	grapevinePotHeavyArmorBonus = 10
	grapevinePotSplashParticles = true
	#Red and white grapevine stems grow grapevine leaves around them
	grapevineLeavesEnabled = true

[wine]
	#Wines age at all
	agingEnabled = true
	#Wines only age while they sit in a storage block (rack, shelf, placed bottle...)
	ageOnlyInStorage = false
	#Longest effect a wine can reach, in ticks
	#Range: 1 ~ 100000
	maxDuration = 15000
	#Highest effect level from aging
	#Range: 0 ~ 10
	maxLevel = 5
	#Effect ticks a wine gains per year of age
	#Range: 0 ~ 10000
	durationPerYear = 200
	#Aging speed in a storage block with no sky light
	#Range: 1.0 ~ 5.0
	cellarAgingMultiplier = 1.5
	#Aging days per wine year (1.3.10 pack value: 16)
	#Range: 1 ~ 100
	daysPerYear = 16
	#Wine years per effect level (1.3.10 pack value: 2)
	#Range: 1 ~ 100
	yearsPerEffectLevel = 2
	#wine|effect|amplifier|durationTicks per wine (1.5.5 defaults plus the two 1.3.10 wines the port keeps)
	effects = ["vinery:apple_cider|minecraft:strength|0|1800", "vinery:apple_wine|minecraft:resistance|0|1800", "vinery:mead|minecraft:haste|0|1800", "vinery:glowing_wine|minecraft:glowing|0|1800", "vinery:solaris_wine|minecraft:health_boost|0|1800", "vinery:kelp_cider|vinery:water_walker|0|1800", "vinery:eiswein|vinery:frosty_armor|0|1800", "vinery:aegis_wine|vinery:armor_effect|0|1800", "vinery:villagers_fright|minecraft:bad_omen|0|1800", "vinery:clark_wine|vinery:double_jump|0|1800", "vinery:jellie_wine|vinery:jellie|0|1800", "vinery:noir_wine|minecraft:jump_boost|0|1800", "vinery:red_wine|minecraft:slow_falling|0|1800", "vinery:strad_wine|minecraft:night_vision|0|1800", "vinery:cherry_wine|minecraft:invisibility|0|1800", "vinery:cristel_wine|minecraft:water_breathing|0|1800", "vinery:lilitu_wine|vinery:party_effect|0|1800", "vinery:jo_special_mixture|vinery:climbing_effect|0|1800", "vinery:bolvar_wine|vinery:lava_walker|0|1800", "vinery:magnetic_wine|vinery:magnet|0|1800", "vinery:stal_wine|vinery:health_effect|0|1800", "vinery:chenet_wine|vinery:climbing_effect|0|1800", "vinery:bottle_mojang_noir|vinery:experience_effect|0|1800", "vinery:chorus_wine|vinery:teleport|0|10", "vinery:creepers_crush|vinery:creeper_effect|0|100", "vinery:mellohi_wine|minecraft:instant_health|0|1", "vinery:praetorian_wine|minecraft:glowing|0|1800", "vinery:king_danis_wine|minecraft:instant_health|0|1"]

[aging]
	#What moves the vintage clock wines age on: PLAYTIME (a player is online), SERVER_TICKS (always, 1.5.5), WORLD_TIME (overworld day time, 1.3.10)
	#Allowed Values: PLAYTIME, SERVER_TICKS, WORLD_TIME
	clockMode = "PLAYTIME"
	#Real hours of clock time per wine year (dayUnit AGING). 28.2 = the pack's 1.3.10 pace: 16 Better Days days of about 106 min
	#Range: 0.01 ~ 10000.0
	playtimeHoursPerYear = 28.2
	#AGING: a day is playtimeHoursPerYear / daysPerYear. WORLD: a day is one world day as players see it (worldDayMinutes)
	#Allowed Values: AGING, WORLD
	dayUnit = "AGING"
	#dayUnit WORLD: real minutes per world day. 0 = measure it from the overworld day time (follows Better Days)
	#Range: 0.0 ~ 100000.0
	worldDayMinutes = 0.0
	#1.3.10 wines (Year NBT): the year_length_in_days the old jar used, to convert their age once (pack: 16)
	#Range: 1 ~ 1000
	legacyYearLengthDays = 16

[banner]
	#The Vinery banner gives Regeneration II to players within 8 blocks
	giveEffect = true
	showTooltip = true

[trader]
	#Chance that a Wandering Trader spawn is a Wandering Winemaker. The pack spawns the winemaker itself (patcherMod WinemakerSpawner): 0
	#Range: 0.0 ~ 1.0
	spawnChance = 0.0
	spawnWithMules = true
	#Range: 0 ~ 72000
	spawnDelay = 48000

