
[widget]
	#Show the diet bonus bar on the survival inventory. When off, diet effects show like any other effect.
	enabled = true
	#Locked: the bar stays put and a click opens the diet bonus screen. Toggle in game with Shift+T.
	locked = true
	#Bar position relative to the inventory's left edge.
	#Range: -2000 ~ 2000
	x = 0
	#Bar position relative to the inventory's top edge.
	#Range: -2000 ~ 2000
	y = 166

[dietLog]
	#Diet Log progress bar: how many milestones ahead of the last one reached it shows.
	#Range: 1 ~ 50
	progressAhead = 3
	#The Diet Log opens as two pages, foods still in the window on the left and the first page of
	#foods out of the window on the right. Needs a screen wide enough for both pages.
	doublePage = true

