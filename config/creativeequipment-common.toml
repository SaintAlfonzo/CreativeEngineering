#A charm item (see #creativeengineering:bonemeal_charms) held in the OTHER hand
#from bone meal gives a chance to refund the bone meal that was just used, at
#the cost of a chance to damage the charm itself.
[bonemeal_charm]
	#Master on/off switch.
	enabled = true
	#Chance [0-1] to refund the bone meal used while a charm is held.
	#Range: 0.0 ~ 1.0
	chance = 0.5
	#Chance [0-1] the charm takes durability damage per use (rolled independently of chance).
	#Range: 0.0 ~ 1.0
	damageChance = 0.1
	#Durability damage dealt to the charm when damageChance hits.
	#Range: 0 ~ 100
	damagePerUse = 1

#Bottled Air port: right-click a glass bottle in water to breathe from it. The fire sources that
#evaporate the filled bottle in the other hand are #creativeengineering:bottled_air/fire_sources.
[bottled_air]
	enabled = true
	#Air a bottle gives (vanilla's full supply is 300).
	#Range: 0 ~ 1000
	airPerBottle = 150
	#A water bottle can't be drunk while under water (else it is endless air).
	noDrinkingUnderwater = true
	#A fire source in the other hand evaporates the water bottle the fill made, giving the glass bottle back.
	fireEvaporates = true
	#Chance the glass bottle breaks when the water is evaporated.
	#Range: 0.0 ~ 1.0
	bottleBreakChance = 0.5

#Sophisticated Backpacks skins: a block smithed onto a backpack changes how it looks.
[backpackSkins]
	#Off: a skinned backpack cannot go in the chest slot or a Curios slot (so it is never worn).
	#On: it can, and the skin block is drawn on the back.
	allowEquip = false

#Item tooltips (client side).
[tooltips]
	#Every item that fits a Curios slot shows Curios' "Slot:" line, also when the item's own mod
	#hides or replaces it. Off: only the lines Curios and the item's mod add.
	curiosSlotLine = true

