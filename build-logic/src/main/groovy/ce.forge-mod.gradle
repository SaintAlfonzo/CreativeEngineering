// Shared setup for every in-tree Forge mod (creativeCommon, exposureBackport, ...). A mod's build.gradle applies
// `id 'ce.forge-mod'` and adds only what is specific to it (dependencies, extra source sets, compiler args).
//
// Reads from the root gradle.properties: minecraft_version(_range), forge_version(_range),
// loader_version_range, mapping_channel, mapping_version.
// Reads from <mod>/gradle.properties:
//   mod_id, mod_name, mod_license, mod_version, mod_group_id, mod_authors, mod_description
//   jar_name        optional, jar file prefix (default mod_id): <jar_name>-<mod_version>.jar
//   mixin_configs   optional, comma-separated mixin configs for the jar manifest (default <mod_id>.mixins.json;
//                   `none` = the jar has no mixins, no MixinConfigs attribute)
//   replaces_jars   optional, comma-separated globs of other mods/ jars that installToMods moves out
//                   (for a jar that replaces a third-party mod with the same mod id)
//   bundled_in      optional, the Gradle project that ships this mod nested in its own jar (Creative Delight):
//                   this project's installToMods then refuses and names that project's task instead
//   shipped_jar_task  optional, the archive task whose jar is the one that ships (default `jar`). Set by
//                   ce.forge-repack (`repackJar`) and ce.forge-bundle (`bundleJar`), not by hand; archiveJar
//                   and installToMods use it
//   shared_sources  optional, comma-separated modules of development/shared/ compiled into this jar
//                   (feature_writeup/pack_tooling.md, "Shared Java sources")
//   shared_base     this mod's base package, required with shared_sources: the template packages ce.shared and
//                   ce.mixin become <shared_base>.shared and <shared_base>.mixin. Each jar carries its own copy under its
//                   own package, so no mod needs another at runtime
//   disable_target_validator  optional, `true` adds -AdisableTargetValidator=true to compileJava: for mixins that use
//                   SRG member names with remap = false (no refmap), so the AP doesn't reject them against the dev-time
//                   (Mojmap) classes. ce.forge-repack always sets the flag
//   resource_guard_jars  optional, comma-separated jars (paths from the instance root; `*` allowed in the file name,
//                   first match) whose files src/main/resources must not repeat: adds checkNoUpstreamResources (or
//                   checkNoArrResources with resource_guard_arr=true) to check and jar. A missing jar is skipped.
//                   (Not `upstream_jar`: that is the donor/repack jar of ce.forge-repack and the port tools.)
//   resource_guard_own_files  the resource paths the mod may share with those jars (root files it writes itself)
//   resource_guard_name  the upstream mod's name, for the task description
//   resource_guard_arr   optional, `true` for an All Rights Reserved upstream (the installed jar): ARR task name and message
//
// Every mod gets the `libs/` flatDir repository (third-party mod jars copied from the pack's mods/, git-ignored);
// flatDir notation: 'local:<file name without -version>:<version>'.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
}

def prop = { String key, String fallback = null -> (project.findProperty(key) ?: fallback)?.toString() }
def modId = prop('mod_id')
def jarName = prop('jar_name', modId)
def csv = { String key, String fallback = '' -> prop(key, fallback).split(',')*.trim().findAll { it } }

version = prop('mod_version')
group = prop('mod_group_id')

base {
    archivesName = jarName
}

repositories {
    flatDir { dir 'libs' }
}

// Mojang ships Java 17 to end users in 1.18+.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: prop('mapping_channel'), version: prop('mapping_version')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', modId

            // A mod with extra source sets adds them to this entry in its own build.gradle.
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        gameTestServer {}

        data {
            workingDirectory project.file('run-data')
            args '--mod', modId, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// shared_sources: copy the listed development/shared/<module>/ trees into build/generated/sources/shared with the
// template package moved to shared_base, and compile them as part of main.
def sharedModules = csv('shared_sources')
if (sharedModules) {
    def sharedBase = prop('shared_base')
    if (!sharedBase) throw new GradleException("${project.name}: shared_sources needs shared_base (this mod's base package)")
    def sharedSources = tasks.register('sharedSources', Sync) {
        description = "Copies development/shared/{${sharedModules.join(',')}} into ${sharedBase}"
        inputs.property('sharedBase', sharedBase)
        sharedModules.each { m ->
            def dir = rootProject.file("development/shared/${m}")
            if (!dir.isDirectory()) throw new GradleException("${project.name}: no shared module ${dir}")
            from(dir) { include '**/*.java' }
        }
        into layout.buildDirectory.dir('generated/sources/shared')
        includeEmptyDirs = false
        duplicatesStrategy = DuplicatesStrategy.FAIL
        eachFile { it.path = it.path.replaceFirst(/^ce\//, sharedBase.replace('.', '/') + '/') }
        filter { String line -> line.replaceAll(/\bce\.(shared|mixin)\b/, sharedBase + '.$1') }
    }
    sourceSets.main.java.srcDir(sharedSources)
}

dependencies {
    minecraft "net.minecraftforge:forge:${prop('minecraft_version')}-${prop('forge_version')}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Dev runs: match the loader libraries of the real Forge 43.3.9 install (instance.json libraries). Forge's
// POMs use open ranges that now resolve newer deps: log4j-api 2.19 against core 2.17 (NoSuchMethodError
// LoaderUtil.getClassLoaders), a second slf4j binding, and coremods' forgespi 7.x + net.minecraftforge:
// modlauncher/securemodules; securemodules also calls itself cpw.mods.securejarhandler, so the runs died with
// "Module com.google.common reads more than one module named cpw.mods.securejarhandler". FG builds the run
// classpath from its own `minecraft` configuration, so this has to cover every configuration.
configurations.configureEach {
    resolutionStrategy.force 'net.minecraftforge:forgespi:6.0.0', 'net.minecraftforge:unsafe:0.2.0',
            'org.apache.logging.log4j:log4j-api:2.17.0', 'org.apache.logging.log4j:log4j-core:2.17.0'
    exclude group: 'net.minecraftforge', module: 'securemodules'
    exclude group: 'net.minecraftforge', module: 'modlauncher'
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

if (prop('disable_target_validator') == 'true') {
    tasks.named('compileJava', JavaCompile).configure {
        options.compilerArgs << '-AdisableTargetValidator=true'
    }
}

// resource_guard_jars: the jar must not carry upstream resources (licence and port guard: miners_delight.md D2, alcohol.md
// B4.8, rustic, Ender's ARR). Fail the build if a file under src/main/resources has the same path as a file in one
// of the jars, except resource_guard_own_files.
def upstreamJars = csv('resource_guard_jars').collect { String path ->
    def f = rootProject.file(path)
    f.name.contains('*') ? f.parentFile.listFiles()?.find { it.name ==~ f.name.replace('.', '\\.').replace('*', '.*') } : f
}
if (upstreamJars) {
    def ownFiles = csv('resource_guard_own_files') as Set
    def arr = prop('resource_guard_arr') == 'true'
    def checkName = arr ? 'checkNoArrResources' : 'checkNoUpstreamResources'
    def what = arr ? "the installed ${prop('resource_guard_name')} (ARR) jar" :
            (upstreamJars.size() > 1 ? "an upstream ${prop('resource_guard_name')} jar" : "the upstream ${prop('resource_guard_name')} jar")
    tasks.register(checkName) {
        group = 'verification'
        description = "Fails if src/main/resources contains a path that also exists in ${what}"
        def resDir = file('src/main/resources')
        inputs.dir(resDir)
        doLast {
            def ours = [] as Set
            resDir.eachFileRecurse(groovy.io.FileType.FILES) { ours << resDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            def clashes = []
            upstreamJars.findAll { it?.exists() }.each { jar ->
                new java.util.zip.ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (!e.directory && ours.contains(e.name) && !ownFiles.contains(e.name)) {
                            clashes << (upstreamJars.size() > 1 ? "${e.name} (${jar.name})" : e.name)
                        }
                    }
                }
            }
            if (clashes) {
                def head = arr ? "paths also in ${upstreamJars.find { it?.exists() }.name} (ARR):" : 'upstream files in src/main/resources:'
                throw new GradleException(head + '\n  ' + clashes.join('\n  '))
            }
        }
    }
    tasks.named('check') { dependsOn checkName }
    tasks.named('jar') { dependsOn checkName }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version   : prop('minecraft_version'), minecraft_version_range: prop('minecraft_version_range'),
            forge_version       : prop('forge_version'), forge_version_range: prop('forge_version_range'),
            loader_version_range: prop('loader_version_range'),
            mod_id              : modId, mod_name: prop('mod_name'), mod_license: prop('mod_license'),
            mod_version         : prop('mod_version'), mod_authors: prop('mod_authors'),
            mod_description     : prop('mod_description'),
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

def mixinConfigs = csv('mixin_configs', "${modId}.mixins.json").findAll { it != 'none' }

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : modId,
                'Specification-Vendor'    : prop('mod_authors'),
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : prop('mod_authors'),
        ] + (mixinConfigs ? ['MixinConfigs': mixinConfigs.join(',')] : [:]))
    }

    finalizedBy 'reobfJar'
}

// Reproducible jars: no build timestamp in the manifest, fixed entry order and entry times. Rebuilding
// unchanged source gives a byte-identical jar, so a root `./gradlew build` that repacks every mod changes
// nothing downstream (same sha1 in mods/, no false "differs from build/libs" deploy warning).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// License files in the mod's folder (GPLv3 LICENSE / LICENSE.txt, upstream NOTICE-*) go into its jar.
// A mod whose mod_license names the GPL and whose folder has no LICENSE file stops the build, so no jar ships
// without the licence text (plan_cb_publish.md M6).
def checkLicenseFile = tasks.register('checkLicenseFile') {
    def license = prop('mod_license', '')
    def hasFile = ['LICENSE', 'LICENSE.txt'].any { new File(projectDir, it).isFile() }
    inputs.property('mod_license', license)
    inputs.property('has_license_file', hasFile)
    doLast {
        if (license.contains('GPL') && !hasFile) {
            throw new GradleException("${project.path}: mod_license '${license}' names the GPL but ${projectDir} " +
                    "has no LICENSE or LICENSE.txt; copy development/creativeCommon/LICENSE.txt there")
        }
    }
}
tasks.named('jar', Jar).configure {
    dependsOn checkLicenseFile
    from(projectDir) {
        include 'LICENSE', 'LICENSE.txt', 'NOTICE*'
        rename { "${jarName}-${it}" }
    }
}

// The jar that ships: `jar` (reobfed in place), or the repack / bundle of ce.forge-repack / ce.forge-bundle.
// Resolved at execution time, since those plugins register their task after this one is applied.
def shippedJarTask = { tasks.named(prop('shipped_jar_task', 'jar'), AbstractArchiveTask).get() }

// jar_archive/ (git-ignored) keeps one jar per mod_version so released versions survive `gradlew clean`.
// A build only adds a version that isn't there yet, so dev rebuilds never replace a released jar;
// tools/build_deploy.py stores the jar it actually ships.
def archiveJar = tasks.register('archiveJar', Copy) {
    dependsOn 'reobfJar', { shippedJarTask() }
    from { shippedJarTask().archiveFile }
    into "${projectDir}/jar_archive"
    eachFile { if (new File("${projectDir}/jar_archive", it.name).exists()) it.exclude() }
}
tasks.named('build').configure { finalizedBy archiveJar }

// Explicit only (never part of `build`): put this build's jar into the instance's mods/. Older versions
// of this mod and anything matching replaces_jars are MOVED to jar_archive/displaced/, not deleted.
// Don't run it while the game is running.
tasks.register('installToMods') {
    group = 'ce'
    description = "Builds ${jarName} and swaps it into ../mods (old versions -> jar_archive/displaced/)"
    dependsOn 'build', { shippedJarTask() }
    doFirst {
        def bundledIn = prop('bundled_in')
        if (bundledIn) {
            throw new GradleException("${project.name} ships nested in ${bundledIn}'s jar, not on its own: " +
                    "run ./gradlew :${bundledIn}:installToMods")
        }
    }
    doLast {
        def modsDir = rootProject.file('mods')
        def built = shippedJarTask().archiveFile.get().asFile
        def displaced = file('jar_archive/displaced')
        def matchers = (["${jarName}-*.jar"] + csv('replaces_jars')).collect {
            java.nio.file.FileSystems.default.getPathMatcher("glob:${it}")
        }
        modsDir.listFiles().findAll { f ->
            f.isFile() && f.name != built.name && matchers.any { it.matches(java.nio.file.Paths.get(f.name)) }
        }.each { f ->
            displaced.mkdirs()
            java.nio.file.Files.move(f.toPath(), new File(displaced, f.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("moved mods/${f.name} -> ${projectDir.name}/jar_archive/displaced/")
        }
        java.nio.file.Files.copy(built.toPath(), new File(modsDir, built.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
        logger.lifecycle("installed mods/${built.name}")
    }
}
