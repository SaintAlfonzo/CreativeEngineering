plugins {
    id 'groovy-gradle-plugin'
}

// The Gradle plugins the convention plugin (and the mods) apply by id. Putting them here keeps them in
// one classloader, which MixinGradle needs to find ForgeGradle's reobf tasks.
dependencies {
    implementation 'net.minecraftforge.gradle:ForgeGradle:[6.0,6.2)'
    implementation 'org.spongepowered:mixingradle:0.7.+'
}
