# Shared by every in-tree mod (creativeCommon, exposureBackport, ...). Per-mod properties (mod_id, mod_version,
# ...) are in <mod>/gradle.properties. Keep MC/Forge/mappings identical across mods: they then reuse the
# one decompiled Minecraft in ~/.gradle/caches/forge_gradle and build offline.

# Memory for Gradle; the Minecraft decompile step needs a few GB.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

minecraft_version=1.19.2
minecraft_version_range=[1.19.2,1.20)
forge_version=43.3.9
forge_version_range=[43,)
loader_version_range=[43,)
# official = Mojang names. Switching a mod to parchment would decompile a second Minecraft.
mapping_channel=official
mapping_version=1.19.2
